<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access denied — hardened mockup</title>
<style>
  /* Hardened system: today's tokens exactly. Neutral card — no alarm treatment. */
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #F5F4F2; color: #16191D;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px; padding: 48px 24px;
  }
  .card {
    background: #FFFFFF; border: 1px solid #E6E4E1; border-radius: 2px;
    width: 380px; max-width: 100%; padding: 32px;
  }
  .mark {
    font-size: 12px; font-weight: 700; letter-spacing: .14em;
    color: #2C2A27; margin-bottom: 24px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
  .card p { margin-bottom: 24px; }
  .secondary-action {
    display: inline-block; padding: 9px 16px; background: #FFFFFF;
    color: #16191D; border: 1px solid #2C2A27; border-radius: 2px;
    font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  a:focus { outline: 3px solid rgba(219, 8, 22, .38); outline-offset: 1px; }
  .foot { font-size: 13px; color: #6B6B6B; }
</style>
</head>
<body>

  <div class="card">
    <p class="mark">COLLISION ENGINEERS</p>
    <h1>Access denied</h1>
    <p>Your account does not have access to this page.</p>
    <a class="secondary-action" href="#">Return to Dashboard</a>
  </div>

  <p class="foot">Pegasus · Collision Engineers</p>
</body>
</html>
