<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signed out of Pegasus — hardened mockup</title>
<style>
  /* Hardened system: today's tokens exactly. */
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #F5F4F2; color: #16191D;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 40px; padding: 48px 24px;
  }
  .state-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: #6B6B6B; margin-bottom: 8px;
  }
  .card {
    background: #FFFFFF; border: 1px solid #E6E4E1; border-radius: 2px;
    width: 380px; max-width: 100%; padding: 32px;
  }
  .mark {
    font-size: 12px; font-weight: 700; letter-spacing: .14em;
    color: #2C2A27; margin-bottom: 24px;
  }
  h1 {
    font-size: 22px; font-weight: 600; margin-bottom: 24px;
    display: flex; align-items: center; gap: 10px;
  }
  .check {
    width: 22px; height: 22px; flex: none; border-radius: 50%;
    border: 1px solid #16833B; color: #16833B; font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .primary-action {
    display: block; width: 100%; padding: 10px 16px; text-align: center;
    background: #DB0816; color: #FFFFFF; border: 1px solid #DB0816;
    border-radius: 2px; font: inherit; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .button-row { display: flex; gap: 12px; }
  .button-row .primary-action { width: auto; }
  .secondary-action {
    display: inline-block; padding: 9px 16px; background: #FFFFFF;
    color: #16191D; border: 1px solid #2C2A27; border-radius: 2px;
    font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  a:focus, button:focus { outline: 3px solid rgba(219, 8, 22, .38); outline-offset: 1px; }
  .foot { font-size: 13px; color: #6B6B6B; }
</style>
</head>
<body>

  <div>
    <p class="state-label">Main state — signed-out confirmation (recommended)</p>
    <div class="card">
      <p class="mark">COLLISION ENGINEERS</p>
      <h1><span class="check" aria-hidden="true">&#10003;</span> You are signed out</h1>
      <a class="primary-action" href="#">Sign in</a>
    </div>
  </div>

  <div>
    <p class="state-label">Alternate — confirm interstitial (considered, not recommended)</p>
    <div class="card">
      <p class="mark">COLLISION ENGINEERS</p>
      <h1>Sign out of Pegasus?</h1>
      <div class="button-row">
        <a class="primary-action" href="#">Sign out</a>
        <a class="secondary-action" href="#">Cancel</a>
      </div>
    </div>
  </div>

  <p class="foot">Pegasus · Collision Engineers</p>
</body>
</html>
