# =====================================================================
# Collision Engineers — Report Sending SOP  (version 8, 15/10/2026)
# =====================================================================
# One file, three sections:
#   defaults    rules that apply to every principal unless overridden
#   sources     claim sources / introducers that conditional rules refer to
#   principals  one block per principal code (the code from our Our Ref)
#
# EDITING
#   - true / false fields are exactly that: true or false, lower case.
#   - Lists use "- item" or [a, b]. An empty list is [].
#   - null means "not applicable".
#   - After editing, run:  python scripts/validate_sop.py references/report-sending-sop.yaml
#
# PRINCIPAL FIELDS
#   name               Firm name (from the EVA contacts list)
#   status             confirmed | open  (open = has open_questions)
#   received_via       engineers | info | desk | whatsapp
#                        where instructions arrive. Reply from the mailbox the email
#                        actually arrived in. whatsapp = no email to reply to, so send
#                        a new email from send_from to send_to.
#   send_from          engineers | info | desk   (required when received_via is whatsapp)
#   send_to            original_sender  OR  a list of addresses.
#                        original_sender = the claims handler who sent the instruction.
#                        A list of addresses REPLACES the original sender.
#   send_to_only       true = the send_to addresses and nobody else (no CCs, no reply-all)
#   reply_all          true = keep everyone already copied on the instruction
#   cc                 always added
#   never_cc           always removed, even if copied on the instruction
#   attach:            everything below goes in the SAME email as the report
#     fee_note_separate        true  = the fee note is a separate PDF (same folder as the
#                                      report). If it isn't there, tell the user; this is
#                                      not a blocker.
#                              false = the fee note is inside the report PDF
#     estimate                 true = attach the estimate PDF
#     audatex                  true = attach the Audatex PDF
#     report_images            false = the report itself must contain NO vehicle images
#     vehicle_images_document  true = attach a separate document with the vehicle images.
#                                      Matched to the report by registration. If it is
#                                      missing, hold the email.
#     figure_breakdown         true = attach the estimate / figure breakdown PDF. Either
#                                      format counts: a Glass's calculation or an EVA
#                                      estimate export. It is matched to the report by
#                                      registration (it carries no case ref of its own).
#                                      If it is missing, hold the email.
#   garage_figures     true = on REPAIRABLE jobs the user sends the figures to the garage
#   tl_threshold       information for the user only, e.g. "78%"
#   hold               text = do not send until the user confirms this is done
#   reminders          after-sending tasks for the user
#   rules              conditional rules, see below
#   notes              anything else
#   open_questions     questions still to answer
#
# RULES   - if: <condition>
#           then: <actions>
#   Conditions (keys inside one "if" must ALL be true):
#     source: CODE             the instruction is from / mentions this claim source
#     bodyshop_mentions: CODE  the bodyshop details on the instruction mention this source
#     images_from: CODE        the vehicle images came from this source
#     mentions: "text"         the instruction mentions this text anywhere
#     sender_not: [addresses]  the instruction was NOT sent by any of these
#     report_status: repairable | total_loss
#     ref_prefix: a            our Our Ref carries this prefix (a.PCH26118). Letters only,
#                                without the dot.
#     previous_job: true       a report for this registration has already been sent on the
#                                same claim: an earlier send in Sent Items under a different
#                                Our Ref (see R13)
#     all: [conditions]        every one true
#     any: [conditions]        at least one true
#   Actions:
#     cc_add: [addresses]      cc_remove: [addresses]   (removals always win)
#     remind: "text"           tell the user after sending
#     hold: "text"             do not send until the user confirms
#     stop: "text"             do not prepare the email; tell the user
#     attach: {flag: true|false}  override the principal's attach flags for this job only
#                                 (same flag names as attach above)
#     rate_card: file.md       check the report's estimate against this rate card (a file in
#                                 references/). Any departure not covered by the instruction
#                                 holds the email; see R15.
#   Matching text is case-insensitive and ignores spaces ("Car Claims" = "CarClaims").
# =====================================================================

defaults:
  mailboxes:
    engineers: engineers@collisionengineers.co.uk
    info: info@collisionengineers.co.uk
    desk: desk@collisionengineers.co.uk
  send_to: original_sender    # the claims handler who sent the instruction email
  reply_all: true
  send_to_only: false
  attach:
    fee_note_separate: true   # fee note is a separate PDF unless the principal says false
    estimate: false
    audatex: false
    report_images: true
    vehicle_images_document: false
    figure_breakdown: false
  garage_figures: false
  new_email_subject: "{REG} Report"     # e.g. "AO60SDY Report"
  body_with_fee_note: |
    Good {morning|afternoon},

    Please see attached report and fee note.

    Any issues let us know.

    Kind Regards
  body_report_only: |
    Good {morning|afternoon},

    Please see attached report.

    Any issues let us know.

    Kind Regards
  unknown_principal: stop_and_ask     # alternative: reply_to_original_sender_no_cc

sources:
  ACSP:       {name: Accident Specialists,       match: ["Accident Specialist"]}
  CARCLAIMS:  {name: CarClaims,                  match: ["CarClaims"]}
  CAR2GO:     {name: Car 2 Go,                   match: ["Car2go", "Car 2 Go", "car2go-nw.co.uk"]}
  CS:         {name: Claim Specialists,          match: ["Claim Specialist", "Claims Specialist", "claimsspecialists.co.uk"]}
  EASDONS:    {name: Easdons,                    match: ["Easdons"]}
  EXPERT:     {name: Expert Claims,              match: ["Expert Claims"]}
  GUARDIAN:   {name: Guardian Accident Claims,   match: ["Guardian"]}
  HACKNEY:    {name: Hackney Solutions,          match: ["Hackney", "hackneysolutions.co.uk"]}
  IREVOLUTION: {name: iRevolution Repair Network, match: ["irevolution", "irev", "irevolutionrepairnetwork.co.uk"]}
  JAMESCLAIMS: {name: James Claims,              match: ["James Claims"]}
  RAPID:      {name: Rapid Rental Solutions,     match: ["Rapid"]}
  SMC:        {name: SMC,                        match: ["SMC", "shaunmarnell.co.uk"]}
  SWINTON:    {name: Swinton,                    match: ["Swinton"]}

