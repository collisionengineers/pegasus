const inventory = JSON.parse(document.getElementById("route-inventory").textContent);
const visualList = document.getElementById("visual-route-list");
const nonvisualList = document.getElementById("nonvisual-route-list");
for (const entry of inventory) {
  if (entry.classification === "visual") {
    for (const state of entry.states) {
      const item = document.createElement("li");
      const link = document.createElement("a");
      link.href = state.file;
      link.textContent = entry.route + " · " + state.state;
      item.append(link);
      visualList.append(item);
    }
  } else {
    const row = document.createElement("tr");
    for (const value of [entry.route, entry.classification, entry.reason]) {
      const cell = document.createElement("td");
      cell.textContent = value;
      row.append(cell);
    }
    nonvisualList.append(row);
  }
}
</script></main></body></html>
