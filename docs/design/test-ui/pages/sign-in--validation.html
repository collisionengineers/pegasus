<head>

<body>

    <div class="auth-shell">
        <main id="main-content" tabindex="-1">

<div class="auth-card">
    <p class="auth-card__mark">COLLISION ENGINEERS</p>
        <h1>Sign in to Pegasus</h1>
    <div class="validation-summary-errors validation-summary-errors" role="alert"><ul><li>The username or password is incorrect. If your access has changed, contact an administrator.</li>
</ul></div>
    <form method="post">
        <input type="hidden" id="ReturnUrl" name="ReturnUrl" value="dashboard--default.html" />
        <label for="UserName">
            Username
            <input autocomplete="username" autofocus type="text" data-val="true" data-val-length="The field Username must be a string with a maximum length of 256." data-val-length-max="256" data-val-required="Enter your username." id="UserName" maxlength="256" name="UserName" value="sign-in-audit-user" />
        </label>
        <span class="field-validation-valid" data-valmsg-for="UserName" data-valmsg-replace="true"></span>
        <label for="Password">
            Password
            <input autocomplete="current-password" type="password" data-val="true" data-val-length="The field Password must be a string with a maximum length of 256." data-val-length-max="256" data-val-required="Enter your password." id="Password" maxlength="256" name="Password" />
        </label>
        <span class="field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true"></span>
        <button type="submit" class="primary-action">Sign in</button>
    <input name="__RequestVerificationToken" type="hidden" value="{{antiforgery-token}}" /></form>
</div>

        </main>
    </div>
    <script src="../../../../src/Pegasus.Web/wwwroot/js/site.js"></script>

</body>
</html>
