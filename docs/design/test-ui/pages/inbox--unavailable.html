<header class="page-heading">
    <h1>Inbox</h1>
    <div class="refresh" data-refresh-region role="status" aria-live="polite">
        <span>Never updated</span>
        <span class="status-chip status-chip--neutral">
    <svg class="icon" aria-hidden="true"><use href="#icon-alert-circle" /></svg>
    <span>Unavailable</span>
</span>

    <form method="get" data-refresh-form>
        <button type="submit" title="Refresh" aria-label="Refresh">
            <svg class="icon icon--spin" aria-hidden="true"><use href="#icon-refresh-cw" /></svg>
            <span class="vh" data-refresh-label>Refresh</span>
        </button>
    </form>
</div>

</header>


<nav class="subtabs section-gap" aria-label="Folder">
        <a aria-current="page" href="inbox--default.html">Inbox</a>
        <a href="inbox--default.html">Sent</a>
        <a href="inbox--default.html">Deleted items</a>
</nav>

    <form method="get" class="panel filterbar section-gap" aria-label="Mail view">
        <div class="filterbar__line">
            <label for="mail-view">Queue or detailed classification</label>
            <select id="mail-view" name="queue">
                <option value="" selected="selected">All retained mail</option>
                <optgroup label="Operational queues">
                        <option value="receiving-work">Receiving work</option>
                        <option value="queries">Queries</option>
                        <option value="other">Other</option>
                        <option value="unidentified">Unidentified</option>
                        <option value="triage">Triage</option>
                </optgroup>
                <optgroup label="Detailed classifications">
                        <option value="classification:received:General:autoreply">General &#xB7; Autoreply</option>
                        <option value="classification:received:General:undeliverable">General &#xB7; Undeliverable</option>
                        <option value="classification:received:General:acknowledgement">General &#xB7; Acknowledgement</option>
                        <option value="classification:received:General:general-chase">General &#xB7; General chase</option>
                        <option value="classification:received:General:case-summary">General &#xB7; Case summary</option>
                        <option value="classification:received:Billing:payment-notification">Billing &#xB7; Payment notification</option>
                        <option value="classification:received:Billing:remittance">Billing &#xB7; Remittance</option>
                        <option value="classification:received:Billing:invoice-request">Billing &#xB7; Invoice request</option>
                        <option value="classification:received:Billing:general-billing">Billing &#xB7; General billing</option>
                        <option value="classification:received:NonClientRelated">Not client related</option>
                        <option value="classification:received:InProgressCases:cancellation">In-progress case &#xB7; Cancellation</option>
                        <option value="classification:received:InProgressCases:case-update">In-progress case &#xB7; Case update</option>
                        <option value="classification:received:InProgressCases:client-chasing-for-update">In-progress case &#xB7; Client chasing for update</option>
                        <option value="classification:received:InProgressCases:provider-chasing-for-update">In-progress case &#xB7; Provider chasing for update</option>
                        <option value="classification:received:InProgressCases:ongoing-correspondence">In-progress case &#xB7; Ongoing correspondence</option>
                        <option value="classification:received:PreInstructionEmails:pre-formal-instruction-request">Pre-instruction &#xB7; Pre formal instruction request</option>
                        <option value="classification:received:PreInstructionEmails:images-received">Pre-instruction &#xB7; Images received</option>
                        <option value="classification:received:InternalCc">Internal CC</option>
                        <option value="classification:sent:ReportSent">Sent &#xB7; Report sent</option>
                        <option value="classification:sent:CaseRejected">Sent &#xB7; Case rejected</option>
                        <option value="classification:sent:QuerySent">Sent &#xB7; Query sent</option>
                        <option value="classification:sent:AdditionalImageRequest">Sent &#xB7; Additional image request</option>
                </optgroup>
            </select>
            <button class="btn btn--dark" type="submit">Show view</button>
        </div>
    </form>

<form method="get" class="panel filterbar section-gap" role="search">
    <div class="filterbar__line">
        <label for="mail-search" class="vh">Search retained mail in current folders</label>
        <input id="mail-search" name="search" maxlength="200"
               placeholder="Message body or attachment" />
        <button class="btn btn--dark" type="submit">Search</button>
    </div>
</form>

    <div class="mark-empty">
    <img class="mark mark--md" src="../../../../src/Pegasus.Web/wwwroot/images/marks/mailboxes.png" alt="" aria-hidden="true" />
        <p class="empty-state">No mail has been received.</p>
    </div>
