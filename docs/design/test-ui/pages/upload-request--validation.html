<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload requested documents · Collision Engineers</title>
    <link rel="stylesheet" href="../../../../src/Pegasus.Web/wwwroot/css/site.css" />
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" class="sprite-sheet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="icon-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="icon-refresh-cw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></symbol>
  <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></symbol>
  <symbol id="icon-check-circle" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
  <symbol id="icon-alert-triangle" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></symbol>
  <symbol id="icon-alert-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
  <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="icon-file-text" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></symbol>
  <symbol id="icon-filter" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></symbol>
  <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
  <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>

  <symbol id="icon-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="icon-trash-2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></symbol>
</svg>

    <header class="app-nav">
        <div class="nav-inner">
            <span class="navbar-brand">
                <img src="../../../../src/Pegasus.Web/wwwroot/images/logo_no_margin.png" alt="Collision Engineers" />
            </span>
        </div>
    </header>
    <div class="app-shell">
        <main id="main-content" tabindex="-1">

<div class="form-column form-column--narrow">
    <header class="page-heading">
        <div>
            <p class="eyebrow">Secure document request</p>
            <h1>Upload requested documents</h1>
        </div>
    </header>

    <p>Documents submitted here go directly to Collision Engineers against the request you received; do not upload unrelated material.</p>


        <section class="panel section-gap" aria-labelledby="request-upload-title">
            <h2 id="request-upload-title" class="section-label">Choose a document</h2>
            <form method="post" enctype="multipart/form-data">
                <input type="hidden" data-val="true" data-val-required="The Token field is required." id="Token" name="Token" value="uWwK7IFvXwY_-cZYAKIc4TKXEN4VfZ69GjH6lQeMWwY" />
                <input type="hidden" data-val="true" data-val-required="The OperationKey field is required." id="OperationKey" name="OperationKey" value="{{operationkey}}" />

                <div class="dropzone dropzone--compact" data-dropzone>
                    <span class="dropzone__glyph" aria-hidden="true"><svg class="icon icon--lg"><use href="#icon-upload" /></svg></span>
                    <label for="Upload">Drag a file here, or choose one</label>
                    <span class="field-hint">Up to 1 KB.</span>
                    <input type="file" accept="text/plain" class="input-validation-error" id="Upload" name="Upload" />
                    <button type="button" class="btn dropzone__browse" hidden data-dropzone-browse>Choose file</button>
                    <p class="dropzone__file" role="status" aria-live="polite" hidden data-dropzone-file></p>
                </div>
                <span class="field-validation field-validation-error" data-valmsg-for="Upload" data-valmsg-replace="true">Choose a document to upload.</span>
                <button type="submit" class="primary-action primary-action--block">Upload document</button>
            <input name="__RequestVerificationToken" type="hidden" value="{{antiforgery-token}}" /></form>
        </section>
</div>

        </main>
    </div>
    <footer class="footer">
        <div class="footer-inner">Collision Engineers</div>
    </footer>
    <script src="../../../../src/Pegasus.Web/wwwroot/js/site.js"></script>

</body>
</html>
