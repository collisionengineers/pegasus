          format: date-time
        auctionlocation:
          title: AuctionLocation
          type: string
          description: Location description of the salvage auction
        auctionrecordid:
          title: AuctionRecordId
          type: string
          description: Auction lot identifer for the salvage marker
        id:
          title: ID
          type: string
          description: Experian identifer for the salvage marker
        mileage:
          title: Mileage
          type: string
          description: Mileage recorded at the time of salvage auction in miles
        primarydamagedescription:
          title: PrimaryDamageDescription
          type: string
          description: Primary damage description
        secondarydamagedescription:
          title: SecondaryDamageDescription
          type: string
          description: Secondary damage description
        status:
          title: Status
          type: string
          description: Auction lot description/status for the salvage marker
      description: Salvage auction vehicle condition data
    VehicleSmmtAdditionalData:
      title: SmmtAdditionalData
      properties:
        bodystyle:
          title: BodyStyle
          type: string
          description: The vehicle body style e.g. `ESTATE`, `MPV`.
        cabtype:
          title: CabType
          type: string
          description: For HGV’s only. Specifies the HGV cabin type.
        countryoforigin:
          title: CountryOfOrigin
          type: string
          description: The country the vehicle originated from.
        drivetype:
          title: DriveType
          type: string
          description: The total number of wheels the vehicle has and the number of these wheels that are driven e.g. `4X2` (four wheels total, two wheels driven).
        enginecapacity:
          title: EngineCapacity
          type: integer
          description: The total volume of the cylinders in the engine in cubic centimetres (cc).
          format: int32
        fueltype:
          title: FuelType
          type: string
          description: Type of fuel or power source used e.g. `PETROL`.
        marketsectorcode:
          title: MarketSectorCode
          type: string
          description: The two character code for the market sector of the model variant e.g. `AA` = car (excluding off road).
        marque:
          title: Marque
          type: string
          description: The vehicle make, as distinct from model e.g. `FORD`, `BMW`.
        marquecode:
          title: MarqueCode
          type: string
          description: The two character code that identifies the marque of the vehicle.
        modelcode:
          title: ModelCode
          type: string
          description: The code that identifies the model of the vehicle.
        modelvariant:
          title: ModelVariant
          type: string
          description: The label used by the manufacturer that is used to describe the vehicle. It includes more specific data to the make and model such as engine size, trim level, number of doors and the version.
        nominalenginecapacity:
          title: NominalEngineCapacity
          type: string
          description: The approximate engine size in litres (l). For an accurate measurement see `enginecapacity`.
        numberofdoors:
          title: NumberOfDoors
          type: string
          description: The number of doors the vehicle has.
        numberofgears:
          title: NumberOfGears
          type: integer
          description: The number of forward gears of the vehicle transmission.
          format: int32
        range:
          title: Range
          type: string
          description: The collective name for a family of model variants e.g. `FOCUS`, `3 SERIES`.
        series:
          title: Series
          type: string
          description: The factory code or the manufacturer's internal code which distinguishes the evolution of the model from the previous version(s). Series enables a vehicle within a model range to be distinguished from other models in the same model range.
        systemsetupdate:
          title: SystemSetupDate
          type: string
          description: The system setup date of the vehicle model variant.
          format: date-time
        terminationdate:
          title: TerminationDate
          type: string
          description: The termination date of the vehicle model variant.
          format: date-time
        transmission:
          title: Transmission
          type: string
          description: The transmission type e.g. `AUTOMATIC`, `MANUAL`, `CVT`.
        visibilitydate:
          title: VisibilityDate
          type: string
          description: The visibility date of the vehicle model variant.
          format: date-time
    VehicleSmmtDataV2:
      title: SmmtDataV2
      properties:
        dimensions:
          title: DimensionDetailsBlock
          type: boolean
          description: If true, the SMMT weight and dimension details associated with the vehicle will be returned.
        engine:
          title: EngineDetailsBlock
          type: boolean
          description: If true, the SMMT engine details associated with the vehicle will be returned.
        ev:
          title: EvBlock
          type: boolean
          description: If true, the SMMT ev details associated with the vehicle will be returned
        fueleconomy:
          title: FuelEconomyBlock
          type: boolean
          description: If true, the SMMT fuel economy information associated with the vehicle will be returned.
        makemodel:
          title: RawDescription
          type: boolean
          description: If true, the SMMT make/model description of the vehicle will be returned.
      description: Flags used when requesting additional Society of Motor Manufacturers and Traders (SMMT) data.
    VehicleSmmtDataV2Errors:
      title: SmmtDataV2Errors
      properties:
        dimensions:
          title: DimensionDetailsBlock
          type: string
          description: Error message relating to the dimensions request field
        engine:
          title: EngineDetailsBlock
          type: string
          description: Error message relating to the engine request field
        ev:
          title: EvBlock
          type: string
          description: Error message relating to the ev request field
        fueleconomy:
          title: FuelEconomyBlock
          type: string
          description: Error message relating to the fueleconomy request field
        makemodel:
          title: RawDescription
          type: string
          description: Error message relating to the makemodel request field
      description: Flags used when requesting additional Society of Motor Manufacturers and Traders (SMMT) data.
    VehicleSmmtEngineDetails:
      title: SmmtEngineDetails
      properties:
        aspiration:
          title: Aspiration
          type: string
          description: The method by which the engine breathes e.g. `NATURALLY ASPIRATED`, `SUPERCHARGER`, `TURBO`.
        bore:
          title: Bore
          type: string
          description: The internal diameter of each engine cylinder in millimetres (mm).
        cylinderarrangement:
          title: CylinderArrangement
          type: string
          description: |-
            The physical arrangement of the cylinders.

            One of the following:

            - `VEE` = The cylinders and pistons are aligned in two separate planes or 'banks' so that they appear to be in a 'V' when viewed along the axis of the crankshaft.

            - `INLINE` The cylinders are arranged in one row with no offset so that they are inline with one another.
        drivingaxle:
          title: DrivingAxle
          type: string
          description: The location of the axle(s) that provide the driving power from the engine to the driving wheels e.g. `REAR`.
        enginedescription:
          title: EngineDescription
          type: string
          description: The manufacturer specific engine description.
        enginelocation:
          title: EngineLocation
          type: string
          description: |-
            One of the following:

            `FRONT` = A front-mounted engine describes the placement of an automobile engine in front of the vehicle passenger compartment.

            `MIDDLE` = A mid-engine layout describes the placement of an automobile engine between the rear and front axles).

            `REAR` = A rear-engine design layout places the engine at the rear of the vehicle. The center of gravity of the engine itself is past the rear axle.
        enginemake:
          title: EngineMake
          type: string
          description: The brand name of the engine manufacturer.
        eurostatus:
          title: EuroStatus
          type: string
          description: The highest European engine standard which the engine meets as recorded in the vehicle registration certificate (V5C).
        numberofcylinders:
          title: NumberOfCylinders
          type: string
          description: The number of cylinders in the engine.
        powerdelivery:
          title: PowerDelivery
          type: string
          description: Descriptive field to indicate hybrid or non-hybrid powertrains.
        primaryfuelflag:
          title: PrimaryFuelFlag
          type: string
          description: |-
            One of the following:

            - `Y` = This is the main (or only for non-hybrid vehicles) driving engine.

            - `N` = This is a secondary driving engine in a hybrid vehicle.
        stroke:
          title: Stroke
          type: string
          description: The distance between top dead centre and bottom dead centre of engine piston travel in millimetres (mm).
        typeapprovalcategory:
          title: TypeApprovalCategory
          type: string
          description: The European Union (EU) vehicle category.
        valvegear:
          title: ValveGear
          type: string
          description: |-
            The abbreviation of valve operating gear where known.

            One of the following:

            - `SOHC` = Single OverHead Camshaft

            - `DOHC` = Double OverHead Camshaft

            - `PUSHROD` = Valves actuated by rocker arms that are actuated by 'pushrods'.
        valvespercylinder:
          title: ValvesPerCylinder
          type: string
          description: The number of valves per cylinder (four stroke engines have at least 2 poppet valves per cylinder).
    VehicleSmmtEvData:
      title: SmmtEvData
      properties:
        batterypower:
          title: BatteryPower
          type: integer
          description: The power of the battery used for energy storage (kW)
          format: int32
        chargepowerhome:
          title: ChargePowerHome
          type: string
          description: Power rating for home/slow charging
        chargepowerpublic:
          title: ChargePowerPublic
          type: string
          description: Power rating for public/fast charging
        chargepowerrapid:
          title: ChargePowerRapid
          type: string
          description: Power rating for rapid charging
        electricmotortype:
          title: ElectricMotorType
          type: string
          description: Type of electric motor used for vehicle propulsion
        electricrange:
          title: ElectricRange
          type: integer
          description: The AER (all electric range) average  calculated across the four WLTP test cycles, for hybrids this will be EAER (equivalent all electric range) (miles)
          format: int32
        hybridassist:
          title: HybridAssist
          type: boolean
          description: To indicate if the the vehicles has an energy recovery system, but the electric motor does not contribute to the propulsion of the vehicle. These are usually referred to as a mild hybrid
        operatingmodes:
          title: OperatingModes
          type: string
          description: Indicates if the vehicles has an operating mode switch and if one of those modes is pure electric.
        operatingvoltage:
          title: OperatingVoltage
          type: integer
          description: The operating voltage of the electric motor used for propulsion.
          format: int32
        powertransmissionhome:
          title: PowerTransmissionHome
          type: string
          description: Type of electric current used to deliver the charge to the battery when using home/slow charging
        powertransmissionpublic:
          title: PowerTransmissionPublic
          type: string
          description: Type of electric current used to deliver the charge to the battery when using public/fast charging
        powertransmissionrapid:
          title: PowerTransmissionRapid
          type: string
          description: Type of electric current used to deliver the charge to the battery when using rapid charging
        timetochargehome:
          title: TimeToChargeHome
          type: string
          description: Time to charge the battery to full capacity using home/slow charging under normal operating conditions.
        timetochargepublic:
          title: TimeToChargePublic
          type: string
          description: Time to charge the battery to full capacity using public/fast charging under normal operating conditions.
        timetochargerapid:
          title: TimeToChargeRapid
          type: string
          description: Time to charge the battery to full capacity using rapid charging under normal operating conditions.
        totalrange:
          title: TotalRange
          type: integer
          description: The AER  city (all electric range) average  calculated across the low (city) and medium (town) WLTP test cycles, for hybrids this will be EAER city (equivalent all electric range city) (miles)
          format: int32
        vehiclecharging:
          title: VehicleCharging
          type: string
          description: Defines if the vehicle has off vehicle charging (OVC) or not off vehicle charging (NOVC)
    VehicleSmmtFuelEconomy:
      title: SmmtFuelEconomy
      properties:
        accelerationkph:
          title: AccelerationKph
          type: string
          description: The time, in seconds, taken by the vehicle to accelerate from 0 to 100 kilometres an hour (kph).
        accelerationmph:
          title: AccelerationMph
          type: string
          description: The time, in seconds, taken by the vehicle to accelerate from 0 to 60 miles per hour (mph).
        co2:
          title: CO2
          type: integer
          description: Exhaust emission of carbon dioxide measured, as part of the type approval process, in grams per kilometre (g/km).
          format: int32
        combinedlkm:
          title: CombinedLkm
          type: string
          description: Fuel efficiency in litres per 100km for the combined engine cycle as stipulated in Directive 1999/100/EC. The combined figure presented is for the urban and the extra-urban cycle together. It is therefore an average of the two other parts of the fuel consumption test, Urban and Extra-urban cycles, weighted by the distance covered in each part.
        combinedmpg:
          title: CombinedMpg
          type: string
          description: Fuel efficiency in miles per gallon for the combined engine cycle as stipulated in Directive 1999/100/EC. The combined figure presented is for the urban and the extra-urban cycle together. It is therefore an average of the two other parts of the fuel consumption test, Urban and Extra-urban cycles, weighted by the distance covered in each part.
        extraurbanlkm:
          title: ExtraUrbanLkm
          type: string
          description: Fuel efficiency in litres per 100km for the 'extra urban' engine cycle as stipulated in Directive 1999/100/EC. The extra-urban cycle is conducted immediately following the urban cycle and consists roughly half steady-speed driving and the remainder accelerations, decelerations and some idling. Maximum speed is 75mph (120kph), average speed is 39mph (63kph) and the distance covered is 4.3 miles (7km).
        extraurbanmpg:
          title: ExtraUrbanMpg
          type: string
          description: Fuel efficiency in miles per gallon for the 'extra urban' engine cycle as stipulated in Directive 1999/100/EC. The extra-urban cycle is conducted immediately following the urban cycle and consists roughly half steady-speed driving and the remainder accelerations, decelerations and some idling. Maximum speed is 75mph (120kph), average speed is 39mph (63kph) and the distance covered is 4.3 miles (7km).
        maxspeedkph:
          title: MaxSpeedKph
          type: string
          description: Maximum speed of the model variant as per the brochure in kilometres per hour (kph).
        maxspeedmph:
          title: MaxSpeedMph
          type: string
          description: Maximum speed of the model variant as per the brochure in miles per hour (mph).
        powerbhp:
          title: PowerBhp
          type: string
          description: Maximum power in brake horse power (bhp).
        powerkw:
          title: PowerKw
          type: string
          description: Maximum power in kilowatts (kW).
        powerrpm:
          title: PowerRpm
          type: string
          description: The number of revolutions per minute (rpm) at which the maximum power occurs.
        torquefoot:
          title: TorqueFoot
          type: string
          description: Maximum torque of the engine as reported by the manufacturer in pound-feet (lb-ft).
        torquenm:
          title: TorqueNm
          type: string
          description: Maximum torque of the engine as reported by the manufacturer in newton-metres (Nm).
        torquerpm:
          title: TorqueRpm
          type: string
          description: The number of revolutions per minute at which the maximum torque occurs.
        urbancoldlkm:
          title: UrbanColdLkm
          type: string
          description: Fuel efficiency in litres per 100km for the 'urban cold' engine cycle as stipulated in Directive 1999/100/EC. The urban test cycle is carried out in a laboratory at an ambient temperature of 20 degrees Celsius to 30 degrees Celsius on a rolling road from a cold start, i.e. the engine has not run for several hours. The cycle consists of a series of accelerations, steady speeds, decelerations and idling. Maximum speed is 31mph (50kph), average speed 12mph (19kph) and the distance covered is 2.5 miles (4km).
        urbancoldmpg:
          title: UrbanColdMpg
          type: string
          description: Fuel efficiency in miles per gallon for the 'urban cold' engine cycle as stipulated in Directive 1999/100/EC. The urban test cycle is carried out in a laboratory at an ambient temperature of 20 degrees Celsius to 30 degrees Celsius on a rolling road from a cold start, i.e. the engine has not run for several hours. The cycle consists of a series of accelerations, steady speeds, decelerations and idling. Maximum speed is 31 mph (50kph), average speed 12mph (19kph) and the distance covered is 2.5 miles (4km).
    VehicleSmmtInfo:
      title: SmmtInfo
      properties:
        co2:
          title: Co2
          type: integer
          description: The CO2 emissions in grams per kilometer (g/km)
          format: int32
        eurostatus:
          title: EuroStatus
          type: string
          description: The highest European engine standard which the engine meets as recorded in the vehicle registration certificate (V5C)
        fuel:
          title: Fuel
          type: string
          description: The fuel type of the vehicle
      description: SMMT information about the emissions of a vehicle
    VehicleSmmtRawDescription:
      title: SmmtRawDescription
      properties:
        dvladtpmakecode:
          title: DvlaDtpMakeCode
          type: string
          description: DTP Make code as defined by the DVLA.
        dvladtpmodelcode:
          title: DvlaDtpModelCode
          type: string
          description: DTP Model code as defined by the DVLA.
        dvlamake:
          title: DvlaMake
          type: string
          description: Make as defined by the DVLA.
        dvlamodel:
          title: DvlaModel
          type: string
          description: Model as defined by the DVLA.
        smmtmake:
          title: SmmtMake
          type: string
          description: Make as defined by the SMMT.
        smmtmvrismakecode:
          title: SmmtMvrisMakeCode
          type: string
          description: MVRIS Make code as defined by the SMMT.
        smmtmvrismodelcode:
          title: SmmtMvrisModelCode
          type: string
          description: MVRIS Model code as defined by the SMMT.
        smmtrange:
          title: SmmtRange
          type: string
          description: Range as defined by the SMMT.
        smmttrim:
          title: SmmtTrim
          type: string
          description: Trim as defined by the SMMT.
    VehicleSmmtResponseDataV2:
      title: SmmtResponseDataV2
      properties:
        additional:
          $ref: '#/components/schemas/VehicleSmmtAdditionalData'
          description: Additional vehicle model data.
        dimensions:
          $ref: '#/components/schemas/VehicleSmmtWeightDimensions'
          description: Weight and dimension data.
        engine:
          $ref: '#/components/schemas/VehicleSmmtEngineDetails'
          description: Engine and technical data.
        ev:
          $ref: '#/components/schemas/VehicleSmmtEvData'
          description: EV data.
        fueleconomy:
          $ref: '#/components/schemas/VehicleSmmtFuelEconomy'
          description: Performance and consumption data.
        makemodel:
          $ref: '#/components/schemas/VehicleSmmtRawDescription'
          description: DVLA / SMMT data.
      description: Data provided by the Society of Motor Manufacturers and Traders (SMMT)
    VehicleSmmtWeightDimensions:
      title: SmmtWeightDimensions
      properties:
        bodyshape:
          title: BodyShape
          type: string
          description: Additional variant description field for commercial vehicles to allow relative roof heights and body shape versions of same variant.
        carlength:
          title: CarLength
          type: integer
          description: The distance in millimetres (mm) between a vertical line at the front bumper of the vehicle to a similar line at the most extreme point at the rear of the vehicle.
          format: int32
        grosscombinedweight:
          title: GrossCombinedWeight
          type: string
          description: Standard abbreviation GCW. The total maximum weight in kilograms (kg) of an articulated vehicle as driven (with semi-trailer, payload, driver, all fluids).
        grosstrainweight:
          title: GrossTrainWeight
          type: string
          description: |-
            Standard abbreviation GTW. The total maximum weight in kilograms (kg) of a rigid vehicle together with it's loaded draw-bar trailer.

            NOTE: Sometimes manufacturers use the term GCW for both rigid and articulated vehicles.
        grossvehicleweight:
          title: GrossVehicleWeight
          type: string
          description: Standard abbreviation GVW. The total maximum weight of a rigid vehicle as driven (with body, payload, driver, all fluids).
        height:
          title: Height
          type: integer
          description: The distance in millimetres (mm) from a horizontal line touching the highest point of the vehicle roof to the point of contact with the road surface.
          format: int32
        kerbweight:
          title: KerbWeight
          type: integer
          description: The weight in kilograms (kg) of the complete vehicle and all equipment without payload or driver.
          format: int32
        loadlength:
          title: LoadLength
          type: string
          description: Measured in millimetres (mm) at floor level from behind the driver’s seat to the end of floor space.
        numberofaxles:
          title: NumberOfAxles
          type: string
          description: Total number of axles.
        numberofseats:
          title: NumberOfSeats
          type: integer
          description: Total number of seats including driver's seat as specified on the Certificate of Conformity.
          format: int32
        payloadvolume:
          title: PayloadVolume
          type: string
          description: The cubic capacity of the load space for the vehicle measured in cubic metres (m3). This value is entered for factory built panel vans. For other body types and chassis cabs, the equivalent for the panel van version in the range may be entered.
        payloadweight:
          title: PayloadWeight
          type: string
          description: The maximum weight of goods in kilograms (kg) that can be carried on a specific vehicle without exceeding limits set by the Construction & Use regulations.
        rigidartic:
          title: RigidArtic
          type: string
          description: Descriptive field that indicates if the vehicle has a permanent or semi-permanent pivoting joint (`ARCTIC`) or not (`RIGID`).
        unladenweight:
          title: UnladenWeight
          type: integer
          description: Standard abbreviation ULW. The total weight in kilograms (kg) of an unladen vehicle with body, less driver, ready for operation on the road.
          format: int32
        wheelbase:
          title: WheelBase
          type: string
          description: |-
            One of the following:

            - `SHORT`

            - `MEDIUM`

            - `LONG`

            - `EXTRA LONG`
        width:
          title: Width
          type: integer
          description: The distance in millimetres (mm) between two vertical lines touching the opposite sides of the vehicle excluding the wing mirrors.
          format: int32
    VehicleSoundLevelInfo:
      title: SoundLevelInfo
      properties:
        driveby:
          title: DriveBy
          type: integer
          description: Drive by sound level in A-weighted decibels (dB(A))
          format: int32
        enginespeed:
          title: EngineSpeed
          type: integer
          description: Engine speed sound level in A-weighted decibels (dB(A))
          format: int32
        stationary:
          title: Stationary
          type: integer
          description: Stationary sound level in A-weighted decibels (dB(A))
          format: int32
      description: Information about the sound level of a vehicle
    VehicleStatus:
      title: Status
      properties:
        exported:
          title: Exported
          type: string
          description: |-
            Indicates if the vehicle is exported

            Possible values:

            - `Exported` = Vehicle is currently exported

            - `WasExported` = Vehicle is not currently exported but has previously been exported

            - `NotExported` = Vehicle is not currently exported and has never been exported
        financed:
          title: Financed
          type: boolean
          description: Indicates if the vehicle has finance data
        highrisk:
          title: Highrisk
          type: boolean
          description: Indicates if the vehicle has highrisk information
        imported:
          title: Imported
          type: string
          description: The import status of the vehicle
        mileageoutofsequence:
          title: MileageOutOfSequence
          type: boolean
          description: Indicates if the vehicle has mileage data out of sequence
        scrapped:
          title: Scrapped
          type: string
          description: The scrapped status of the vehicle
        staticvehicle:
          title: StaticVehicle
          type: boolean
          description: Indicates when the vehicle is a static test vehicle that should only be used for testing purposes
        stolen:
          title: Stolen
          type: boolean
          description: Indicates if the vehicle is marked as stolen
        usedbeforefirstregistration:
          title: UsedBeforeFirstRegistration
          type: boolean
          description: Indicates if the vehicle was used before first registration
    VehicleStolen:
      title: Stolen
      properties:
        contactnumber:
          title: ContactNumber
          type: string
          description: The contact number of the police force.
        creationdate:
          title: CreationDate
          type: string
          description: Date that the Police National Computer (PNC) recorded the event.
          format: date-time
        forcename:
          title: ForceName
          type: string
          description: The name of the police force.
        id:
          title: ID
          type: string
          description: Experian identifer for the stolen marker
        status:
          title: Status
          type: string
          description: The status of the vehicle according to the stolen marker
      description: Stolen vehicle report data from the Police National Computer (PNC)
    VehicleSummaryV2:
      title: SummaryV2
      properties:
        abicode:
          title: ABICode
          type: string
          description: ABI code associated with the vehicle
        aerrangecombined:
          title: AERRangeCombined
          type: integer
          description: EV range on electric motors (miles)
          format: int32
        batterycapacity:
          title: BatteryCapacity
          type: integer
          description: EV battery capacity (kWh)
          format: int32
        bodytype:
          title: BodyType
          type: string
          description: Body type of the vehicle
        co2emissions:
          title: CO2Emissions
          type: integer
          description: The CO2 emissions in grams per kilometer (g/km)
          format: int32
        colour:
          title: Colour
          type: string
          description: The colour of the vehicle
        colourcode:
          title: ColourCode
          type: string
          description: DVLA colour code.
        dateexported:
          title: DateOfExport
          type: string
          description: Only present if `exported` is `Exported`.
          format: date-time
        dateoffirstreginuk:
          title: DateOfFirstRegInUK
          type: string
          description: The date of registration in the UK. This field is different to `registrationdate` if the vehicle was used before registration in the UK.
          format: date-time
        dateoffirstregistration:
          title: DateOfFirstReg
          type: string
          description: The date the vehicle was first registered. This field is different to `dateoffirstreginuk` if the vehicle was used before registration in the UK.
          format: date-time
        dateofimport:
          title: DateOfImport
          type: string
          description: Date the vehicle was imported.
          format: date-time
        dateofmanufacture:
          title: DateOfManufacture
          type: string
          description: Date the vehicle was manufactured.
          format: date-time
        datescrapped:
          title: DateOfScrapping
          type: string
          description: |-
            Only present if `scrapped` is `1` or `2`.

            If `scrapped` is `1` then this is the date the vehicle was scrapped.

            If `scrapped` is `2` then this is the date a certificate of destruction was issued.
          format: date-time
        dvlamakecode:
          title: DvlaMakeCode
          type: string
          description: DVLA make code.
        dvlamodelcode:
          title: DvlaModelCode
          type: string
          description: DVLA model code.
        enginecapacity:
          title: EngineCapacity
          type: integer
          description: The engine capacity of the vehicle
          format: int32
        exported:
          title: Exported
          type: string
          description: |-
            Indicates if the vehicle is exported

            Possible values:

            - `Exported` = Vehicle is currently exported

            - `WasExported` = Vehicle is not currently exported but has previously been exported

            - `NotExported` = Vehicle is not currently exported and has never been exported
