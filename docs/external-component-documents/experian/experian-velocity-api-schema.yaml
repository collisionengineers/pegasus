openapi: 3.0.0
info:
  title: Experian Automotive API
  description: |+
   # Overview
    
    Our Velocity API is at the centre of our automotive data services.  We have created distinct blocks to respond to the needs of various industry sectors and add flexibility to support multiple digital journeys.  The availability of each block and to specific data nodes depends on the levels of access that is granted.
    
    # Access restrictions
     
     Access to the API, data fields and sections is administrated by Experian. 
     
    # Format
    This API defaults to JSON. Requests should specify [content type](https://developer.mozila.org/en-US/docs/Web/HTTP/Headers/Content-Type) as  `application/json`.
    # Vehicle
    This block gives clients access to the Experian’s Automotive Bureau.  It contains all the data nodes required to power multiple applications; from basic Vehicle Identification searches to full Provenance Reports including technical details of vehicle specification, vehicle finance and details and condition markers.
    # Finance
    This block allows financial services organisation to programmatically manage their financial interest in a vehicle.  Finance markers can be added, amended, or removed using this feature.  The availability of this block is limited to such organisations. 
    # High Risk
    This block allows financial services organisation to programmatically manage High Risk markers.  Markers can be added, amended, or removed using this feature. 
    # Events 
    The Events blocks allows clients to subscribe to vehicles in order to get access to updates (events) that are triggered when relevant vehicle data update (e.g. keeper changes, Finance markers, Stolen markers, etc).  The block consist of two parts, one that facilitates the management of a subscription and one that retrieve the relevant updates.

 
  version: "1.0"
servers:
  - url: https://sandbox-uk-api.experian.com/ukci/automotive

paths:
  /v2/vehicle/:
    post:
      tags:
        - Vehicle
      summary: Query Vehicle v2
      description: |-
        The Vehicle endpoint is used to retrieve registration, specification, and provenance data about a vehicle.

        Core registration and specification data is returned by default, with additional data returned if requested.

        To perform a Template search, supply an appropriate Template in the request. You may also be required to supply additional information depending on which Template is requested.

        If migrating from MXIN Lite this endpoint replaces both transaction 02 (Approved Program / AutoCheck) and transaction 03 (Vehicle Data / Custom Search):

        - Transaction 02 (Approved Program / AutoCheck) - Request a template of "AutoCheck". See the request body schema section for details of data items included with an AutoCheck and optional additional data items.

        - Transaction 03 (Vehicle Data / Custom Search) - Do not request any template. With no additional data options this will return a vehicle description only. See the request body schema section for available additional data items.
      requestBody:
        $ref: '#/components/requestBodies/VehicleQueryV2Request'
      responses:
        "200":
          $ref: '#/components/responses/VehicleResponse'
        "400":
          $ref: '#/components/responses/VehicleValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "404":
          $ref: '#/components/responses/VehicleNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'  
  /v1/adverse/finance:
    get:
      tags:
        - Finance
      summary: Query Finance
      description: The finance query endpoint is used to retrieve details about Finance data entries
      parameters:
        - $ref: '#/components/parameters/FinanceAgreementNumber'
        - $ref: '#/components/parameters/FinanceVRM'
        - $ref: '#/components/parameters/FinanceVIN'
        - $ref: '#/components/parameters/FinanceVehicleID'
        - $ref: '#/components/parameters/FinanceIncludeDeleted'
      responses:
        "200":
          $ref: '#/components/responses/FinanceResponse'
        "400":
          $ref: '#/components/responses/FinanceValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
        - Finance
      summary: Create Finance
      description: Adds a new finance marker
      requestBody:
        $ref: '#/components/requestBodies/FinanceUpdateRequest'
      responses:
        "201":
          $ref: '#/components/responses/FinanceCreatedResponse'
        "204":
          $ref: '#/components/responses/FinanceNoContentResponse'
        "400":
          $ref: '#/components/responses/ValidationErrorResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v1/adverse/finance/{id}:
    get:
      tags:
        - Finance
      summary: Get Finance
      description: Gets a single finance marker by ID in the format "5964f1f98968001f8C4b939b"
      parameters:
        - $ref: '#/components/parameters/FinanceId'
      responses:
        "200":
          $ref: '#/components/responses/GetFinanceResponse'
        "400":
          $ref: '#/components/responses/GetFinanceValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/FinanceNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
    put:
      tags:
        - Finance
      summary: Update Finance
      description: Updates an existing finance marker by ID in the format "5964f1f98968001f8C4b939b"
      parameters:
        - $ref: '#/components/parameters/FinanceId'
      requestBody:
        $ref: '#/components/requestBodies/FinanceCreateRequest'
      responses:
        "204":
          $ref: '#/components/responses/FinanceNoContentResponse'
        "400":
          $ref: '#/components/responses/UpdateFinanceValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/FinanceNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      tags:
        - Finance
      summary: Delete Finance
      description: Deletes an existing finance marker by ID in the format "5964f1f98968001f8C4b939b"
      parameters:
        - $ref: '#/components/parameters/FinanceId'
      responses:
        "204":
          $ref: '#/components/responses/FinanceNoContentResponse'
        "400":
          $ref: '#/components/responses/DeleteFinanceValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/FinanceNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v1/adverse/highrisk:
    get:
      tags:
        - High Risk
      summary: Query High Risk
      description: The high risk query endpoint is used to retrieve details of entries that indicate that a vehicle is at risk
      parameters:
        - $ref: '#/components/parameters/HighriskReferenceNumber'
        - $ref: '#/components/parameters/HighriskVRM'
        - $ref: '#/components/parameters/HighriskVIN'
      responses:
        "200":
          $ref: '#/components/responses/HighriskResponse'
        "400":
          $ref: '#/components/responses/HighriskValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
        - High Risk
      summary: Create High Risk
      description: Adds a new high risk marker
      requestBody:
        $ref: '#/components/requestBodies/HighRiskUpdateRequest'
      responses:
        "201":
          $ref: '#/components/responses/HighriskCreatedResponse'
        "204":
          $ref: '#/components/responses/HighriskNoContentResponse'
        "400":
          $ref: '#/components/responses/HighriskValidationErrorResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v1/adverse/highrisk/{id}:
    get:
      tags:
        - High Risk
      summary: Get High Risk
      description: Gets a single high risk marker by ID in the format "5964f1f98968001f8C4b939b"
      parameters:
        - $ref: '#/components/parameters/HighriskId'
      responses:
        "200":
          $ref: '#/components/responses/GetHighriskResponse'
        "400":
          $ref: '#/components/responses/GetHighriskValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/HighriskNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
    put:
      tags:
        - High Risk
      summary: Update High Risk
      description: Updates an existing high risk marker by ID in the format "5964f1f98968001f8C4b939b"
      parameters:
        - $ref: '#/components/parameters/HighriskId'
      requestBody:
        $ref: '#/components/requestBodies/HighRiskCreateRequest'
      responses:
        "204":
          $ref: '#/components/responses/HighriskNoContentResponse'
        "400":
          $ref: '#/components/responses/UpdateHighriskValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/HighriskNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      tags:
        - High Risk
      summary: Delete High Risk
      description: Deletes an existing high risk marker by ID in the format "5964f1f98968001f8C4b939b"
      parameters:
        - $ref: '#/components/parameters/HighriskId'
      responses:
        "204":
          $ref: '#/components/responses/HighriskNoContentResponse'
        "400":
          $ref: '#/components/responses/DeleteHighriskValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/HighriskNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v1/eventsubscription/:
    get:
      tags:
        - Event Subscription
      summary: Get Event Subscriptions
      description: Get existing vehicle event subscriptions, describing how your account/branch will be notified when a change happens to the vehicle via the Event API
      parameters:
        - $ref: '#/components/parameters/EventsubscriptionBefore'
        - $ref: '#/components/parameters/EventsubscriptionAfter'
        - $ref: '#/components/parameters/EventsubscriptionCount'
        - $ref: '#/components/parameters/EventsubscriptionVehicleID'
      responses:
        "200":
          $ref: '#/components/responses/EventsubscriptionResponse'
        "400":
          $ref: '#/components/responses/GetEventSubscriptionsEventsubscriptionValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/EventsubscriptionNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
        - Event Subscription
      summary: Create Event Subscription
      description: Creates a new vehicle event subscription, by doing so your account/branch will be notified when a change happens to the vehicle via the Event API
      requestBody:
        $ref: '#/components/requestBodies/EventSubscriptionCreateRequest'
      responses:
        "201":
          $ref: '#/components/responses/EventsubscriptionCreatedResponse'
        "400":
          $ref: '#/components/responses/EventsubscriptionValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/EventsubscriptionNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v1/eventsubscription/{id}:
    get:
      tags:
        - Event Subscription
      summary: Get Event Subscription
      description: Get an existing vehicle event subscription by ID in the format "5964f1f98968001f8C4b939b", describing how your account/branch will be notified when a change happens to the vehicle via the Event API
      parameters:
        - $ref: '#/components/parameters/EventsubscriptionId'
      responses:
        "200":
          $ref: '#/components/responses/GetEventsubscriptionResponse'
        "400":
          $ref: '#/components/responses/GetEventsubscriptionValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/EventsubscriptionNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
    put:
      tags:
        - Event Subscription
      summary: Update Event Subscription
      description: Update an existing vehicle event subscription by ID in the format "5964f1f98968001f8C4b939b", describing how your account/branch will be notified when a change happens to the vehicle via the Event API
      parameters:
        - $ref: '#/components/parameters/EventsubscriptionId'
      requestBody:
        $ref: '#/components/requestBodies/EventSubscriptionUpdateRequest'
      responses:
        "200":
          $ref: '#/components/responses/UpdateEventsubscriptionResponse'
        "400":
          $ref: '#/components/responses/EventsubscriptionValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/EventsubscriptionNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
    delete:
      tags:
        - Event Subscription
      summary: Delete Event Subscription
      description: Delete an existing vehicle event subscription by ID in the format "5964f1f98968001f8C4b939b", describing how your account/branch will be notified when a change happens to the vehicle via the Event API
      parameters:
        - $ref: '#/components/parameters/EventsubscriptionId'
      responses:
        "204":
          $ref: '#/components/responses/EventsubscriptionNoContentResponse'
        "400":
          $ref: '#/components/responses/DeleteEventsubscriptionValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/EventsubscriptionNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v2/event/:
    get:
      tags:
        - Events
      summary: Query Events
      description: |-
        The event query endpoint is used to get a list of events subscribed to by your account/branch.

        The oldest available events will be returned first.

        Leaving this field blank will result in being subscribed to all types, alternatively supply one or more of the following:

        - `Colour Changes`

        - `Condition`

        - `Finance`

        - `High Risk`

        - `Industry`

        - `Keeper Changes`

        - `Mileage`

        - `MOT`

        - `Plate Changes`

        - `Status`

        - `Stolen`

        - `Summary`

        - `Technical`

        - `V5C Changes`

        - `VIC Tests`
      parameters:
        - $ref: '#/components/parameters/EventType'
        - $ref: '#/components/parameters/EventBefore'
        - $ref: '#/components/parameters/EventAfter'
        - $ref: '#/components/parameters/EventCount'
      responses:
        "200":
          $ref: '#/components/responses/EventResponse'
        "400":
          $ref: '#/components/responses/EventValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'
  /v2/event/{id}:
    get:
      tags:
        - Events
      summary: Get Event
      description: The event endpoint is used to get a specific vehicle event via it's ID in the format "5964f1f98968001f8C4b939b"
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        "200":
          $ref: '#/components/responses/GetEventResponse'
        "400":
          $ref: '#/components/responses/GetEventValidationResponse'
        "401":
          $ref: '#/components/responses/UnauthorisedResponse'
        "403":
          $ref: '#/components/responses/ForbiddenResponse'
        "404":
          $ref: '#/components/responses/EventNotFoundResponse'
        "500":
          $ref: '#/components/responses/InternalServerErrorResponse'

components:
  securitySchemes:
   OAuth2:
      type: oauth2
      description: This API uses OAuth 2 with the implicit grant flow. [More info](https://api.example.com/docs/auth)
      
      flows:
        password:
          tokenUrl:   https://sandbox-uk-api.experian.com/oauth2/v1/token
          scopes:
            read: Grants read access
            write: Grants write access
            admin: Grants access to admin operations
  

  schemas:
    AutoTraderVehicle:
      title: AutoTraderVehicle
      properties:
        bodytype:
          title: BodyType
          type: string
          description: the body type of the vehicle e.g. Saloon
        colour:
          title: Colour
          type: string
          description: Generic Paint Colour of the vehicle
        derivative:
          title: Derivative
          type: string
          description: Details of vehicle derivative
        doors:
          title: Doors
          type: integer
          description: The number of doors
          format: int32
        fuel:
          title: Fuel
          type: string
          description: The fuel type of the vehicle e.g. Diesel
        generation:
          title: Generation
          type: string
          description: The body type and year range of this models marque
        insurancegroup:
          title: InsuranceGroup
          type: string
          description: 1-50 rating system indicating the cost to insure
        insurancesecuritycode:
          title: InsuranceSecurityCode
          type: string
          description: Additional classification used by Insurers, e.g. A, D, E, U, P or G
        make:
          title: Make
          type: string
          description: The OEM name
        model:
          title: Model
          type: string
          description: The OEM model name
        owners:
          title: Owners
          type: integer
          description: The number of owners the vehicle has had
          format: int32
        ownershipcondition:
          title: OwnershipCondition
          type: string
          description: The ownership condition of the vehicle
        seats:
          title: Seats
          type: integer
          description: The number of seats
          format: int32
        transmission:
          title: Transmission
          type: string
          description: The transmission of the vehicle e.g. manual
        trim:
          title: Trim
          type: string
          description: The trim of the vehicle e.g. Black Edition
        vehicletype:
          title: VehicleType
          type: string
          description: Type of vehicle e.g. Car
        vin:
          title: Vin
          type: string
          description: The Vehicle Identification Number used to identify a specific vehicle
        vrm:
          title: Vrm
          type: string
          description: The registered number plate for the vehicle
    DeleteEventsubscriptionValidationResponse:
      title: ValidationResponse
      properties:
        instance:
          title: instance
          type: string
          description: Unique identifier for the request. Provide this if contacting support about this request.
      description: Validation error
    DeleteFinanceValidationResponse:
      title: ValidationResponse
      properties:
        instance:
          title: instance
          type: string
          description: Unique identifier for the request. Provide this if contacting support about this request.
      description: Validation error
    DeleteHighriskValidationResponse:
      title: ValidationResponse
      properties:
        instance:
          title: instance
          type: string
          description: Unique identifier for the request. Provide this if contacting support about this request.
      description: Validation error
    EventBaseColourResponseDataV2:
      title: BaseColourResponseDataV2
      properties:
        currentcolour:
          title: CurrentColour
          type: string
          description: The vehicle's current colour
        currentcolourcode:
          title: CurrentColourCode
          type: string
          description: The vehicle's current colour code
        numberofpreviouscolours:
          title: NumberOfPreviousColours
          type: integer
          description: The number of previous colours the vehicle has had
          format: int32
        originalcolour:
          title: OriginalColour
          type: string
          description: The vehicle's original colour
        originalcolourcode:
          title: OriginalColourCode
          type: string
          description: The vehicle's original colour code
    EventBaseMotData:
      title: BaseMotData
      properties:
        enginesize:
          title: EngineSize
          type: string
          description: The engine size (cc) of the vehicle as supplied by the DVSA
        expirydate:
          title: ExpiryDate
          type: string
          description: The expiry date (due date) of the MOT on the vehicle
          format: date-time
        firstuseddate:
          title: FirstUsedDate
          type: string
          description: The date the vehicle was first used as supplied by the DVSA
          format: date-time
        fueltype:
          title: FuelType
          type: string
          description: The fuel type of the vehicle as supplied by the DVSA
        make:
          title: Make
          type: string
          description: The make of the vehicle as supplied by the DVSA
        manufacturedate:
          title: ManufactureDate
          type: string
          description: The manufacture date of the vehicle as supplied by the DVSA
          format: date-time
        model:
          title: Model
          type: string
          description: The model of the vehicle as supplied by the DVSA
        primarycolour:
          title: PrimaryColour
          type: string
          description: The colour of the vehicle at the time of the MOT
        registrationdate:
          title: RegistrationDate
          type: string
          description: The registration date of the vehicle as supplied by the DVSA
          format: date-time
    EventBodyInfo:
      title: BodyInfo
      properties:
        bodycode:
          title: BodyCode
          type: string
          description: Vehicle body code as specified by the DVLA.
        bodytype:
          title: BodyType
          type: string
          description: Body type as specified by the DVLA.
        grossweight:
          title: GrossWeight
          type: integer
          description: For commercial vehicles only
          format: int32
        massinservice:
          title: MassInService
          type: integer
          description: Mass in service in kilograms (kg)
          format: int32
        maxpermissiblemass:
          title: MaxPermissibleMass
          type: integer
          description: Maximum permissible mass
          format: int32
        maxtrailertowmassbraked:
          title: MaxTrailerTowMassBraked
          type: integer
          description: Max braked trailer tow mass in kilograms (kg)
          format: int32
        maxtrailertowmassunbraked:
          title: MaxTrailerTowMassUnbraked
          type: integer
          description: Max unbraked trailer tow mass in kilograms (kg)
          format: int32
        seatingcapacityincdriver:
          title: SeatingCapacityIncDriver
          type: integer
          description: Seating capacity (including driver)
          format: int32
        style:
          title: Style
          type: string
          description: Vehicle body style description as specified by the SMMT.
        wheelplan:
          title: WheelPlan
          type: string
          description: For commercial vehicles only
      description: Information about the body of a vehicle
    EventBodyInfoUpdate:
      title: BodyInfoUpdate
      properties:
        from:
          $ref: '#/components/schemas/EventBodyInfo'
          description: The body information before the change
        to:
          $ref: '#/components/schemas/EventBodyInfo'
          description: The body information after the change
      description: Change in information about the body of a vehicle
    EventCharge:
      title: Charge
      properties:
        power:
          title: Power
          type: string
          description: Power rating for charging (kW)
        time:
          title: Time
          type: string
          description: Time to charge the battery to full capacity (HH:MM)
        transmission:
          title: Transmission
          type: string
          description: Type of electric current used to deliver the charge to the battery
      description: Information about a charge mode for EV vehicles
    EventColourChangeData:
      title: ColourChangeData
      properties:
        date:
          title: Date
          type: string
          description: Date of the last colour change
          format: date-time
        id:
          title: ID
          type: string
          description: Experian identifer for the colour change
        lastcolour:
          title: LastColour
          type: string
          description: The last colour of the vehicle
        numberofpreviouscolours:
          title: NumberOfPreviousColours
          type: integer
          description: The number of previous colours of the vehicle
          format: int32
      description: Colour change history as received from the DVLA
    EventColourChangeDataUpdate:
      title: ColourChangeDataUpdate
      properties:
        from:
          $ref: '#/components/schemas/EventColourChangeData'
        to:
          $ref: '#/components/schemas/EventColourChangeData'
    EventColourChangeDataUpdates:
      title: ColourChangeDataUpdates
      properties:
        added:
          title: Added
          type: array
          items:
            $ref: '#/components/schemas/EventColourChangeData'
        removed:
          title: Removed
          type: array
          items:
            $ref: '#/components/schemas/EventColourChangeData'
        updated:
          title: Updated
          type: array
          items:
            $ref: '#/components/schemas/EventColourChangeDataUpdate'
    EventColourReponseData:
      title: EventColourReponseData
      properties:
        changes:
          $ref: '#/components/schemas/EventColourChangeDataUpdates'
        from:
          $ref: '#/components/schemas/EventBaseColourResponseDataV2'
        to:
          $ref: '#/components/schemas/EventBaseColourResponseDataV2'
    EventCondition:
      title: Condition
      properties:
        branchcode:
          title: BranchCode
          type: string
          description: Identification code for the branch of the insurer associated with this condition record
        causeofdamage:
          title: CauseOfDamage
          type: string
          description: |-
            The cause of the damage sustained to the vehicle

            One of the following:

            - F: `Fire`

            - A: `Accident`

            - W: `Water`

            - V: `Vandalism`

            - U: `Unknown`
        claimnumber:
          title: ClaimNumber
          type: string
