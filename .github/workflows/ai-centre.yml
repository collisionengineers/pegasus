name: ai-centre-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workspaces/ai-centre/services/collision-brain/package-lock.json
      - name: Validate AI Centre workspace
        working-directory: workspaces/ai-centre/services/collision-brain
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
