name: repository-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repository policy
        shell: pwsh
        run: ./scripts/Test-RepositoryPolicy.ps1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: pwsh
        run: dotnet restore ./Pegasus.slnx
      - name: Build
        shell: pwsh
        run: dotnet build ./Pegasus.slnx --configuration Release --no-restore
      - name: Test
        shell: pwsh
        run: dotnet test ./Pegasus.slnx --configuration Release --no-build --filter "Category!=Corpus"

  source-workspaces:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workspaces/ai-centre/services/collision-brain/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Validate document-extraction workspace
        shell: pwsh
        run: |
          dotnet restore ./workspaces/document-extraction/CollisionDocNet.slnx
          dotnet build ./workspaces/document-extraction/CollisionDocNet.slnx --configuration Release --no-restore
          dotnet test ./workspaces/document-extraction/CollisionDocNet.slnx --configuration Release --no-build
      - name: Validate report-renderer workspace
        shell: pwsh
        run: |
          dotnet restore ./workspaces/report-renderer/CollisionRenderer.sln
          dotnet build ./workspaces/report-renderer/CollisionRenderer.sln --configuration Release --no-restore
          dotnet test ./workspaces/report-renderer/CollisionRenderer.sln --configuration Release --no-build
      - name: Validate AI Centre workspace
        working-directory: workspaces/ai-centre/services/collision-brain
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Validate agent-skill packaging
        working-directory: workspaces/agent-skills/tools
        shell: pwsh
        run: python -m unittest test_pack_skill
