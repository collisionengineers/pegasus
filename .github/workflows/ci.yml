name: repository-check

# A push to dev deliberately runs nothing: the dev -> main pull request is where
# the whole of dev is tested as one, and that run is the release-route evidence.
# Adding dev here would buy a third full run of a tree two runs already covered.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One live run per pull request: a newer head cancels the superseded run
# instead of letting both finish (two ~15-minute runs started 2m15s apart on
# task/eng-028-multi-estimate-editor both ran to completion). A push to main is
# never cancelled — its run is the release-route evidence. DELIV-043.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Path detection only: no application code runs here, so this job is not
    # Linux-development evidence (docs/runbook.md "Supported platform").
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.detect.outputs.build }}
      infrastructure: ${{ steps.detect.outputs.infrastructure }}
      localDevelopment: ${{ steps.detect.outputs.localDevelopment }}
      referenceData: ${{ steps.detect.outputs.referenceData }}
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Only the push-to-main history guard needs history. A full clone of
          # this repository takes about 2.5 minutes and every heavy lane waits
          # on this job, so a pull request checks out one commit and reads its
          # changed files from the API instead.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - name: Require main history to be contained in dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          ./scripts/Test-MainBranchHistory.ps1 -Before $env:BEFORE_SHA -Head $env:HEAD_SHA -ReleaseBranch origin/dev
      - name: Detect whether a build-relevant path changed
        id: detect
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          $forceAll = $true
          $files = @()
          if ('${{ github.event_name }}' -eq 'pull_request') {
            # The API lists files against the merge base, the same set a
            # three-dot diff would give from a full clone.
            $files = @(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
            # GitHub caps this API at 3,000 paths. A successful but truncated
            # response must run every conditional lane.
            if ($LASTEXITCODE -eq 0 -and $files.Count -eq [int]'${{ github.event.pull_request.changed_files }}') {
              $forceAll = $false
            }
          } else {
            $base = '${{ github.event.before }}'
            if ($base -and $base -notmatch '^0+$') {
              $files = @(git diff --name-only "$base...${{ github.sha }}")
              if ($LASTEXITCODE -eq 0) {
                $forceAll = $false
              }
            }
          }
          $flags = ./scripts/Get-CiChangeFlags.ps1 -ChangedPath $files -ForceAll:$forceAll
          "build=$($flags.Build.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "infrastructure=$($flags.Infrastructure.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "localDevelopment=$($flags.LocalDevelopment.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "referenceData=$($flags.ReferenceData.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          # Whether the unit and SQL lanes run is decided by
          # scripts/Get-CiHeavyLaneDecision.ps1; this step only gathers its
          # inputs. Labels are read live rather than from the event payload so
          # that adding ci:full and re-running the workflow is enough: a re-run
          # replays the original payload, which predates the label.
          $labels = @()
          $stackedAbove = $null
          if ($env:EVENT_NAME -eq 'pull_request') {
            $labels = @(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" --jq '.[].name')
            if ($LASTEXITCODE -ne 0) { $labels = @($env:PR_LABELS -split ',') }
            $head = [uri]::EscapeDataString($env:HEAD_REF)
            $stacked = gh api "repos/${{ github.repository }}/pulls?state=open&base=$head&per_page=100" --jq 'length'
            if ($LASTEXITCODE -eq 0) { $stackedAbove = [int]$stacked }
          }
          $decision = ./scripts/Get-CiHeavyLaneDecision.ps1 -Build $flags.Build -EventName $env:EVENT_NAME `
            -BaseRef $env:BASE_REF -Label $labels -StackedAbove $stackedAbove
          "heavy=$($decision.Heavy.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Heavy lanes: $(if ($decision.Heavy) { 'running' } else { 'not running' }). $($decision.Reason)"
      - name: Test SQL shard assignment
        if: steps.detect.outputs.build == 'true'
        shell: pwsh
        run: ./scripts/Test-TestShard.ps1
      - name: Migration runtime-grant check
        if: steps.detect.outputs.infrastructure == 'true'
        shell: pwsh
        run: ./scripts/Test-MigrationGrants.ps1

  invariants:
    # The cheap invariant checks, in one runner rather than three. They gate
    # every heavy lane (DELIV-043): a broken link used to buy ~85 runner-minutes
    # of tests whose verdict could not change the outcome. A lane skipped
    # because a cheap check failed is not green (docs/engineering.md "Delivery
    # evidence").
    #
    # One job with conditional steps, not three jobs with conditions: a skipped
    # job skips its dependents, so gating these as jobs would take every heavy
    # lane down with them. Each step keeps its own name, so each verdict is
    # still read individually.
    #
    # Windows, because the documentation link check resolves targets with
    # Test-Path, which is case-insensitive there and case-sensitive on Linux;
    # moving it would quietly change the rule.
    #
    # It needs `changes` for the step flags but must not inherit its verdict:
    # without `!cancelled()`, a failed path detection would take the link check
    # down with it and no change set would get the one check all of them run.
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Documentation links
        # The one check every change set runs, including change sets that touch
        # no build-relevant path (docs/engineering.md "Delivery evidence").
        shell: pwsh
        run: ./scripts/Test-DocumentationLinks.ps1
      - name: LocalDB lifecycle classifier tests
        # This parser contract is Windows-specific, and it is gated on its own
        # subject alone: Test-PegasusPlatform.ps1 dot-sources PegasusPlatform.ps1
        # and nothing else, so no application, documentation, infrastructure or
        # cloud change implies it.
        if: needs.changes.outputs.localDevelopment == 'true'
        shell: pwsh
        run: ./scripts/Test-PegasusPlatform.ps1
      - name: Build-output pruning tests
        # Clear-BuildOutput.ps1 deletes. This proves it touches only the bin and
        # obj beside a tracked project, never an evidence or archive folder that
        # happens to contain one.
        if: needs.changes.outputs.localDevelopment == 'true'
        shell: pwsh
        run: ./scripts/Test-ClearBuildOutput.ps1
      - uses: actions/setup-python@v6
        if: needs.changes.outputs.referenceData == 'true'
        with:
          python-version: '3.13'
      - name: Provider-reference generator tests
        # The generator and its tests share one scripts-owned component. This
        # step is their executable gate; no application caller or production
        # import is implied.
        if: needs.changes.outputs.referenceData == 'true'
        shell: pwsh
        run: python -m unittest discover -s scripts/reference_data/tests -p 'test_*.py'

  infrastructure:
    # Local mode checks committed fail-closed invariants and compiles Bicep.
    # It does not authenticate, read Azure state, run azd or deploy anything.
    #
    # Gated on its own path flag rather than on the tip, unlike the heavy lanes:
    # it costs well under a minute, so deferring it up a stack would lose
    # committed-invariant coverage for no runner saving.
    needs: [changes, invariants]
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Change-classification regression tests
        shell: pwsh
        run: ./scripts/Test-CiChangeFlags.ps1
      - name: Release validation behaviour tests
        # Runs the Worker smoke and PreProvision validation against a fake
        # Azure CLI: what they refuse before a live read, what they accept,
        # and which exact target they bind to.
        shell: pwsh
        run: ./scripts/Test-ReleaseValidation.ps1
      - name: Validate infrastructure plan locally
        shell: pwsh
        run: ./scripts/Test-AzureDeploymentPlan.ps1 -Mode Local

  unit:
    # Both projects run whole and unfiltered. Core's Category=Corpus theories
    # read the private reference pack and skip themselves with a stated reason
    # when PEGASUS_REFERENCE_PACK_ROOT is absent, so no filter is needed here
    # and the skips are visible in the run, not hidden by a filter.
    needs: [changes, invariants]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-build
      - name: Test
        shell: pwsh
        # Chained, not two lines: pwsh reports only the last command's exit
        # code, so a failing first project would otherwise pass the step.
        run: >
          dotnet test ./tests/Pegasus.Core.Tests/Pegasus.Core.Tests.csproj --configuration Release --no-build -- xUnit.MaxParallelThreads=1 &&
          dotnet test ./tests/Pegasus.ArchitectureTests/Pegasus.ArchitectureTests.csproj --configuration Release --no-build

  sql-integration:
    # All integration tests except the separately scoped corpus tests.
    # Two levels of overlap, because neither alone is enough on a four-vCPU
    # runner: test classes run in parallel within a shard, capped by
    # tests/Pegasus.IntegrationTests/xunit.runner.json, and the shards divide
    # whole classes across six runners. Allow setup/build plus the longest shard
    # and evidence upload: the 2026-09-09 run exhausted a 30-minute job budget.
    needs: [changes, invariants]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      # One shard's failure must not hide another shard's coverage report.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-build
      - name: Test
        shell: pwsh
        run: >
          ./scripts/Invoke-TestShard.ps1
          -Project ./tests/Pegasus.IntegrationTests/Pegasus.IntegrationTests.csproj
          -Filter "Category!=Corpus"
          -Shard ${{ matrix.shard }} -ShardCount 6
      - name: Retain what this shard enumerated and ran
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-shard-${{ matrix.shard }}
          path: artifacts/test-shards/
          if-no-files-found: error

  sql-integration-coverage:
    # Proves the shards reassemble into exactly the tests the lane's filter
    # selects. It matters more now than the count alone: `dotnet test` exits 0
    # when a filter matches nothing, so a shard that quietly ran none of its
    # assigned tests would otherwise pass.
    needs: [changes, sql-integration]
    # `always()` so a failing shard still gets its coverage reported, but never
    # when the lane was path-skipped, deferred to the tip, or skipped because a
    # cheap invariant failed upstream (there are no artifacts to verify then).
    if: always() && needs.changes.outputs.heavy == 'true' && needs.sql-integration.result != 'skipped' && needs.sql-integration.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          pattern: test-shard-*
          merge-multiple: true
          path: artifacts/test-shards
      - name: Every enumerated test ran in exactly one shard
        shell: pwsh
        run: ./scripts/Invoke-TestShard.ps1 -VerifyPartition -ShardCount 6
      - name: Report shard balance and refresh the duration table
        # The shards are dealt from scripts/test-shard-durations.json, which only
        # stays right if someone refreshes it. Every complete run measures the
        # real per-shard test time and offers the refreshed table as an
        # artifact, so a stale table shows up as a ratio in this log rather than
        # as one shard quietly setting the critical path again.
        if: needs.sql-integration.result == 'success'
        shell: pwsh
        run: >
          ./scripts/Update-TestShardDurations.ps1
          -ArtifactRoot artifacts/test-shards -ShardCount 6
          -Path artifacts/test-shard-durations.json
      - name: Retain the refreshed duration table
        if: needs.sql-integration.result == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: test-shard-durations
          path: artifacts/test-shard-durations.json
