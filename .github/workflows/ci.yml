name: repository-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.detect.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect a Markdown-only change set
        id: detect
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
            $head = '${{ github.event.pull_request.head.sha }}'
          } else {
            $base = '${{ github.event.before }}'
            $head = '${{ github.sha }}'
          }
          $docsOnly = 'false'
          if ($base -and $base -notmatch '^0+$') {
            $files = @(git diff --name-only "$base...$head")
            if ($files.Count -gt 0 -and -not ($files | Where-Object { $_ -notmatch '\.md$' })) {
              $docsOnly = 'true'
            }
          }
          "docs-only=$docsOnly" >> $env:GITHUB_OUTPUT

  validate:
    # Historical full runs take 32-43 minutes on windows-latest; the timeout
    # guards against a hung run, not normal variance. Markdown-only change
    # sets run the documentation link check and path-skip the build/test
    # steps (docs/engineering.md "Branches and delivery").
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Documentation links
        shell: pwsh
        run: ./scripts/Test-DocumentationLinks.ps1
      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.docs-only != 'true'
        with:
          dotnet-version: 10.0.x
      - name: Restore
        if: needs.changes.outputs.docs-only != 'true'
        shell: pwsh
        run: dotnet restore ./Pegasus.slnx --locked-mode
      - name: Build
        if: needs.changes.outputs.docs-only != 'true'
        shell: pwsh
        run: dotnet build ./Pegasus.slnx --configuration Release --no-restore
      - name: Install pinned Playwright Chromium
        if: needs.changes.outputs.docs-only != 'true'
        shell: pwsh
        run: pwsh ./tests/Pegasus.IntegrationTests/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Test
        if: needs.changes.outputs.docs-only != 'true'
        shell: pwsh
        run: dotnet test ./Pegasus.slnx --configuration Release --no-build --filter "Category!=Corpus"

  qdos-pressure:
    # Local deterministic pressure completes in seconds; allow setup variance
    # but fail a deadlocked caller path rather than consuming GitHub's six-hour
    # default job window.
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: QDOS deterministic caller pressure
        shell: pwsh
        run: ./scripts/Invoke-QdosAlphaAcceptance.ps1 -Profile CiPressure -SourceRevision '${{ github.sha }}'
      - name: Retain content-safe pressure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qdos-pressure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qdos-alpha-acceptance/
          if-no-files-found: error
