name: repository-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: pwsh
        run: dotnet restore ./CollisionSpike.slnx
      - name: Build
        shell: pwsh
        run: dotnet build ./CollisionSpike.slnx --configuration Release --no-restore
      - name: Test
        shell: pwsh
        run: dotnet test ./CollisionSpike.slnx --configuration Release --no-build --filter "Category!=Corpus"
