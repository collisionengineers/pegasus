name: repository-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    # Path detection only: no application code runs here, so this job is not
    # Linux-development evidence (docs/operations.md "Supported platform").
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.detect.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect whether a build-relevant path changed
        id: detect
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
            $head = '${{ github.event.pull_request.head.sha }}'
          } else {
            $base = '${{ github.event.before }}'
            $head = '${{ github.sha }}'
          }
          # Build/test lanes run only for changes that can affect the built
          # application or how those lanes run: source, tests, the solution,
          # project/lock/config files, the acceptance script, this workflow, or
          # the action it shares. Test-DocumentationLinks.ps1 is
          # deliberately excluded because the documentation job always runs
          # (docs/engineering.md "Branches and delivery").
          $buildPattern = '^(src|tests)/|^Pegasus\.slnx$|\.csproj$|\.props$|\.targets$|packages\.lock\.json$|^global\.json$|^nuget\.config$|^scripts/Invoke-QdosAlphaAcceptance\.ps1$|^\.github/workflows/ci\.yml$|^\.github/actions/'
          $build = 'true'
          if ($base -and $base -notmatch '^0+$') {
            $files = @(git diff --name-only "$base...$head")
            if ($LASTEXITCODE -eq 0) {
              $build = if ($files | Where-Object { $_ -match $buildPattern }) { 'true' } else { 'false' }
            }
          }
          "build=$build" >> $env:GITHUB_OUTPUT

  documentation:
    # The one lane every change set runs, including change sets that touch no
    # build-relevant path (docs/engineering.md "Branches and delivery"). It
    # stays on Windows because Test-Path is case-insensitive there and
    # case-sensitive on Linux, so moving it would quietly change the rule.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Documentation links
        shell: pwsh
        run: ./scripts/Test-DocumentationLinks.ps1

  unit:
    # Both projects run whole and unfiltered: neither declares a single test
    # trait, so no filter can drop one of their tests.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-build
      - name: Test
        shell: pwsh
        # Chained, not two lines: pwsh reports only the last command's exit
        # code, so a failing first project would otherwise pass the step.
        run: >
          dotnet test ./tests/Pegasus.Core.Tests/Pegasus.Core.Tests.csproj --configuration Release --no-build &&
          dotnet test ./tests/Pegasus.ArchitectureTests/Pegasus.ArchitectureTests.csproj --configuration Release --no-build

  sql-integration:
    # Every integration test that is not a browser test. `Category=Browser` and
    # `Category!=Browser` are a complement pair, so this lane and `browser`
    # together select exactly what the single validate job used to select.
    # Test classes run in parallel within the lane, capped by
    # tests/Pegasus.IntegrationTests/xunit.runner.json.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-build
      - name: Test
        shell: pwsh
        run: >
          dotnet test ./tests/Pegasus.IntegrationTests/Pegasus.IntegrationTests.csproj
          --configuration Release --no-build --filter "Category!=Corpus&Category!=Browser"

  browser:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-build
      - name: Cache the pinned Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('tests/Pegasus.IntegrationTests/packages.lock.json') }}
      - name: Install pinned Playwright Chromium
        # Never gated on a cache hit: the installer is idempotent and repairs a
        # partial cache, which is what keeps a poisoned cache from being trusted.
        shell: pwsh
        run: pwsh ./tests/Pegasus.IntegrationTests/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Test
        shell: pwsh
        # Half the lane cap: each browser test starts a Chromium, a loopback
        # Kestrel host, and its own restored database, and four of those at
        # once on a four-vCPU runner is what makes navigation waits time out.
        # This lane is not on the critical path, so the headroom is free.
        run: >
          dotnet test ./tests/Pegasus.IntegrationTests/Pegasus.IntegrationTests.csproj
          --configuration Release --no-build --filter "Category=Browser&Category!=Corpus"
          -- xUnit.MaxParallelThreads=2

  qdos-pressure:
    # Local deterministic pressure completes in seconds; allow setup variance
    # but fail a deadlocked caller path rather than consuming GitHub's six-hour
    # default job window.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: QDOS deterministic caller pressure
        shell: pwsh
        run: ./scripts/Invoke-QdosAlphaAcceptance.ps1 -Profile CiPressure -SourceRevision '${{ github.sha }}'
      - name: Retain content-safe pressure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qdos-pressure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qdos-alpha-acceptance/
          if-no-files-found: error
