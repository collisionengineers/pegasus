name: qdos-pressure

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qdos-pressure:
    # Hosted-runner load makes this diagnostic pressure probe unsuitable as a
    # per-PR gate. Keep it bounded, recurring, manually runnable, and evidenced.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: QDOS deterministic caller pressure
        shell: pwsh
        run: ./scripts/Invoke-QdosAlphaAcceptance.ps1 -Profile CiPressure -SourceRevision '${{ github.sha }}'
      - name: Retain content-safe pressure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qdos-pressure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qdos-alpha-acceptance/
          if-no-files-found: error
