<!DOCTYPE html><html><body>
<!--
  v28 self-check: drives every built v28 mockup file in one reused iframe,
  one query-string preset at a time, and asserts DOM facts plus a
  zero-console-error bar. Run headless per
  ../../../.agents/skills/razor-html-mockup-creation/references/mockup-build.md
  with --allow-file-access-from-files so same-origin file:// iframe access
  works (build.py's script.js concatenation matches v27's approach).
-->
<iframe id="f" style="width:1580px;height:1000px"></iframe>
<pre id="out">PENDING</pre>
<script>
const log = [], ok = [];
function check(name, cond) { (cond ? ok : log).push((cond ? 'OK ' : 'FAIL ') + name); }

function loadPage(file, query) {
  return new Promise((resolve, reject) => {
    const f = document.getElementById('f');
    const errors = [];
    const onLoad = () => {
      f.removeEventListener('load', onLoad);
      const w = f.contentWindow, d = f.contentDocument;
      try { w.addEventListener('error', e => errors.push(String(e.message))); } catch (e) { /* cross-origin, should not happen for file:// with the flag */ }
      setTimeout(() => resolve({ w, d, errors }), 350);
    };
    f.addEventListener('load', onLoad);
    f.src = file + (query ? ('?' + query) : '');
  });
}

const PAGES = [
  { file: 'pegasus_work_centre_v28.html', label: 'Work Centre' },
  { file: 'pegasus_cases_index_v28.html', label: 'Cases Index' },
  { file: 'pegasus_case_record_v28.html', label: 'Case record' },
  { file: 'pegasus_triage_unidentified_v28.html', label: 'Triage & Unidentified' },
  { file: 'pegasus_image_intake_v28.html', label: 'Vehicle images' },
  { file: 'pegasus_mail_upload_v28.html', label: 'Inbox & Upload' },
  { file: 'pegasus_search_operations_v28.html', label: 'Search & Operations' },
  { file: 'pegasus_administration_v28.html', label: 'Administration' },
  { file: 'pegasus_account_shell_v28.html', label: 'Account / navless' },
];

// Per-file query presets: [query, assertFn(d,w)] beyond the universal checks
// every shell page gets automatically. Lane-specific presets are appended
// here once each lane's exact state-key vocabulary is confirmed against its
// build output.
const PRESETS = {
  'pegasus_work_centre_v28.html': [
    ['', (d) => d.querySelector('h1')],
    ['data=empty', (d) => d.body],
    ['fresh=stale', (d) => d.body],
    ['role=Engineer', (d) => d.body],
    ['wcattention=unavailable&wcnewcases=unavailable&wcaijobs=unavailable', (d) => d.body],
    ['wcrefresh=failed', (d) => d.body],
    ['wcnotice=success', (d) => d.body],
  ],
  'pegasus_cases_index_v28.html': [
    ['', (d) => d.querySelector('h1')],
    ['data=empty', (d) => d.body],
    ['ciview=create', (d) => d.body],
    ['ciunavailable=1', (d) => d.body],
    ['citab=unidentified&cishow=closed', (d) => d.body],
    ['citab=review', (d) => d.body],
  ],
  'pegasus_case_record_v28.html': [
    ['', (d) => d.querySelector('.app-shell')],
    ['data=empty', (d) => d.body],
    ['crstate=held', (d) => d.body],
    ['crstate=completed', (d) => d.body],
    ['credit=on', (d) => d.body],
    ['credit=on&dialog=case-hold-dialog', (d) => d.body],
    ['crview=evasend', (d) => d.body],
    ['crscroll=tabs', (d) => d.body],
    ['crcasetype=inspectionaudit&crhasreport=yes', (d) => d.body],
    ['crproposal=on', (d) => d.body],
    ['crcasetype=audit', (d) => d.body],
    ['credit=colleague', (d) => d.body],
    ['credit=on&crstate=notready', (d) => d.body],
  ],
  'pegasus_triage_unidentified_v28.html': [
    ['', (d) => d.body],
    ['data=empty', (d) => d.body],
    ['tu-area=unidentified&tu-unident-view=detail', (d) => d.body],
    ['tu-area=triage&tu-triage-view=detail', (d) => d.body],
    ['tu-unident-state=closed&tu-unident-reason=no_id', (d) => d.body],
  ],
  'pegasus_image_intake_v28.html': [
    ['', (d) => d.body],
    ['data=empty', (d) => d.body],
    ['ii-view=detail&ii-state=associated', (d) => d.body],
    ['ii-editing=yes', (d) => d.body],
  ],
  'pegasus_mail_upload_v28.html': [
    ['', (d) => d.body],
    ['data=empty', (d) => d.body],
    ['mu-area=upload&mu-upload-view=idle', (d) => d.body],
    ['mu-mail-view=message', (d) => d.body],
    ['mu-mail-view=compose', (d) => d.body],
    ['mu-status-state=failed', (d) => d.body],
    ['mu-group-state=open-decision-registration', (d) => d.body],
  ],
  'pegasus_search_operations_v28.html': [
    ['', (d) => d.querySelector('h1')?.textContent === 'Search'],
    ['so-area=operations', (d) => [...d.querySelectorAll('h1')].some(h => h.textContent === 'Operations')],
    ['so-search-state=queryfailed', (d) => d.body],
    ['data=empty&role=Engineer&fresh=unavailable', (d) => d.body],
  ],
  'pegasus_administration_v28.html': [
    ['', (d) => d.body],
    ['role=Engineer', (d) => d.body],
    ['ad-area=accounts&adContactEdit=1', (d) => d.body],
    ['ad-area=logs&adLogsTab=intake', (d) => d.body],
    ['ad-area=automation&adAutomationComposed=0', (d) => d.body],
  ],
  'pegasus_account_shell_v28.html': [
    ['', (d) => d.querySelector('h1')?.textContent === 'Sign in to Pegasus'],
    ['acc-page=signedout', (d) => d.body],
    ['acc-page=accessdenied', (d) => d.body],
    ['acc-page=authorize', (d) => d.querySelector('.auth-card--wide')],
    ['acc-page=error', (d) => d.body],
    ['acc-page=status404', (d) => d.body],
    ['acc-page=passwordchange-forced', (d) => d.body],
  ],
};

async function run() {
  try {
    for (const page of PAGES) {
      const presets = PRESETS[page.file] || [['', () => true]];
      for (const [query, assertFn] of presets) {
        const { d, w, errors } = await loadPage(page.file, query);
        check(`${page.label} loads (${query || 'default'})`, !!d && !!d.body);
        check(`${page.label} has window.MOCK (${query || 'default'})`, !!(w && w.MOCK));
        let passed = false;
        try { passed = !!assertFn(d, w); } catch (e) { log.push(`EXC ${page.label} (${query}): ${e.message}`); }
        check(`${page.label} assertion (${query || 'default'})`, passed);
        check(`${page.label} zero console errors (${query || 'default'})`, errors.length === 0);
        if (errors.length) log.push(`CONSOLE ${page.label} (${query}): ${errors.join(' | ')}`);
      }
      // Dialog smoke: shell pages carry account-dialog/notifications-dialog/command-dialog.
      if (page.file !== 'pegasus_account_shell_v28.html') {
        const { d } = await loadPage(page.file, 'dialog=notifications-dialog');
        const dialog = d.querySelector('.dialog-backdrop[data-dialog="notifications-dialog"]');
        check(`${page.label} notifications-dialog opens via query preset`, !!dialog && dialog.hidden === false);
      }
    }
  } catch (e) {
    log.push('EXC top-level: ' + e.message + '\n' + e.stack);
  }
  document.getElementById('out').textContent = 'RESULT ' + JSON.stringify({ fail: log, okCount: ok.length });
}
run();
</script></body></html>
