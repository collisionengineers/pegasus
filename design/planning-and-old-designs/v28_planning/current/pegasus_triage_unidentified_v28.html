<!DOCTYPE html>
<!--
  v28 baseline, Triage and Unidentified. Captured from origin/dev 904903fd1; the operator's proposals sit over it as a switchable layer.
  This file is a frame around captured state pages (states/*.html), which are the
  application's own server-rendered HTML with the live CSS and JS. The bar at the
  top is demo control, not product UI. Temporary design review artifact: not
  application code, not design authority, not implementation evidence.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Triage and Unidentified · Pegasus v28 baseline</title>
<style>
  html, body { height: 100%; margin: 0; background: #2a2f32; font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e7e9ea; }
  body { display: grid; grid-template-rows: auto 1fr; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 6px 10px; background: #1b1e20; border-bottom: 1px solid #33383b; }
  .bar strong { font-weight: 600; }
  .bar label { display: inline-flex; align-items: center; gap: 6px; color: #9aa0a3; }
  .bar select, .bar button, .bar a.button { font: inherit; background: #2a2f32; color: #e7e9ea; border: 1px solid #454b4f; border-radius: 3px; padding: 3px 8px; text-decoration: none; cursor: pointer; }
  .bar select { max-width: 46ch; }
  .bar button[aria-pressed="true"] { background: #e7e9ea; color: #1b1e20; }
  .bar .live { font-family: ui-monospace, Consolas, monospace; color: #c9cdd0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60ch; }
  .bar .note { color: #9aa0a3; font-style: italic; }
  .stage { display: flex; justify-content: center; overflow: auto; min-height: 0; }
  iframe { border: 0; background: #fff; height: 100%; width: 100%; flex: none; }
</style>
</head>
<body>
  <div class="bar" role="group" aria-label="Mockup controls (demo control, not product UI)">
    <strong>v28 baseline</strong>
    <label>Area <select id="family"><option value="pegasus_work_centre_v28.html">Work Centre</option><option value="pegasus_cases_index_v28.html">Cases and Create case</option><option value="pegasus_case_record_v28.html">Case record</option><option value="pegasus_triage_unidentified_v28.html" selected>Triage and Unidentified</option><option value="pegasus_image_intake_v28.html">Image intake</option><option value="pegasus_mail_upload_v28.html">Inbox and Upload</option><option value="pegasus_search_operations_v28.html">Search and Operations</option><option value="pegasus_administration_v28.html">Administration</option><option value="pegasus_account_shell_v28.html">Account, errors and shell</option></select></label>
    <label>State <select id="state">
        <option value="cases-triage" data-live="/Cases?tab=triage" data-note="">Cases, Triage tab</option>
        <option value="cases-triage-selected" data-live="/Cases?tab=triage&amp;selected=78da3cb3-01fb-4d8c-801c-85f93855b44f" data-note="">Cases, Triage tab, row selected</option>
        <option value="triage-record" data-live="/Triage/78da3cb3-01fb-4d8c-801c-85f93855b44f" data-note="">Triage record</option><option value="triage-record" data-query="dialog=triage-assign-dialog" data-live="/Triage/78da3cb3-01fb-4d8c-801c-85f93855b44f" data-note="Preset: dialog=triage-assign-dialog">&nbsp;&nbsp;&nbsp;Assign dialog</option><option value="triage-record" data-query="dialog=triage-await-dialog" data-live="/Triage/78da3cb3-01fb-4d8c-801c-85f93855b44f" data-note="Preset: dialog=triage-await-dialog">&nbsp;&nbsp;&nbsp;Await information dialog</option><option value="triage-record" data-query="dialog=triage-cancel-dialog" data-live="/Triage/78da3cb3-01fb-4d8c-801c-85f93855b44f" data-note="Preset: dialog=triage-cancel-dialog">&nbsp;&nbsp;&nbsp;Cancel Triage dialog</option><option value="triage-record" data-query="dialog=triage-link-case-dialog" data-live="/Triage/78da3cb3-01fb-4d8c-801c-85f93855b44f" data-note="Preset: dialog=triage-link-case-dialog">&nbsp;&nbsp;&nbsp;Link Case dialog</option><option value="triage-record" data-query="dialog=triage-principal-dialog" data-live="/Triage/78da3cb3-01fb-4d8c-801c-85f93855b44f" data-note="Preset: dialog=triage-principal-dialog">&nbsp;&nbsp;&nbsp;Principal dialog</option>
        <option value="cases-unidentified" data-live="/Cases?tab=unidentified" data-note="">Cases, Unidentified tab</option>
        <option value="cases-unidentified-selected" data-live="/Cases?tab=unidentified&amp;selected=fe35ab69-545c-4047-8541-c92e645274e7" data-note="">Cases, Unidentified tab, row selected</option>
        <option value="cases-unidentified-closed" data-live="/Cases?tab=unidentified&amp;show=closed" data-note="">Cases, Unidentified tab, showing closed</option>
        <option value="unidentified-record" data-live="/Unidentified/fe35ab69-545c-4047-8541-c92e645274e7" data-note="">Unidentified record, document</option><option value="unidentified-record" data-query="dialog=unidentified-close-dialog" data-live="/Unidentified/fe35ab69-545c-4047-8541-c92e645274e7" data-note="Preset: dialog=unidentified-close-dialog">&nbsp;&nbsp;&nbsp;Close dialog</option><option value="unidentified-record" data-query="dialog=unidentified-link-dialog" data-live="/Unidentified/fe35ab69-545c-4047-8541-c92e645274e7" data-note="Preset: dialog=unidentified-link-dialog">&nbsp;&nbsp;&nbsp;Link to Case dialog</option>
        <option value="unidentified-record-upload-group" data-live="/Unidentified/81fe0b5a-6e46-4995-b470-9feb5d2feb54?action=register-image" data-note="">Unidentified record, uploaded image group, Register images</option>
        <option value="unidentified-record-mailbox-group" data-live="/Unidentified/7c187d69-01c4-4313-9ff3-22afa24380b4?action=add-existing-case" data-note="">Unidentified record, mailbox image group, Add to an existing case</option>
    </select></label>
    <span role="group" aria-label="Width">
      <button type="button" data-width="" aria-pressed="true">Fit</button>
      <button type="button" data-width="1580" aria-pressed="false">1580</button>
      <button type="button" data-width="1440" aria-pressed="false">1440</button>
      <button type="button" data-width="760" aria-pressed="false">760</button>
    </span>
    <span role="group" aria-label="Baseline or proposals">
      <button type="button" data-layer="on" aria-pressed="true">Proposals</button>
      <button type="button" data-layer="off" aria-pressed="false">Baseline</button>
    </span>
    <a class="button" id="alone" href="#" target="_blank" rel="noopener">Open state alone</a>
    <span class="live" id="live" title="The live route this state was captured from"></span>
    <span class="note" id="note"></span>
  </div>
  <div class="stage"><iframe id="view" title="Triage and Unidentified"></iframe></div>
<script src="assets/mock/routes.js"></script>
<script>
(function () {
  var family = "triage_unidentified";
  var select = document.getElementById('state');
  var view = document.getElementById('view');
  var owner = {};
  var baseline = false;
  (window.V28_ROUTES.families || []).forEach(function (f) { f.states.forEach(function (s) { owner[s.id] = f; }); });

  function show(option, push) {
    var id = option.value;
    var query = option.getAttribute('data-query') || '';
    var layer = baseline ? '&proposals=off' : '';
    view.src = 'states/' + id + '.html?embed=1' + layer + (query ? '&' + query : '');
    document.getElementById('alone').href = 'states/' + id + '.html?' + (baseline ? 'proposals=off' : 'proposals=on') + (query ? '&' + query : '');
    document.getElementById('live').textContent = option.getAttribute('data-live') || '';
    document.getElementById('note').textContent = option.getAttribute('data-note') || '';
    if (push) history.replaceState(null, '', '#' + id + (query ? '?' + query : ''));
  }
  function find(id, query) {
    for (var i = 0; i < select.options.length; i++) {
      var o = select.options[i];
      if (o.value === id && (o.getAttribute('data-query') || '') === (query || '')) return o;
    }
    return null;
  }
  select.addEventListener('change', function () { show(select.options[select.selectedIndex], true); });
  document.getElementById('family').addEventListener('change', function (event) { window.location.href = event.target.value; });
  document.querySelectorAll('[data-width]').forEach(function (button) {
    button.addEventListener('click', function () {
      document.querySelectorAll('[data-width]').forEach(function (b) { b.setAttribute('aria-pressed', b === button ? 'true' : 'false'); });
      var width = button.getAttribute('data-width');
      view.style.width = width ? width + 'px' : '100%';
    });
  });
  document.querySelectorAll('[data-layer]').forEach(function (button) {
    button.addEventListener('click', function () {
      baseline = button.getAttribute('data-layer') === 'off';
      document.querySelectorAll('[data-layer]').forEach(function (b) { b.setAttribute('aria-pressed', b === button ? 'true' : 'false'); });
      show(select.options[select.selectedIndex], false);
    });
  });
  // A captured page navigating to another captured state tells the frame.
  window.addEventListener('message', function (event) {
    if (!event.data || event.data.v28 !== 'state') return;
    var id = event.data.id;
    var target = owner[id];
    if (target && target.key !== family) { window.location.href = target.file + '#' + id; return; }
    var option = find(id, '');
    if (option) { select.value = id; select.selectedIndex = option.index; show(option, true); }
  });
  var hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));
  var parts = hash.split('?');
  var start = (hash && find(parts[0], parts[1] || '')) || select.options[0];
  select.selectedIndex = start.index;
  show(start, false);
})();
</script>
</body>
</html>
