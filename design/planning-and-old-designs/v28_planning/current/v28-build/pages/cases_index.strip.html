<fieldset>
  <legend>Cases</legend>
  <label>View
    <select data-mock-input="ciview">
      <option value="list" selected>List</option>
      <option value="create">Create Case</option>
    </select>
  </label>
  <label>Workflow tab
    <select data-mock-input="citab">
      <option value="not_ready" selected>Not ready</option>
      <option value="review">Review</option>
      <option value="with_engineer">With Engineer</option>
      <option value="complete">Completed</option>
      <option value="query">Query</option>
      <option value="triage">Triage</option>
      <option value="awaiting">Awaiting instruction</option>
      <option value="held">Held</option>
      <option value="unidentified">Unidentified</option>
    </select>
  </label>
  <label>Unidentified · Show
    <select data-mock-input="cishow">
      <option value="open" selected>Open items</option>
      <option value="closed">Closed items</option>
    </select>
  </label>
  <label>Cases unavailable
    <select data-mock-input="ciunavailable">
      <option value="0" selected>No</option>
      <option value="1">Yes</option>
    </select>
  </label>
</fieldset>
