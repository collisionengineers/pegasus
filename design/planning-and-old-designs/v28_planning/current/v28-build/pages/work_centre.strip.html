<fieldset>
  <legend>Work Centre</legend>
  <label>Needs attention section
    <select data-mock-input="wcattention">
      <option value="current" selected>Current</option>
      <option value="unavailable">Unavailable</option>
    </select>
  </label>
  <label>New cases section
    <select data-mock-input="wcnewcases">
      <option value="current" selected>Current</option>
      <option value="unavailable">Unavailable</option>
    </select>
  </label>
  <label>AI jobs section
    <select data-mock-input="wcaijobs">
      <option value="current" selected>Current</option>
      <option value="unavailable">Unavailable</option>
    </select>
  </label>
  <label>Refresh outcome
    <select data-mock-input="wcrefresh">
      <option value="current" selected>Current</option>
      <option value="partial">Partially refreshed</option>
      <option value="failed">Refresh unavailable</option>
    </select>
  </label>
  <label>Kind filter
    <select data-mock-input="wckindfilter">
      <option value="none" selected>All kinds (no filter)</option>
      <option value="unassigned">Unassigned chip active</option>
    </select>
  </label>
  <label>Status notice
    <select data-mock-input="wcnotice">
      <option value="" selected>None</option>
      <option value="success">Success</option>
      <option value="error">Error</option>
    </select>
  </label>
  <label><button type="button" data-mock-action="open-dialog" data-dialog-target="wc-assign-dialog">Assign Engineer dialog</button></label>
</fieldset>
