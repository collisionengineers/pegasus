<fieldset>
  <legend>Mail / Upload area</legend>
  <label>Area
    <select data-mock-input="mu-area">
      <option value="mail" selected>Mail (Inbox)</option>
      <option value="upload">Upload</option>
    </select>
  </label>
  <label>Inbox view
    <select data-mock-input="mu-mail-view">
      <option value="list" selected>List (Mail/Index)</option>
      <option value="message">Message (Mail/Message)</option>
      <option value="compose">Compose (Mail/Compose)</option>
    </select>
  </label>
  <label>Upload view
    <select data-mock-input="mu-upload-view">
      <option value="idle" selected>Upload form (Upload)</option>
      <option value="status">One file's status (UploadStatus)</option>
      <option value="group-status">Batch status (UploadGroupStatus)</option>
    </select>
  </label>
</fieldset>
<fieldset>
  <legend>Inbox list</legend>
  <label>Scope
    <select data-mock-input="mu-list-scope">
      <option value="inbox" selected>Inbox / Sent / Dismissed</option>
      <option value="deleted">Deleted Items (searched)</option>
    </select>
  </label>
  <label>List state
    <select data-mock-input="mu-list-state">
      <option value="populated" selected>Populated results</option>
      <option value="empty-search">Empty — search no match</option>
      <option value="empty-dismissed">Empty — Dismissed scope</option>
      <option value="empty-folder">Empty — folder not kept (Sent)</option>
      <option value="empty-unretained">Empty — before retention started</option>
      <option value="empty-none">Empty — no mail received yet</option>
      <option value="search-invalid">Search validation notice</option>
    </select>
  </label>
  <label>Message preview pane
    <select data-mock-input="mu-preview">
      <option value="open" selected>Open (3-pane)</option>
      <option value="closed">Closed (2-pane)</option>
    </select>
  </label>
  <label>Deleted Items state
    <select data-mock-input="mu-deleted-state">
      <option value="results" selected>Results</option>
      <option value="truncated">Results, truncated at 100</option>
      <option value="empty">No match</option>
      <option value="unavailable">Search unavailable</option>
    </select>
  </label>
</fieldset>
<fieldset>
  <legend>Message record</legend>
  <label>Classification
    <select data-mock-input="mu-msg-state">
      <option value="classified" selected>Classified</option>
      <option value="unclassified">Ambiguous / Unclassified</option>
    </select>
  </label>
  <label>Active tab
    <select data-mock-input="mu-msg-tab">
      <option value="message" selected>Message</option>
      <option value="attachments">Attachments</option>
      <option value="thread">Thread</option>
      <option value="case">Case</option>
    </select>
  </label>
  <label>Correspondence
    <select data-mock-input="mu-msg-correspond">
      <option value="available" selected>Reply/Reply all/Forward available</option>
      <option value="unavailable">Unavailable (no approved mailbox)</option>
    </select>
  </label>
  <label>Inline compose
    <select data-mock-input="mu-msg-compose">
      <option value="none" selected>None</option>
      <option value="reply">Reply</option>
      <option value="reply-all">Reply all</option>
      <option value="forward">Forward</option>
    </select>
  </label>
  <label>Send status
    <select data-mock-input="mu-msg-sendstatus">
      <option value="none" selected>None</option>
      <option value="preparing">Preparing</option>
      <option value="submitted">Submitted (needs Reconcile)</option>
      <option value="sent">Sent</option>
      <option value="failed">Failed</option>
    </select>
  </label>
  <label>Draft reply with AI
    <select data-mock-input="mu-msg-queryresponse">
      <option value="none" selected>Not a post-report source</option>
      <option value="enabled">Available</option>
      <option value="gated-case-unavailable">Gated — case unavailable</option>
      <option value="gated-not-post-report">Gated — not post-report</option>
      <option value="gated-automation-stopped">Gated — automation stopped</option>
    </select>
  </label>
  <label>Notice banner
    <select data-mock-input="mu-msg-notice">
      <option value="none" selected>None</option>
      <option value="classification">Classification corrected</option>
      <option value="folder">Folder moved</option>
      <option value="association">Case linked</option>
      <option value="queryresponse">AI reply job created</option>
      <option value="correspondence">Correspondence sent</option>
    </select>
  </label>
  <label>Folder recommendation
    <select data-mock-input="mu-msg-folder">
      <option value="none" selected>None</option>
      <option value="unconfirmed">Unconfirmed (check move status)</option>
      <option value="moved">Moved</option>
      <option value="recommended">Recommended — not moved</option>
    </select>
  </label>
  <label><input type="checkbox" data-mock-input="mu-msg-corrections" /> Has correction history</label>
  <label><input type="checkbox" data-mock-input="mu-msg-outside" /> Outside current list scope</label>
  <label><input type="checkbox" data-mock-input="mu-msg-dismissed" /> Dismissed</label>
  <label>Thread
    <select data-mock-input="mu-msg-thread">
      <option value="empty" selected>Only this message retained</option>
      <option value="populated">Other retained messages</option>
    </select>
  </label>
  <label>Case tab
    <select data-mock-input="mu-msg-case">
      <option value="linked" selected>Linked to a Case</option>
      <option value="unlinked">Not linked (search)</option>
    </select>
  </label>
</fieldset>
<fieldset>
  <legend>Compose</legend>
  <label>Form state
    <select data-mock-input="mu-compose-state">
      <option value="form" selected>Form</option>
      <option value="unavailable">Correspondence unavailable</option>
      <option value="no-default-mailbox">No default mailbox configured</option>
    </select>
  </label>
  <label>Send status
    <select data-mock-input="mu-compose-status">
      <option value="none" selected>None</option>
      <option value="resolved">Sent</option>
      <option value="unresolved">Submitted (needs Reconcile)</option>
    </select>
  </label>
  <label><input type="checkbox" data-mock-input="mu-compose-results" /> Case search results shown</label>
  <label><input type="checkbox" data-mock-input="mu-compose-attachments" /> Attachments available</label>
  <label><input type="checkbox" data-mock-input="mu-compose-notice" /> Send notice banner</label>
</fieldset>
<fieldset>
  <legend>Upload form</legend>
  <label>Dropzone
    <select data-mock-input="mu-upload-idle">
      <option value="empty" selected>No files chosen</option>
      <option value="chosen">Files chosen</option>
    </select>
  </label>
  <label><input type="checkbox" data-mock-input="mu-upload-error" /> Validation error</label>
</fieldset>
<fieldset>
  <legend>Upload status (one file)</legend>
  <label>Outcome
    <select data-mock-input="mu-status-state">
      <option value="received" selected>Received</option>
      <option value="processing">Processing</option>
      <option value="complete-attached">Complete — attached to a case</option>
      <option value="complete-imagecase-awaiting">Complete — vehicle images, awaiting instruction</option>
      <option value="complete-imagecase-final">Complete — vehicle images, merged into a Case</option>
      <option value="complete-needsreview">Complete — needs review (Unidentified)</option>
      <option value="complete-resolved">Complete — resolved Unidentified</option>
      <option value="complete-possiblematch">Complete — possible matching cases</option>
      <option value="complete-readytocreate">Complete — no match, ready to create</option>
      <option value="complete-cannotbecomecase">Complete — cannot become a case</option>
      <option value="failed">Failed</option>
    </select>
  </label>
  <label><input type="checkbox" data-mock-input="mu-status-duplicate" /> Duplicate (already received)</label>
</fieldset>
<fieldset>
  <legend>Upload status (batch)</legend>
  <label>Submission state
    <select data-mock-input="mu-group-state">
      <option value="open-decision-registration" selected>Open decision — offer vehicle-image registration</option>
      <option value="open-decision-attach">Open decision — add to existing case only</option>
      <option value="decided-attached">Decided — attached to a Case</option>
      <option value="decided-vehicleimages">Decided — registered as vehicle images</option>
      <option value="decided-unidentified">Decided — Unidentified</option>
      <option value="can-discard">Complete, discard offered</option>
      <option value="discarded">Submission discarded</option>
    </select>
  </label>
</fieldset>
