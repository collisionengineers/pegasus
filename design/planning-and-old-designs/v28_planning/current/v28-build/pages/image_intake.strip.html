<fieldset>
  <legend>Vehicle images</legend>
  <label>View
    <select data-mock-input="ii-view">
      <option value="list" selected>List (Cases tab=awaiting)</option>
      <option value="detail">Record (ImageIntake/Details)</option>
    </select>
  </label>
  <label>Queue data
    <select data-mock-input="ii-queue">
      <option value="available" selected>Available</option>
      <option value="unavailable">Cases are unavailable</option>
    </select>
  </label>
</fieldset>
<fieldset>
  <legend>Record</legend>
  <label>Lifecycle state
    <select data-mock-input="ii-state">
      <option value="awaiting" selected>Awaiting definitive instruction</option>
      <option value="merged">Merged into Instruction-initiated Case</option>
      <option value="staffclosed">Staff-closed</option>
    </select>
  </label>
  <label>Editing
    <select data-mock-input="ii-editing">
      <option value="no" selected>Not editing</option>
      <option value="yes">Editing</option>
    </select>
  </label>
  <label>Triage opened from this receipt
    <select data-mock-input="ii-triage">
      <option value="no" selected>None</option>
      <option value="yes">Present</option>
    </select>
  </label>
</fieldset>
