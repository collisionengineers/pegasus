<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Message · Pegasus</title>
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.css">
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/styles.css">
<style>a{color:var(--navy-fg)}a:hover{color:var(--ce-red-dark)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">
const {BackLink, PageHeading, Panel, Tabs, DetailList, DataTable, StatusChip, EvidenceFigure, Button, EmptyState, Icon} = DS;
const ATT = [
  {name:"EREF17-instruction.pdf", type:"application/pdf", size:"312 KB"},
  {name:"damage-photo-1.jpg", type:"image/jpeg", size:"2.4 MB"},
  {name:"damage-photo-2.jpg", type:"image/jpeg", size:"2.1 MB"},
  {name:"licence-plate-photo-1.jpg", type:"image/jpeg", size:"1.8 MB"},
];
function Page(){
  const [tab, setTab] = React.useState("message");
  return <Shell nav="Inbox">
    <BackLink href="Inbox.html">Back to Inbox</BackLink>
    <PageHeading title="Fw: (EREF17) RTA on 22/07/2026 : Mr Muneeb Sarwar (Our Ref: REB/ND/47023/2)"
      actions={<Button href="Case.html" variant="dark">Open case QDOS26001</Button>}/>
    <Panel style={{marginTop:"var(--sp-6)"}} aria-label="Current state">
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:"var(--sp-6)"}}>
        <EvidenceFigure label="Classification" value="Instruction" source="Read from the message and its attachments"/>
        <EvidenceFigure label="Filed to" value={<a href="Case.html">QDOS26001</a>} source="Matched on: Our Ref REB/ND/47023/2 — extracted from the instruction e-mail"/>
        <EvidenceFigure label="Processing outcome" value={<StatusChip state="Case created" tone="green" icon="check-circle"/>} source="14 Aug 09:51"/>
      </div>
    </Panel>
    <Tabs label="Sections" tabs={[
      {label:"Message", current:tab==="message", onClick:()=>setTab("message")},
      {label:"Attachments", count:4, current:tab==="attachments", onClick:()=>setTab("attachments")},
      {label:"Thread", current:tab==="thread", onClick:()=>setTab("thread")},
    ]}/>
    {tab==="message" && <Panel aria-label="Message">
      <DetailList items={[
        {term:"From", value:"nduncombe@qdosassist.co.uk"},
        {term:"Forwarded by", value:"Desk <desk@collisionengineers.co.uk>"},
        {term:"To", value:"instructions@collisionengineers.co.uk"},
        {term:"Mailbox", value:"instructions@collisionengineers.co.uk"},
        {term:"Received", value:"14 Aug 2026 09:51 London"},
      ]}/>
      <pre className="mail-body" style={{marginTop:"var(--sp-6)",whiteSpace:"pre-wrap",fontFamily:"inherit",fontSize:"var(--t-body)",lineHeight:1.55,border:"var(--border)",borderRadius:"var(--radius)",padding:"12px 14px",background:"var(--paper)"}}>{
"Good morning,\n\nPlease find attached our instruction EREF17 for Mr Muneeb Sarwar following an RTA on 22/07/2026.\n\nOur reference: REB/ND/47023/2\nVehicle: to be confirmed\nInspection: image based assessment\n\nImages from the repairer will follow under the same reference.\n\nKind regards\nNikki Duncombe\nQDOS Assist"}</pre>
    </Panel>}
    {tab==="attachments" && <Panel aria-label="Attachments">
      <DataTable caption="Attachments on this message" rows={ATT} columns={[
        {header:"File", cell:r=><a href="#">{r.name}</a>},
        {header:"Type", cell:r=>r.type},
        {header:"Size", cell:r=>r.size, tabular:true},
        {header:"Custody", cell:r=><StatusChip state="Retained" tone="neutral" icon="lock"/>},
      ]}/>
    </Panel>}
    {tab==="thread" && <Panel aria-label="Thread">
      <EmptyState>This is the only message under Our Ref REB/ND/47023/2 in this mailbox. A related message arrived 14 Aug 08:17 and is filed to the same case.</EmptyState>
    </Panel>}
  </Shell>;
}
mount(<Page/>);
</script>
</body></html>
