<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Organisations · Pegasus</title>
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.css">
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/styles.css">
<style>a{color:var(--navy-fg)}a:hover{color:var(--ce-red-dark)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">
const {BackLink, Eyebrow, PageHeading, SplitMain, SectionLabel, Notice, DataTable, Button, FormPanel, Field, Input, Choice, ChoiceGroup, PrimaryAction, Pager} = DS;
function Page(){
  return <Shell nav="Administration">
    <BackLink href="Administration.html">Back to Administration</BackLink>
    <Eyebrow>Administration</Eyebrow>
    <PageHeading title="Organisations"/>
    <div style={{marginTop:"var(--sp-6)"}}>
    <SplitMain>
      <div>
        <Notice>Organisation roles are independent: a Work Provider can own principals; an Instruction Intermediary can route work without becoming the principal.</Notice>
        <SectionLabel>Current organisations</SectionLabel>
        <DataTable caption="Organisations" rows={[
          {name:"QDOS", roles:"Work Provider", principals:1, version:3},
          {name:"Auxillis", roles:"Instruction Intermediary", principals:0, version:1},
        ]} columns={[
          {header:"Name", cell:r=><b>{r.name}</b>},
          {header:"Roles", cell:r=>r.roles},
          {header:"Active principals", cell:r=>r.principals, tabular:true},
          {header:"Version", cell:r=>r.version, tabular:true},
          {header:"Actions", cell:r=><span style={{display:"inline-flex",gap:"8px"}}><Button>Manage roles</Button><Button href="AdminPrincipals.html">Create principal</Button></span>},
        ]}/>
        <Pager context="Page 1 · showing 2" label="Organisation pages"/>
      </div>
      <FormPanel title="Create organisation" form={{onSubmit:e=>e.preventDefault()}}>
        <Field label="Organisation name" htmlFor="org-name"><Input id="org-name"/></Field>
        <ChoiceGroup legend="Organisation roles" stacked>
          <label className="choice"><input type="checkbox"/> <span>Work Provider</span></label>
          <label className="choice"><input type="checkbox"/> <span>Instruction Intermediary</span></label>
        </ChoiceGroup>
        <div><PrimaryAction type="submit">Create organisation</PrimaryAction></div>
      </FormPanel>
    </SplitMain>
    </div>
  </Shell>;
}
mount(<Page/>);
</script>
</body></html>
