<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Access review · Pegasus</title>
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.css">
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/styles.css">
<style>a{color:var(--navy-fg)}a:hover{color:var(--ce-red-dark)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">
const {BackLink, Eyebrow, PageHeading, SectionLabel, Notice, DataTable, StatusChip, RowConfirm} = DS;
function Page(){
  return <Shell nav="Administration">
    <BackLink href="Administration.html">Back to Administration</BackLink>
    <Eyebrow>Administration</Eyebrow>
    <PageHeading title="Access review"/>
    <div style={{marginTop:"var(--sp-6)",maxWidth:"1080px"}}>
      <Notice>An access review records that a named administrator looked at who can sign in and what they can do. The decision is permanent and attributable; it changes nothing by itself.</Notice>
      <SectionLabel>Current access</SectionLabel>
      <DataTable caption="Staff access for review" rows={[
        {u:"alex", roles:"Administrator", reviewed:"12 May 2026 · alex", state:"Recorded", tone:"green"},
        {u:"patrick", roles:"Engineer", reviewed:"12 May 2026 · alex", state:"Recorded", tone:"green"},
        {u:"j.patel", roles:"User", reviewed:null, state:"Never reviewed", tone:"amber"},
      ]} columns={[
        {header:"Username", cell:r=><b>{r.u}</b>},
        {header:"Status", cell:r=><StatusChip state="Enabled" tone="green" icon="check-circle"/>},
        {header:"Roles", cell:r=>r.roles},
        {header:"Last reviewed", cell:r=>r.reviewed || <span style={{color:"var(--muted)"}}>Never</span>, tabular:true},
        {header:"Review state", cell:r=><StatusChip state={r.state} tone={r.tone} icon={r.tone==="green"?"check-circle":"clock"}/>},
        {header:"Action", cell:r=><RowConfirm summary="Record reviewed" reasonId={"review-"+r.u} confirm="Record reviewed"/>},
      ]}/>
    </div>
  </Shell>;
}
mount(<Page/>);
</script>
</body></html>
