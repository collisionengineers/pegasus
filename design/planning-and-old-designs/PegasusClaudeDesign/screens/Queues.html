<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Queues · Pegasus</title>
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.css">
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/styles.css">
<style>a{color:var(--navy-fg)}a:hover{color:var(--ce-red-dark)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">
const {PageHeading, Refresh, Tabs, DataTable, StatusChip, Pager, EmptyState, QueueFilters, Subtabs} = DS;
const ROWS = {
  "Not ready": [
    {ref:"QDOS26001", reg:null, claimant:"Mr Muneeb Sarwar", principal:"QDOS", received:"14 Aug 2026", kind:"images", waiting:"Awaiting images · repairer chased", chase:"18 Aug"},
    {ref:"QDOS26017", reg:"GP72AUV", claimant:"Mr Reece Young", principal:"QDOS", received:"14 Aug 2026", kind:"instructions", waiting:"Awaiting instructions · images only", chase:"—"},
    {ref:"QDOS26018", reg:"PN09AAE", claimant:"Mrs Billie-Jo Till", principal:"QDOS", received:"12 Aug 2026", kind:"images", waiting:"Awaiting images · review outstanding", chase:"19 Aug"},
    {ref:"QDOS26011", reg:null, claimant:"Mr Adewale Abass", principal:"QDOS", received:"14 Aug 2026", kind:"images", waiting:"Awaiting images", chase:"18 Aug"},
    {ref:"QDOS26010", reg:null, claimant:"Mr Reece Young", principal:"QDOS", received:"14 Aug 2026", kind:"images", waiting:"Awaiting images", chase:"18 Aug"},
    {ref:"QDOS26008", reg:"LL61FZF", claimant:"Mr Farkh Jaweed", principal:"QDOS", received:"11 Aug 2026", kind:"instructions", waiting:"Awaiting instructions · claim number missing", chase:"17 Aug"},
    {ref:"QDOS26004", reg:null, claimant:"Ms Lucie Barnfield", principal:"QDOS", received:"8 Aug 2026", kind:"images", waiting:"Awaiting images", chase:"17 Aug"},
  ],
  "Review": [
    {ref:"QDOS26014", reg:"LM18XEV", claimant:"Mr Adam Nazm", principal:"QDOS", received:"30 Jul 2026", waiting:"Assessment in progress", chase:"—"},
    {ref:"QDOS26013", reg:"GP72AUV", claimant:"Ms Sadie Miller", principal:"QDOS", received:"10 Aug 2026", waiting:"Ready to assess", chase:"—"},
    {ref:"QDOS26012", reg:"AK62NDX", claimant:"Mr Tomasz Mydlowski", principal:"QDOS", received:"11 Aug 2026", waiting:"Report approval", chase:"—"},
  ],
  "Held": [
    {ref:"QDOS26009", reg:"AK62NDX", claimant:"Ms Sadie Miller", principal:"QDOS", received:"9 Aug 2026", waiting:"Held at the principal's request", chase:"Review hold 22 Aug"},
  ],
  "Triage": [],
};
const COUNTS = {"Not ready":7, "Review":3, "Held":1, "Triage":2};
const EMPTY = {"Triage": <span>The two unsorted messages live in the <a href="Inbox.html">Inbox</a>; a case appears here only once one is chosen for it.</span>};
function Page(){
  const [tab, setTab] = React.useState("Not ready");
  const [kind, setKind] = React.useState("All");
  const all = ROWS[tab];
  const rows = (tab==="Not ready" && kind!=="All") ? all.filter(r=>r.kind===(kind==="Awaiting instructions"?"instructions":"images")) : all;
  const nInstr = ROWS["Not ready"].filter(r=>r.kind==="instructions").length, nImg = ROWS["Not ready"].length-nInstr;
  return <Shell nav="Queues">
    <PageHeading title="Queues" refresh={<Refresh updatedAt="16 Aug 17:02" onRefresh={()=>{}}/>}/>
    <Tabs label="Queue stages" tabs={Object.keys(ROWS).map(k=>({label:k, count:COUNTS[k], current:tab===k, onClick:()=>{setTab(k); setKind("All");}}))}/>
    {tab==="Not ready" && <Subtabs sectionGap label="What the case is waiting for" tabs={[
      {label:"All", count:ROWS["Not ready"].length, current:kind==="All", onClick:()=>setKind("All")},
      {label:"Awaiting instructions", count:nInstr, current:kind==="Awaiting instructions", onClick:()=>setKind("Awaiting instructions")},
      {label:"Awaiting images", count:nImg, current:kind==="Awaiting images", onClick:()=>setKind("Awaiting images")},
    ]}/>}
    {rows.length===0 ? <EmptyState>{EMPTY[tab] || "Nothing is waiting here."}</EmptyState> :
    <React.Fragment>
      <DataTable caption={tab+" cases"} rows={rows} columns={[
        {header:"Case", cell:r=><a href={r.ref==="QDOS26014"?"Assessment.html":"Case.html"}>{r.ref}</a>},
        {header:"Registration", cell:r=>r.reg || <span style={{color:"var(--muted)"}}>—</span>},
        {header:"Claimant", cell:r=>r.claimant},
        {header:"Principal", cell:r=>r.principal},
        {header:"Waiting on", cell:r=>r.waiting},
        {header:"Received", cell:r=>r.received, tabular:true},
        {header:"Next chase", cell:r=>r.chase, tabular:true},
      ]}/>
      <Pager context={"Page 1 · showing "+rows.length} label="Queue pages"/>
    </React.Fragment>}
  </Shell>;
}
mount(<Page/>);
</script>
</body></html>
