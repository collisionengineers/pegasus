<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff accounts · Pegasus</title>
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.css">
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/styles.css">
<style>a{color:var(--navy-fg)}a:hover{color:var(--ce-red-dark)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">
const {BackLink, Eyebrow, PageHeading, SplitMain, SectionLabel, DataTable, StatusChip, Button, FormPanel, Field, Input, Textarea, PrimaryAction} = DS;
function Page(){
  return <Shell nav="Administration">
    <BackLink href="Administration.html">Back to Administration</BackLink>
    <Eyebrow>Administration</Eyebrow>
    <PageHeading title="Staff accounts"/>
    <div style={{marginTop:"var(--sp-6)"}}>
    <SplitMain>
      <div>
        <SectionLabel>Current accounts</SectionLabel>
        <DataTable caption="Staff accounts" rows={[
          {u:"alex", status:"Enabled", roles:"Administrator", pw:"Complete", last:"16 Aug 16:58"},
          {u:"patrick", status:"Enabled", roles:"Engineer", pw:"Complete", last:"15 Aug 17:31"},
          {u:"j.patel", status:"Enabled", roles:"User", pw:"Pending", last:"Never"},
          {u:"l.morris", status:"Disabled", roles:"User", pw:"Complete", last:"2 Mar 09:14"},
        ]} columns={[
          {header:"Username", cell:r=><b>{r.u}</b>},
          {header:"Status", cell:r=><StatusChip state={r.status} tone={r.status==="Enabled"?"green":"neutral"} icon={r.status==="Enabled"?"check-circle":"lock"}/>},
          {header:"Roles", cell:r=>r.roles},
          {header:"First password change", cell:r=>r.pw==="Pending"?<StatusChip state="Pending" tone="amber" icon="clock"/>:r.pw},
          {header:"Last signed in", cell:r=>r.last, tabular:true},
          {header:"Action", cell:r=><Button>Manage</Button>},
        ]}/>
      </div>
      <FormPanel title="Create staff account" form={{onSubmit:e=>e.preventDefault()}}>
        <Field label="Username" htmlFor="ca-user"><Input id="ca-user" autoComplete="off"/></Field>
        <Field label="Temporary password" htmlFor="ca-pass" hint="At least eight characters. The staff member must replace it at first sign-in."><Input id="ca-pass" type="password" autoComplete="new-password"/></Field>
        <Field label="Reason" htmlFor="ca-reason"><Textarea id="ca-reason" rows={3}/></Field>
        <div><PrimaryAction type="submit">Create account</PrimaryAction></div>
      </FormPanel>
    </SplitMain>
    </div>
  </Shell>;
}
mount(<Page/>);
</script>
</body></html>
