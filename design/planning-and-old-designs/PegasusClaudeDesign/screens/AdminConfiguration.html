<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workflow configuration · Pegasus</title>
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.css">
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/styles.css">
<style>a{color:var(--navy-fg)}a:hover{color:var(--ce-red-dark)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">
const {BackLink, Eyebrow, PageHeading, SplitMain, SectionLabel, Notice, DetailList, StatusChip, FormPanel, Field, Textarea, Choice, ChoiceGroup, PrimaryAction, Panel} = DS;
const GATES = ["Instructions are complete","Images are complete","A staff member reviewed the instructions","A staff member reviewed the images"];
function Page(){
  return <Shell nav="Administration">
    <BackLink href="Administration.html">Back to Administration</BackLink>
    <Eyebrow>Administration</Eyebrow>
    <PageHeading title="Workflow configuration"/>
    <div style={{marginTop:"var(--sp-6)"}}>
    <SplitMain>
      <div>
        <Notice>These versioned gates control whether a case can be assigned to an Engineer. Relaxing one applies to every case from the next version on — it does not reopen past assignments.</Notice>
        <SectionLabel>Current configuration</SectionLabel>
        <Panel>
          <DetailList items={[
            {term:"Policy", value:<b>case-workflow</b>},
            {term:"Version", value:<span className="tabular">4 · saved 2 Jun 2026 by alex</span>},
          ].concat(GATES.map(g=>({term:g, value:<StatusChip state="Required" tone="navy" icon="lock"/>})))}/>
        </Panel>
      </div>
      <FormPanel title="Update assignment gates" form={{onSubmit:e=>e.preventDefault()}}>
        <ChoiceGroup legend="Required before Engineer assignment" stacked>
          {GATES.map(g=><label className="choice" key={g}><input type="checkbox" defaultChecked/> <span>{g}</span></label>)}
        </ChoiceGroup>
        <Field label="Reason for this configuration change" htmlFor="wc-reason"><Textarea id="wc-reason" rows={3}/></Field>
        <div><PrimaryAction type="submit">Save workflow configuration</PrimaryAction></div>
      </FormPanel>
    </SplitMain>
    </div>
  </Shell>;
}
mount(<Page/>);
</script>
</body></html>
