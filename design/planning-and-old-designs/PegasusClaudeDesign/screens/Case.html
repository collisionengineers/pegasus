<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Case QDOS26014 · Pegasus</title>
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.css">
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/styles.css">
<style>a{color:var(--navy-fg)}a:hover{color:var(--ce-red-dark)}
.block{border:var(--border);border-radius:var(--radius);background:#fff;min-width:0}
.block>header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:8px 14px;background:var(--paper);border-bottom:var(--border);border-radius:var(--radius) var(--radius) 0 0}
.block>header h3{margin:0;font-size:var(--t-eyebrow);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.block>div{padding:4px 14px 8px}
.note-row{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:8px 0;border-bottom:var(--border)}
.note-row:last-child{border-bottom:0}
.note-row time{font-variant-numeric:tabular-nums;font-size:var(--t-sm);color:var(--muted)}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">

const { Crumb, Record, RecordHead, RecordBar, RecordBody, Tabs, Subtabs, StatusChip, Button, DataRow, Provenance, DataTable, QueueList, QueueListRow, EmptyState, Blockhead, Panel, SectionLabel, Select, Field, Textarea, StatusCard, Input, SendToClaudeButton, Icon, Notice } = DS;
const NOTES = [
{ when: "16 Aug 17:05", who: "alex", text: "Experian AutoCheck run: previous total loss (Cat N) and a plate change on record." },
{ when: "15 Aug 11:24", who: "Patrick", text: "Repairer estimate received and filed to Evidence. Assessment started." },
{ when: "14 Aug 09:12", who: "Pegasus", text: "Chase sent to the repairer for outstanding images.", auto: true },
{ when: "31 Jul 12:38", who: "Patrick", text: "Case allocated to Patrick." },
{ when: "30 Jul 11:18", who: "Pegasus", text: "Case created from mailbox instruction EREF14.", auto: true }];

const QUERIES = [
{ raised: "12 Aug", state: "Resolved", by: "Patrick", text: "Confirm whether the OSF wheel is original equipment — affects the tyre line.", resolved: "13 Aug · repairer confirmed OEM" },
{ raised: "15 Aug", state: "Open", by: "Patrick", text: "Principal to confirm the 70% total-loss threshold applies to this policy year." }];

function Experian() {
  const [state, setState] = React.useState("idle");
  React.useEffect(() => {if (state === "checking") {const t = setTimeout(() => setState("done"), 900);return () => clearTimeout(t);}}, [state]);
  return <div style={{ marginTop: "4px" }}>
    {state !== "done" && <Button icon="search" disabled={state === "checking"} onClick={() => setState("checking")}>{state === "checking" ? "Checking Experian…" : "Check Experian"}</Button>}
    {state === "done" && <div style={{ border: "1px solid var(--amber-line)", borderLeft: "3px solid var(--amber-line)", background: "var(--amber-bg)", borderRadius: "var(--radius)", padding: "10px 12px", display: "grid", gap: "6px" }}>
      <b style={{ fontSize: "var(--t-sm)", color: "var(--amber-fg)" }}>Experian AutoCheck · 16 Aug 17:05 · alex</b>
      <ul style={{ margin: 0, paddingLeft: "18px", fontSize: "var(--t-sm)", display: "grid", gap: "3px" }}>
        <li><b>Previous total loss</b> — Category N, recorded Jun 2023</li>
        <li><b>Plate change on record</b> — 23 Jun 2026, see plate change details</li>
        <li>Keepers: 3 · First registered 3 May 2018</li>
        <li>MOT expires 14 Feb 2027 · Taxed to 1 Nov 2026</li>
        <li>No outstanding finance · Not recorded stolen</li>
      </ul>
    </div>}
  </div>;
}
function prov(word) {return <Provenance word={word} />;}
function pv(v, word) {return <span style={{display:"inline-flex",alignItems:"center",gap:"6px"}}>{v}<Provenance word={word}/></span>;}
function LinkDialog({open, onClose}) {
  const [copied, setCopied] = React.useState(false);
  const url = "https://upload.collisionengineers.co.uk/l/QDOS26014-7f3a";
  if (!open) return null;
  return <div className="reason-dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="ul-title" style={{display:"grid"}}>
    <div className="reason-dialog" style={{maxWidth:"440px"}}>
      <h2 id="ul-title">Upload link for QDOS26014</h2>
      <p style={{fontSize:"var(--t-sm)",color:"var(--muted)"}}>Expires 23 Aug 2026.</p>
      <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) auto",gap:"8px",alignItems:"center"}}>
        <Input readOnly value={url} aria-label="Upload link" onFocus={e=>e.target.select()}/>
        <Button variant="dark" icon={copied?"check-circle":undefined} onClick={()=>{navigator.clipboard && navigator.clipboard.writeText(url); setCopied(true);}}>{copied?"Copied":"Copy link"}</Button>
      </div>
      <div className="button-row" style={{marginTop:"var(--sp-6)"}}><Button onClick={onClose}>Close</Button></div>
    </div>
  </div>;
}
function Page() {
  const [tab, setTab] = React.useState("overview");
  const [ev, setEv] = React.useState("photos");
  const [linkOpen, setLinkOpen] = React.useState(false);
  return <Shell nav="Cases">
    <Crumb parents={[{ label: "Cases", href: "Cases.html" }]} current="QDOS26014" />
    <Record state="review">
      <RecordHead reference="QDOS26014" identity={[
      <Head key="p" term="Principal" val="QDOS" />,
      <Head key="r" term="Registration" val="LM18XEV" />,
      <Head key="c" term="Claimant" val="Mr Adam Nazm" />,
      <Head key="t" term="Type" val="Inspection" />]
      } end={<StatusChip state="Review" />} />
      <RecordBar end={<Button variant="dark" href="Assessment.html">Open assessment</Button>}>
        <Button>Edit case</Button>
        <Button>Add a note</Button>
        <Button onClick={() => setLinkOpen(true)}>Create upload link</Button>
        <Button href="#" icon="upload">Export</Button>
      </RecordBar>
      <Tabs label="Case sections" tabs={[
      { label: "Overview", current: tab === "overview", onClick: () => setTab("overview") },
      { label: "Inspection", current: tab === "inspection", onClick: () => setTab("inspection") },
      { label: "Evidence", count: 14, current: tab === "evidence", onClick: () => setTab("evidence") },
      { label: "Notes & history", count: 7, current: tab === "notes", onClick: () => setTab("notes") }]
      } />
      <RecordBody>
        {tab === "overview" && <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(380px,1fr))", gap: "16px", alignItems: "start" }}>
          <section className="block"><header><h3>Case identity</h3></header><div>
            <DataRow field="Case/PO" value={pv("QDOS26014", "Automatic")} />
            <DataRow field="Case type" value={pv("Inspection", "Extracted")} />
            <DataRow field="Principal" value={pv("QDOS", "Principal")} />
            <DataRow field="Claimant" value={pv("Mr Adam Nazm", "Extracted")} />
            <DataRow field="Claim number" value={pv("1745ADAM", "Extracted")} />
            <DataRow field="Engineer" value={pv("Patrick", "Staff")} />
          </div></section>
          <section className="block"><header><h3>Vehicle</h3><Button icon="search">Look up vehicle</Button></header><div>
            <DataRow field="Registration" value={pv("LM18XEV", "Extracted")} />
            <DataRow field="Vehicle" value={pv("Mercedes-Benz C 220 AMG Line Premium+ D 4Matic", "Lookup")} />
            <DataRow field="Year · colour" value={pv("2018 · Blue", "Lookup")} />
            <DataRow field="VIN" value={pv("WDD2053052F733160", "Lookup")} />
            <DataRow field="Odometer" value={pv("98,828 miles", "Extracted")} />
            <Experian />
          </div></section>
          <section className="block"><header><h3>Dates and origin</h3></header><div>
            <DataRow field="Incident date" value={pv("23 Jul 2026", "Extracted")} />
            <DataRow field="Instruction date" value={pv("28 Jul 2026", "Extracted")} />
            <DataRow field="Received" value={pv("30 Jul 2026 11:18", "Automatic")} />
            <DataRow field="Origin" value={pv("E-mail from nduncombe@qdosassist.co.uk", "E-mail")} />
          </div></section>
          <section className="block"><header><h3>Accident circumstances</h3></header><div>
            <p style={{ margin: "8px 0", fontSize: "var(--t-body)", lineHeight: 1.55 }}>Third party pulled out of a junction into the right front of the insured vehicle. Impact to the right front wheel, suspension and wing. <Provenance word="Extracted" /></p>
          </div></section>
          <section className="block" style={{ borderLeft: "3px solid var(--navy-line)" }}><header><h3>Where this case stands</h3></header><div>
            <DataRow field="Report due" value={pv("16 Aug 2026", "Automatic")} />
            <DataRow field="Assessment" value={<a href="Assessment.html">5 of 7 sections recorded</a>} />
            <DataRow field="Outstanding" value="Signature and agreed fee" />
            <DataRow field="Recommendation" value={pv(<span><b>Total loss</b> · Cat N</span>, "Staff")} />
          </div></section>
        </div>}
        {tab === "inspection" && <div style={{ maxWidth: "720px" }}>
          <StatusCard variant="info" title="QDOS uses Image Based Assessment">The inspection address is recorded as “Image Based Assessment” automatically. Recording a physical address instead needs a reason.</StatusCard>
          <div style={{ display: "grid", gap: "var(--sp-4)", marginTop: "var(--sp-6)" }}>
            <DataRow field="Assessment method" value={pv("Image Based Assessment", "Principal")} />
            <label htmlFor="insp-addr" style={{ fontSize: "var(--t-sm)", fontWeight: 600 }}>Inspection address</label>
            <Textarea id="insp-addr" rows={3} defaultValue="Image Based Assessment" />
            <SectionLabel>Previously used for QDOS</SectionLabel>
            {["Wallgate ARC, Unit 4, Wallgate Industrial Estate, Wigan WN3 4BX", "Motofix Accident Repair, Ashville Trading Estate, Bristol BS3 2AT"].map(a => <div key={a} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: "12px", border: "var(--border)", borderRadius: "var(--radius)", padding: "8px 12px", background: "#fff" }}>
              <span style={{ fontSize: "var(--t-sm)" }}>{a}</span><Button>Use this address</Button>
            </div>)}
            <div style={{ display: "flex", gap: "10px" }}><Button variant="dark">Save inspection</Button></div>
          </div>
        </div>}
        {tab === "evidence" && <React.Fragment>
          <Subtabs label="Evidence kinds" tabs={[
          { label: "Photos", count: 9, current: ev === "photos", onClick: () => setEv("photos") },
          { label: "Documents", count: 3, current: ev === "documents", onClick: () => setEv("documents") },
          { label: "E-mails", count: 2, current: ev === "emails", onClick: () => setEv("emails") }]
          } />
          {ev === "photos" && <React.Fragment>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(150px,1fr))", gap: "12px", marginTop: "var(--sp-6)" }}>
              {["licence-plate-photo-1.jpg", "damage-photo-1.jpg", "damage-photo-2.jpg", "damage-photo-3.jpg", "corner-photo-1.jpg", "corner-photo-2.jpg", "corner-photo-3.jpg", "corner-photo-4.jpg", "dashboard-odometer.jpg"].map((n) => <Photo key={n} label={n} />)}
            </div>
          </React.Fragment>}
          {ev === "documents" && <div style={{ marginTop: "var(--sp-6)" }}><DataTable caption="Case documents" rows={[
            { name: "Original Request.pdf", kind: "Instruction", added: "30 Jul 11:18", size: "39 KB", source: "E-mail" },
            { name: "repairer-estimate-LM18XEV.pdf", kind: "Repairer estimate", added: "15 Aug 11:20", size: "210 KB", source: "Upload" },
            { name: "experian-autocheck-LM18XEV.pdf", kind: "Vehicle history", added: "16 Aug 17:05", size: "84 KB", source: "Lookup" }]
            } columns={[
            { header: "Document", cell: (r) => <a href="#">{r.name}</a> },
            { header: "Kind", cell: (r) => r.kind },
            { header: "Added", cell: (r) => r.added, tabular: true },
            { header: "Size", cell: (r) => r.size, tabular: true },
            { header: "Source", cell: (r) => <Provenance word={r.source} /> },
            { header: "", cell: (r) => <Button icon="upload">Download</Button> }]
            } /></div>}
          {ev === "emails" && <div style={{ marginTop: "var(--sp-6)" }}><QueueList>
            <QueueListRow href="InboxMessage.html" title="nduncombe@qdosassist.co.uk" subtitle="Forwarded by Desk"
              middle={<React.Fragment><strong>Fw: (EREF14) RTA on 23/07/2026 : Mr Adam Nazm (Our Ref: 1745ADAM)</strong><small>4 attachments</small></React.Fragment>}
              end={<React.Fragment><StatusChip state="Filed" tone="neutral" icon="file-text" /><small>30 Jul 11:18</small></React.Fragment>} />
            <QueueListRow href="InboxMessage.html" title="bodyshop@wallgatearcc.co.uk" subtitle="Direct"
              middle={<React.Fragment><strong>RE: LM18XEV images and estimate</strong><small>9 attachments</small></React.Fragment>}
              end={<React.Fragment><StatusChip state="Filed" tone="neutral" icon="file-text" /><small>15 Aug 11:20</small></React.Fragment>} />
          </QueueList></div>}
        </React.Fragment>}
        {tab === "notes" && <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1.4fr) minmax(280px,1fr)", gap: "var(--sp-8)", alignItems: "start" }}>
          <div>
            <Blockhead title="Activity" />
            <div>
              {NOTES.map((n, i) => <div className="note-row" key={i}>
                <time>{n.when}</time>
                <div style={{ fontSize: "var(--t-body)" }}><b>{n.who}</b>{n.auto && <span style={{ marginLeft: "6px", fontSize: "var(--t-xs)", color: "var(--muted)", textTransform: "uppercase", letterSpacing: ".06em" }}>automatic</span>}<div>{n.text}</div></div>
              </div>)}
            </div>
            <form onSubmit={(e) => e.preventDefault()} style={{ display: "grid", gap: "8px", marginTop: "var(--sp-6)", maxWidth: "560px" }}>
              <label htmlFor="new-note" style={{ fontSize: "var(--t-sm)", fontWeight: 600 }}>Add a note</label>
              <Textarea id="new-note" rows={3} />
              <div><Button variant="dark" type="submit">Add note</Button></div>
            </form>
          </div>
          <div>
            <Blockhead title="Engineer queries" end={<Button>Raise a query</Button>} />
            <div style={{ display: "grid", gap: "10px" }}>
              {QUERIES.map((q, i) => <div key={i} style={{ border: "var(--border)", borderRadius: "var(--radius)", padding: "10px 12px", display: "grid", gap: "6px", background: "#fff" }}>
                <div style={{ display: "flex", justifyContent: "space-between", gap: "8px", alignItems: "center" }}>
                  <b style={{ fontSize: "var(--t-sm)" }}>Raised {q.raised} · {q.by}</b>
                  <StatusChip state={q.state} tone={q.state === "Open" ? "amber" : "green"} icon={q.state === "Open" ? "clock" : "check-circle"} />
                </div>
                <span style={{ fontSize: "var(--t-sm)" }}>{q.text}</span>
                {q.resolved && <small style={{ color: "var(--muted)" }}>Resolved {q.resolved}</small>}
              </div>)}
            </div>
          </div>
        </div>}
      </RecordBody>
    </Record>
    <LinkDialog open={linkOpen} onClose={() => setLinkOpen(false)} />
  </Shell>;
}
mount(<Page />);
</script>
</body></html>
