<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">
const {AuthShell, AuthCard, AuthCardActions, Input, PrimaryAction, Field} = DS;
function Page(){
  return <AuthShell>
    <AuthCard title="Change password" foot={<span>Signed in as <b>alex</b> · <a href="Dashboard.html">Back to Dashboard</a></span>}>
      <form onSubmit={e=>e.preventDefault()} style={{display:"grid",gap:"var(--sp-6)"}}>
        <Field label="Current password" htmlFor="current"><Input id="current" type="password" autoComplete="current-password"/></Field>
        <Field label="New password" htmlFor="next" hint="At least 8 characters. Any characters are allowed."><Input id="next" type="password" autoComplete="new-password"/></Field>
        <Field label="Confirm new password" htmlFor="confirm"><Input id="confirm" type="password" autoComplete="new-password"/></Field>
        <AuthCardActions><PrimaryAction type="submit">Change password</PrimaryAction></AuthCardActions>
      </form>
    </AuthCard>
  </AuthShell>;
}
mount(<Page/>);
</script>
</body></html>
