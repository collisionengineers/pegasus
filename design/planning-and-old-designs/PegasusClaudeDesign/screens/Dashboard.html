<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">
const {PageHeading, Refresh, SectionLabel, MetricStrip, Metric, QueueList, QueueListRow, StatusChip, Icon} = DS;
function Dashboard(){
  return <Shell nav="Dashboard">
    <PageHeading title="Dashboard" refresh={<Refresh updatedAt="16 Aug 17:02" onRefresh={()=>{}}/>}/>
    <SectionLabel>Active cases</SectionLabel>
    <MetricStrip columns={3}>
      <Metric label="Not ready" icon="alert-triangle" state="not-ready" value={7} href="Queues.html"/>
      <Metric label="Review" icon="info" state="review" value={12} href="Queues.html"/>
      <Metric label="Held" icon="clock" state="held" value={3} href="Queues.html"/>
    </MetricStrip>
    <SectionLabel>E-mail activity</SectionLabel>
    <MetricStrip columns={3}>
      <Metric label="Received today" icon="file-text" value={6} href="Inbox.html"/>
      <Metric label="Needs sorting" icon="alert-triangle" state="needs-sorting" value={2} href="Inbox.html"/>
      <Metric label="Blocked" icon="clock" state="blocked" value={0} href="Inbox.html"/>
    </MetricStrip>
    <SectionLabel>Today and this week</SectionLabel>
    <MetricStrip columns={5}>
      <Metric label="New cases today" icon="file-text" value={1} href="Cases.html"/>
      <Metric label="Sent to Engineer today" icon="arrow-right" value={0}/>
      <Metric label="Sent to Engineer this week" icon="arrow-right" value={4}/>
      <Metric label="Reports sent today" icon="upload" value={2}/>
      <Metric label="Reports sent this week" icon="upload" value={9}/>
    </MetricStrip>
    <SectionLabel>Case work due</SectionLabel>
    <QueueList>
      <QueueListRow href="Assessment.html" title="QDOS26014" subtitle="Assessment in progress · LM18XEV, Mercedes-Benz C 220 AMG Line"
        end={<React.Fragment><StatusChip state="Review"/><small>Report due today</small></React.Fragment>}/>
      <QueueListRow href="Case.html" title="QDOS26001" subtitle="Awaiting repairer images · Mr Muneeb Sarwar"
        end={<React.Fragment><StatusChip state="Awaiting information"/><small>Next chase 18 Aug</small></React.Fragment>}/>
      <QueueListRow href="Queues.html" title="QDOS26009" subtitle="Held at the principal's request · Ms Sadie Miller"
        end={<React.Fragment><StatusChip state="Held"/><small>Review hold 22 Aug</small></React.Fragment>}/>
    </QueueList>
    <p style={{marginTop:"var(--sp-6)"}}><a href="Operations.html" style={{fontWeight:600}}>Open Operations <Icon name="chevron-right" size="sm"/></a></p>
  </Shell>;
}
mount(<Dashboard/>);
</script>
