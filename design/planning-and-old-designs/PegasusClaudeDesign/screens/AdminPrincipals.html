<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Principals · Pegasus</title>
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.css">
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/styles.css">
<style>a{color:var(--navy-fg)}a:hover{color:var(--ce-red-dark)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">
const {BackLink, Eyebrow, PageHeading, SectionLabel, Notice, DataTable, StatusChip, Button, RowConfirm, PrimaryAction, Blockhead, Pager} = DS;
function Page(){
  return <Shell nav="Administration">
    <BackLink href="Administration.html">Back to Administration</BackLink>
    <Eyebrow>Administration</Eyebrow>
    <PageHeading title="Principals" actions={<PrimaryAction icon="shield">Create principal</PrimaryAction>}/>
    <div style={{marginTop:"var(--sp-6)",maxWidth:"1080px"}}>
      <Notice>A principal identity is immutable once created. To change one, create a replacement: the predecessor–successor chain is preserved and open cases stay with the identity they were instructed under.</Notice>
      <SectionLabel>QDOS — Work Provider</SectionLabel>
      <DataTable caption="Principals owned by QDOS" rows={[
        {code:"QDOS", status:"Active", mode:"Image Based Assessment", pred:"—", succ:"—", cases:14},
        {code:"QDOS-LEGAL", status:"Replaced", mode:"Physical", pred:"—", succ:"QDOS", cases:0},
      ]} columns={[
        {header:"Code", cell:r=><b>{r.code}</b>},
        {header:"Status", cell:r=><StatusChip state={r.status} tone={r.status==="Active"?"green":"neutral"} icon={r.status==="Active"?"check-circle":"refresh-cw"}/>},
        {header:"Inspection mode", cell:r=>r.mode},
        {header:"Predecessor", cell:r=>r.pred},
        {header:"Successor", cell:r=>r.succ},
        {header:"Allocated cases", cell:r=>r.cases, tabular:true},
        {header:"Action", cell:r=>r.status==="Active"?<RowConfirm summary="Replace" reasonId={"repl-"+r.code} confirm="Create replacement"/>:null},
      ]}/>
      <Pager context="Page 1 · showing 2" label="Principal pages"/>
    </div>
  </Shell>;
}
mount(<Page/>);
</script>
</body></html>
