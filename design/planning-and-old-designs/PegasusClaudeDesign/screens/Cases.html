function Page(){
  return <Shell nav="Cases">
    <PageHeading title="Cases"/>
    <FilterBar title="Filter cases" more={
      <FormGrid>
        <Field label="Registration" htmlFor="f-reg"><Input id="f-reg"/></Field>
        <Field label="Claim number" htmlFor="f-claim"><Input id="f-claim"/></Field>
        <Field label="Engineer" htmlFor="f-eng"><Select id="f-eng"><option>Any engineer</option><option>Patrick</option><option>Unassigned</option></Select></Field>
        <Field label="Origin" htmlFor="f-origin"><Select id="f-origin"><option>Any origin</option><option>Mailbox</option><option>Upload</option><option>Image</option></Select></Field>
        <Field label="Received from" htmlFor="f-from"><Input id="f-from" type="date"/></Field>
        <Field label="Received to" htmlFor="f-to"><Input id="f-to" type="date"/></Field>
      </FormGrid>}>
      <Input placeholder="Case/PO, registration, claimant or claim number" style={{flex:"2 1 320px"}} aria-label="Search cases"/>
      <Select aria-label="Stage" style={{flex:"0 1 160px"}}><option>Any stage</option><option>Not ready</option><option>Review</option><option>Held</option><option>Completed</option></Select>
      <Input placeholder="Principal" style={{flex:"1 1 160px"}} aria-label="Principal"/>
      <Button variant="dark" type="submit" icon="search">Search</Button>
      <Button type="reset">Clear</Button>
    </FilterBar>
    <SectionLabel style={{marginTop:"var(--sp-8)"}}>Results</SectionLabel>
    <DataTable caption="Case search results" captionVisible={false} rows={ROWS} columns={[
      {header:"Case/PO", cell:r=><a href={r.href||"Case.html"}>{r.ref}</a>},
      {header:"Registration", cell:r=>r.reg || <span style={{color:"var(--muted)"}}>Not recorded</span>},
      {header:"Claimant", cell:r=>r.claimant},
      {header:"Claim number", cell:r=>r.claim || <span style={{color:"var(--muted)"}}>Not recorded</span>},
      {header:"Principal", cell:r=>r.principal},
      {header:"State", cell:r=><StatusChip state={r.state}/>},
      {header:"Engineer", cell:r=>r.engineer},
      {header:"Received", cell:r=>r.received, tabular:true},
      {header:"Instruction", cell:r=>r.instruction, tabular:true},
      {header:"Origin", cell:r=>r.origin},
    ]}/>
    <Pager context="Page 1 · showing 6 of 124" nextHref="#" label="Result pages"/>

mount(<Page/>);
