function ClaudeDialog({open, onCancel, onConfirm}){
  const [pct, setPct] = React.useState(70);

  return <div className="reason-dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="cd-title" style={{display:"grid"}}>

function DamageBox(){

  </div>;

function ReportImages(){
  const [imgs, setImgs] = React.useState(PHOTOS.map((n,i)=>({n, role: n==="corner-photo-1.jpg"?"Overview":(n==="damage-photo-1.jpg"?"Close-up":(n==="licence-plate-photo-1.jpg"||n==="dashboard-odometer.jpg"?"Excluded":"Included"))})));
  const setRole=(n,role)=>setImgs(list=>list.map(im=>{
    if(im.n===n) return {...im, role};
    if((role==="Overview"||role==="Close-up") && im.role===role) return {...im, role:"Included"};
    return im;
  }));
  const move=(i,d)=>setImgs(list=>{const c=[...list]; const j=i+d; if(j<0||j>=c.length) return list; [c[i],c[j]]=[c[j],c[i]]; return c;});
  const included = imgs.filter(im=>im.role!=="Excluded").length;
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:"12px"}}>
      <SectionLabel>Report images</SectionLabel>
      <small style={{color:"var(--muted)"}}>{included} of {imgs.length} in the report, in this order</small>
    </div>
    <div style={{display:"grid",gap:"6px"}}>
      {imgs.map((im,i)=><div className={"imgrow"+(im.role==="Excluded"?" excluded":"")} key={im.n}>
        <span className="thumb" aria-hidden="true"></span>
        <span style={{flex:"1 1 auto",minWidth:0,fontSize:"var(--t-sm)",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{im.n}</span>
        {(im.role==="Overview"||im.role==="Close-up") && <StatusChip state={im.role} tone="navy" icon="info"/>}
        <label style={{fontSize:"var(--t-sm)"}}><span className="sr-only">Role for {im.n}</span>
          <Select value={im.role} onChange={e=>setRole(im.n, e.target.value)} style={{minHeight:"28px",height:"28px",padding:"0 6px"}}>
            <option>Overview</option><option>Close-up</option><option>Included</option><option>Excluded</option>
          </Select></label>
        <Button aria-label={"Move "+im.n+" up"} onClick={()=>move(i,-1)} style={{padding:"0 8px"}}>↑</Button>
        <Button aria-label={"Move "+im.n+" down"} onClick={()=>move(i,1)} style={{padding:"0 8px"}}>↓</Button>
      </div>)}
    </div>
  </div>;
}

            {!renaming ? <span style={{fontSize:"var(--t-sm)"}}><b>{est.name}</b> · {est.source}<Button style={{marginLeft:"10px"}} onClick={()=>setRenaming(true)}>Rename</Button></span>
              : <span style={{display:"inline-flex",gap:"8px",alignItems:"center"}}>
                  <Input defaultValue={est.name} id="est-name" aria-label="Estimate name" style={{width:"220px"}}/>
                  <Button variant="dark" onClick={()=>{const v=document.getElementById("est-name").value.trim(); if(v) setEsts(list=>list.map(e=>e.id===est.id?{...e,name:v}:e)); setRenaming(false);}}>Save</Button>
                  <Button onClick={()=>setRenaming(false)}>Cancel</Button>
                </span>}
          </div>
          <EstimateBody est={est} confirmed={confirmed} onConfirm={()=>setConfirmedIds(ids=>[...ids, est.id])} onReport={()=>setReportFor(est)}/>
          </div>
        </div>
        <Panel style={{marginTop:"var(--sp-6)"}}>
          <Blockhead title="Findings"/>
          <StatusCard variant="attention" title="The numbers point to a total loss">
            Repair cost {gbp(REPAIR)} is <b>75.4%</b> of the pre-accident value ({gbp(PAV,0)}) — above the 70% threshold — and <b>94%</b> of the settlement net of salvage.
          </StatusCard>
          <FormGrid sectionGap>
            <Field label="Assessment outcome" htmlFor="f-outcome"><Select id="f-outcome" defaultValue="Total loss"><option>Total loss</option><option>Repairable</option><option>Cash in lieu</option><option>Contract repair</option></Select></Field>
            <Field label="Roadworthiness" htmlFor="f-road"><Select id="f-road" defaultValue="Unroadworthy"><option>Roadworthy</option><option>Unroadworthy</option></Select></Field>
            <Field label="Salvage category" htmlFor="f-cat"><Select id="f-cat" defaultValue="Category N — non-structural"><option>Category A</option><option>Category B</option><option>Category S — structural</option><option>Category N — non-structural</option><option>Not applicable</option></Select></Field>
            <Field label="Salvage value (£)" htmlFor="f-salvage"><Input id="f-salvage" className="tabular" defaultValue="2,230.00"/></Field>
            <Field label="Salvage agent" htmlFor="f-agent"><Select id="f-agent"><option>Not instructed yet</option><option>Copart — Sandwich</option><option>SYNETIQ — Doncaster</option></Select></Field>
            <Field label="Owner wishes to retain" htmlFor="f-retain"><Select id="f-retain"><option>Not stated</option><option>Yes — retain agreed</option><option>Yes — awaiting agreement</option><option>No</option></Select></Field>
            <Field wide label="Engineer's comments" htmlFor="r-comments"><Textarea id="r-comments" rows={3} defaultValue="20% has been deducted from the pre-accident valuation due to the vehicle being a previous total loss.&#10;The vehicle is unroadworthy due to the impacted wheel, suspension and tyre damage."/></Field>
            <Field label="Signature" htmlFor="r-sig"><Select id="r-sig"><option value="">Choose a signatory</option><option>P. Doyle</option><option>E. Mawdsley</option></Select></Field>
            <Field label="Agreed fee (£)" htmlFor="r-fee"><Input id="r-fee" className="tabular" placeholder="0.00"/></Field>
          </FormGrid>
          <ButtonRow style={{marginTop:"var(--sp-6)"}}><PrimaryAction>Save assessment</PrimaryAction><SecondaryAction href="Case.html">Back</SecondaryAction></ButtonRow>
        </Panel>
      </React.Fragment>}
      {tab==="evidence" && <Panel>
        <Blockhead title="Evidence on this case" end={<Button href="Case.html">Open case</Button>}/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:"12px"}}>
          {PHOTOS.map(n=><Photo key={n} label={n} h={96}/>)}
        </div>
        <SectionLabel>Documents</SectionLabel>
        <DataTable className="compact" caption="Case documents" rows={[
          {name:"Original Request.pdf", kind:"Instruction", added:"30 Jul 11:18"},
          {name:"repairer-estimate-LM18XEV.pdf", kind:"Repairer estimate", added:"15 Aug 11:20"},
          {name:"experian-autocheck-LM18XEV.pdf", kind:"Vehicle history", added:"16 Aug 17:05"},
        ]} columns={[
          {header:"Document", cell:r=><a href="#">{r.name}</a>},
          {header:"Kind", cell:r=>r.kind},
          {header:"Added", cell:r=>r.added, tabular:true},
        ]}/>
      </Panel>}
      </RecordBody>
    </Record>
    <ClaudeDialog open={claudeOpen} onCancel={()=>setClaudeOpen(false)} onConfirm={sendToClaude}/>
    {reportFor && <ReportDialog est={reportFor} onClose={()=>setReportFor(null)}/>}
  </Shell>;
}
mount(<Page/>);
</script>
</body></html>
