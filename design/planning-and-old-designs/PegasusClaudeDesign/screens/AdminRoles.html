<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff roles · Pegasus</title>
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.css">
<link rel="stylesheet" href="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/styles.css">
<style>a{color:var(--navy-fg)}a:hover{color:var(--ce-red-dark)}
details.rolerow>summary{list-style:none;cursor:pointer}
details.rolerow>summary::-webkit-details-marker{display:none}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds/pegasus-design-system-d795cfe7-300d-4c42-a837-9a1714dd1a36/_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel">
const {BackLink, Eyebrow, PageHeading, SectionLabel, Notice, DataTable, StatusChip, Button, Choice, ChoiceGroup, Input, Gated} = DS;
const STAFF = [
  {u:"alex", roles:["Administrator"], lastAdmin:true},
  {u:"patrick", roles:["Engineer"]},
  {u:"j.patel", roles:["User"]},
];
function RoleEditor({row}){
  const [open, setOpen] = React.useState(false);
  if(!open) return <Button onClick={()=>setOpen(true)}>Change roles</Button>;
  return <div style={{display:"grid",gap:"10px",padding:"10px 0",maxWidth:"520px"}}>
    <ChoiceGroup legend={"Roles for "+row.u}>
      {["Administrator","Engineer","User"].map(role=>{
        const locked = row.lastAdmin && role==="Administrator";
        const box = <label className="choice" key={role}><input type="checkbox" defaultChecked={row.roles.includes(role)} disabled={locked}/> <span>{role}</span></label>;
        return locked ? <Gated key={role} condition="The final enabled Administrator cannot be removed">{box}</Gated> : box;
      })}
    </ChoiceGroup>
    <label style={{display:"grid",gap:"4px",fontSize:"var(--t-sm)",fontWeight:600}}>Reason<Input/></label>
    <div style={{display:"flex",gap:"10px"}}>
      <Button variant="dark">Save roles</Button>
      <Button onClick={()=>setOpen(false)}>Cancel</Button>
    </div>
  </div>;
}
function Page(){
  return <Shell nav="Administration">
    <BackLink href="Administration.html">Back to Administration</BackLink>
    <Eyebrow>Administration</Eyebrow>
    <PageHeading title="Staff roles"/>
    <div style={{marginTop:"var(--sp-6)",maxWidth:"980px"}}>
      <Notice>Every enabled staff member needs at least one role. Removing the final enabled Administrator is denied. Role changes invalidate existing browser sessions.</Notice>
      <SectionLabel>Current role assignments</SectionLabel>
      <DataTable caption="Staff role assignments" rows={STAFF} columns={[
        {header:"Username", cell:r=><b>{r.u}</b>},
        {header:"Status", cell:r=><StatusChip state="Enabled" tone="green" icon="check-circle"/>},
        {header:"Current roles", cell:r=>r.roles.join(", ")},
        {header:"Assign roles", cell:r=><RoleEditor row={r}/>},
      ]}/>
    </div>
  </Shell>;
}
mount(<Page/>);
</script>
</body></html>
