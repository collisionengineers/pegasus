<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Pegasus — shell v26 (mockup)</title>
<style>
/* ---- Tokens (docs/design/README.md authority) ---- */
:root {
  --bg: #f1f3f4;
  --surface: #ffffff;
  --surface-2: #f8f9f9;
  --surface-3: #e9edef;
  --ink: #202629;
  --muted: #626b70;
  --quiet: #7d878c;
  --line: #d2d8db;
  --line-strong: #9da9ae;
  --nav: #24282b;
  --nav-2: #30363a;
  --nav-text: #f5f5f3;
  --nav-muted: #bcc3c6;
  --red: #c9222b;
  --red-dark: #9e1720;
  --red-bg: #fbeced;
  --amber: #975b07;
  --amber-bg: #fff4dc;
  --navy: #274f70;
  --navy-bg: #eaf1f6;
  --green: #2b643d;
  --green-bg: #e9f4ec;
  --blue: #285f88;
  --blue-bg: #eaf3f8;
  --danger: #98272c;
  --danger-bg: #fff0f1;
  --focus: #d3232a;
  --shadow: 0 8px 24px rgba(25, 39, 45, .09);
  --font: "Inter Variable", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  --radius: 3px;
  --radius-lg: 4px;
  --rail: 220px;
  --content-max: 1580px;
  --gap: 12px;
  --page-pad: 18px;
  --row: 40px;
  --control: 36px;
  --utility-h: 48px;
  --tabs-h: 40px;
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 13.5px; line-height: 1.45;
  font-feature-settings: "cv11", "ss01", "tnum";
}
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; line-height: 1.25; }
h1 { font-size: 20px; }
h2 { font-size: 15px; }
h3 { font-size: 13px; }
p { margin: 0; }
a { color: var(--navy); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; display: block; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; vertical-align: middle; }
ul, ol { margin: 0; padding: 0; list-style: none; }
dl { margin: 0; }
dd { margin: 0; }
strong { font-weight: 650; }
small { font-size: 12px; }
code, .mono { font-family: var(--mono); font-size: .95em; }
::selection { background: var(--navy-bg); }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 8px; top: -40px; background: var(--surface); color: var(--ink); padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); z-index: 100; }
.skip-link:focus { top: 8px; }

.eyebrow { font-size: 10.5px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--quiet); }
.muted { color: var(--muted); }
.quiet { color: var(--quiet); }
.num { font-variant-numeric: tabular-nums; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.mt-0 { margin-top: 0 !important; }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 12px; }
.mb-2 { margin-bottom: 12px; }
.ml-auto { margin-left: auto; }
.cluster { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cluster--between { justify-content: space-between; }
.stack { display: grid; gap: var(--gap); }
.hidden { display: none !important; }

::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: #b7c0c4; border: 3px solid var(--bg); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }


/* ---- Shell: rail, utility bar, workspace tabs, page header ---- */
.app-shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

.app-rail {
  position: sticky; top: 0; height: 100vh; overflow: auto;
  background: linear-gradient(180deg, var(--nav), var(--nav-2)); color: var(--nav-text);
  border-top: 3px solid var(--red); display: flex; flex-direction: column;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; color: inherit; }
.brand:hover { text-decoration: none; }
.brand img { width: 40px; height: 40px; }
.brand-copy { display: grid; line-height: 1.15; }
.brand-copy strong { font-size: 15px; letter-spacing: .12em; font-weight: 700; }
.brand-copy span { font-size: 11px; color: var(--nav-muted); letter-spacing: .02em; }
.primary-nav { padding: 6px 10px; display: grid; gap: 2px; }
.nav-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--nav-muted); padding: 12px 8px 4px; font-weight: 650; }
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 0 8px; height: 38px;
  color: var(--nav-text); border-radius: var(--radius); border-left: 3px solid transparent; font-weight: 500;
}
.nav-link:hover { background: rgba(255,255,255,.06); text-decoration: none; }
.nav-link .icon { width: 17px; height: 17px; opacity: .85; }
.nav-link[aria-current="page"] { background: var(--surface); color: var(--ink); border-left-color: var(--red); }
.nav-link[aria-current="page"] .icon { color: var(--red); opacity: 1; }
.nav-count { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: rgba(255,255,255,.14); font-size: 11px; font-weight: 650; display: grid; place-items: center; }
.nav-link[aria-current="page"] .nav-count { background: var(--surface-3); color: var(--ink); }
.rail-spacer { flex: 1; }
.rail-health { padding: 10px 18px; font-size: 11.5px; color: var(--nav-muted); display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255,255,255,.08); }
.health-dot { width: 8px; height: 8px; border-radius: 50%; background: #7fbf8f; }
.health-dot.partial { background: #e0b25c; }
.health-dot.failed { background: #e07a7a; }
.rail-user { display: flex; align-items: center; gap: 10px; padding: 12px 14px 16px; }
.rail-user strong { display: block; font-size: 12.5px; }
.rail-user small { color: var(--nav-muted); font-size: 11px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-3); color: var(--ink); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; flex: none; }
.rail-user .icon-button { margin-left: auto; color: var(--nav-muted); }
.rail-user .icon-button:hover { color: var(--nav-text); background: rgba(255,255,255,.08); }

.app-column { display: flex; flex-direction: column; min-width: 0; }
.utility-bar {
  position: sticky; top: 0; z-index: 30; height: var(--utility-h); background: var(--nav); color: var(--nav-text);
  display: flex; align-items: center; gap: 12px; padding: 0 var(--page-pad); border-top: 3px solid var(--red);
}
.utility-freshness { font-size: 12px; color: var(--nav-muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.utility-search { flex: 1; max-width: 640px; position: relative; display: flex; align-items: center; }
.utility-search .icon { position: absolute; left: 10px; width: 16px; height: 16px; color: var(--nav-muted); pointer-events: none; }
.utility-search input {
  width: 100%; height: 34px; padding: 0 64px 0 34px; background: var(--nav-2); border: 1px solid #454c50; color: var(--nav-text); border-radius: var(--radius);
}
.utility-search input::placeholder { color: var(--nav-muted); }
.utility-search input:focus-visible { outline-color: var(--navy-bg); }
.utility-search kbd { position: absolute; right: 8px; font: 10.5px var(--font); color: var(--nav-muted); border: 1px solid #555c60; border-radius: 3px; padding: 1px 5px; }
.utility-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.workspace-tabs { display: flex; align-items: flex-end; gap: 4px; padding: 8px var(--page-pad) 0; background: var(--surface-3); border-bottom: 1px solid var(--line); height: var(--tabs-h); position: sticky; top: var(--utility-h); z-index: 25; }
.workspace-tab { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-bottom: 0; background: var(--surface-2); color: var(--muted); border-radius: var(--radius) var(--radius) 0 0; font-size: 12.5px; max-width: 260px; }
.workspace-tab:hover { text-decoration: none; color: var(--ink); }
.workspace-tab[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; border-top: 2px solid var(--red); }
.workspace-tab .icon { width: 14px; height: 14px; flex: none; }
.workspace-tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workspace-tab .tab-close { display: grid; place-items: center; width: 18px; height: 18px; border: 0; background: transparent; border-radius: 2px; color: var(--quiet); padding: 0; }
.workspace-tab .tab-close:hover { background: var(--surface-3); color: var(--ink); }
.workspace-tab--open { color: var(--muted); }

.app-main { flex: 1; }
.content { max-width: var(--content-max); margin: 0 auto; padding: var(--page-pad); display: grid; gap: var(--gap); align-content: start; }
.content > * { min-width: 0; }

.page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 4px 0 2px; }
.page-title { display: grid; gap: 2px; border-left: 3px solid var(--red); padding-left: 12px; }
.page-title h1 { font-size: 21px; }
.page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* External / auth frames */
.external-shell { min-height: 100vh; background: var(--nav); display: grid; place-items: center; padding: 24px; border-top: 3px solid var(--red); }
.auth-card { width: min(420px, 100%); background: var(--surface); border-radius: var(--radius-lg); padding: 28px; display: grid; gap: 16px; }
.auth-brand { display: grid; gap: 10px; justify-items: start; }
.auth-brand img { width: 220px; }
.auth-brand strong { letter-spacing: .14em; font-size: 13px; color: var(--muted); }

@media (max-width: 1360px) { .case-context { display: none; } }
@media (max-width: 980px) {
  .app-shell { grid-template-columns: 1fr; }
  .app-rail { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; }
  .primary-nav { display: flex; padding: 0 6px; }
  .nav-label, .rail-health, .rail-spacer, .brand-copy { display: none; }
  .nav-link { border-left: 0; border-bottom: 3px solid transparent; }
  .nav-link[aria-current="page"] { border-bottom-color: var(--red); }
  .nav-link span:not(.nav-count) { display: none; }
}


/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--control); padding: 0 12px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: var(--radius);
  font-weight: 550; font-size: 13px; white-space: nowrap; transition: background .14s, border-color .14s;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn .icon { width: 15px; height: 15px; }
.btn--primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn--primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
.btn--dark { background: var(--nav-2); border-color: var(--nav-2); color: var(--nav-text); }
.btn--dark:hover { background: var(--nav); }
.btn--danger { background: var(--surface); border-color: var(--danger); color: var(--danger); }
.btn--danger:hover { background: var(--danger-bg); }
.btn--ghost { border-color: transparent; background: transparent; }
.btn--ghost:hover { background: var(--surface-3); }
.btn--small { height: 28px; padding: 0 9px; font-size: 12px; }
.btn--small .icon { width: 13px; height: 13px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.btn[aria-disabled="true"]:hover { background: var(--surface); }
.btn--primary[aria-disabled="true"]:hover { background: var(--red); }
.gated { display: inline-flex; align-items: center; gap: 8px; }
.gated .condition { font-size: 11.5px; color: var(--quiet); }
.icon-button { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; background: transparent; border-radius: var(--radius); color: var(--muted); padding: 0; }
.icon-button:hover { background: var(--surface-3); color: var(--ink); }
.icon-button .icon { width: 16px; height: 16px; }
.icon { width: 16px; height: 16px; flex: none; }
.link-button { border: 0; background: none; padding: 0; color: var(--navy); font-weight: 550; cursor: pointer; }
.link-button:hover { text-decoration: underline; }

/* ---- Status chips ---- */
.status { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--radius); font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status--amber { color: var(--amber); background: var(--amber-bg); }
.status--navy { color: var(--navy); background: var(--navy-bg); }
.status--blue { color: var(--blue); background: var(--blue-bg); }
.status--green { color: var(--green); background: var(--green-bg); }
.status--red { color: var(--danger); background: var(--danger-bg); }
.status--neutral { color: var(--muted); background: var(--surface-3); }
.status--plain::before { display: none; }

/* ---- Panels ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.panel-head h2, .panel-head h3 { flex: 1; min-width: 0; }
.panel-head .meta { font-size: 12px; color: var(--quiet); }
.panel-head .actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.panel-body { padding: 14px; }
.panel-body--tight { padding: 0; }
.panel-body--compact { padding: 8px 14px; }
.panel + .panel { margin-top: 0; }
.panel-section { padding: 10px 14px 12px; border-top: 1px solid var(--line); }
.panel-section:first-child { border-top: 0; }
.panel-section h3 { margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.panel-section h3 .meta { font-weight: 400; color: var(--quiet); font-size: 12px; }

/* ---- Fact grids / definitions ---- */
.fact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.fact { background: var(--surface-2); padding: 8px 10px; min-height: 52px; display: grid; align-content: start; gap: 2px; }
.fact dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--quiet); font-weight: 600; }
.fact dd { font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fact--wide { grid-column: 1 / -1; }
.fact--empty dd { color: var(--quiet); font-weight: 400; }
.definition-list { display: grid; gap: 6px; }
.definition { display: grid; grid-template-columns: 130px 1fr; gap: 10px; font-size: 13px; }
.definition dt { color: var(--muted); }
.definition dd { font-weight: 500; }
.provenance { display: inline-grid; place-items: center; width: 16px; height: 16px; color: var(--quiet); }
.provenance .icon { width: 13px; height: 13px; }

/* ---- Forms ---- */
.form-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 14px; }
.form-grid--auto { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.suggest-btn { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; margin-left: 6px; border: 1px solid var(--navy); background: var(--navy-bg); color: var(--navy); border-radius: 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
.suggest-btn .icon { width: 12px; height: 12px; }
.suggest-btn:hover { background: var(--navy); color: #fff; }
.form-grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field { display: grid; gap: 4px; min-width: 0; }
.field--wide { grid-column: 1 / -1; }
.field--span2 { grid-column: span 2; }
.field label, .field .label { font-size: 11.5px; font-weight: 600; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.field label.required::after { content: "*"; color: var(--red); }
.field input, .field select, .field textarea, .control {
  height: var(--control); padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); width: 100%; min-width: 0;
}
.field textarea { height: auto; min-height: 84px; padding: 8px 10px; resize: vertical; line-height: 1.4; }
.field input[readonly], .field input[disabled], .field select[disabled], .field textarea[readonly] { background: var(--surface-2); color: var(--muted); }
.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible, .control:focus-visible { outline-offset: 0; outline-width: 2px; }
.field .value { min-height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 2px; font-weight: 500; line-height: 1.3; }
.field label, .field .label { min-height: 16px; }
.field .value.empty { color: var(--quiet); font-weight: 400; }
.field-inline { display: flex; align-items: center; gap: 8px; }
.field-inline input { width: 120px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 13px; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--red); }
.checks { display: grid; gap: 2px; }
.radio-row { display: flex; gap: 14px; flex-wrap: wrap; }
.input-money { position: relative; }
.input-money::before { content: "£"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--quiet); }
.input-money input { padding-left: 22px; text-align: right; font-variant-numeric: tabular-nums; }
.input-suffix { position: relative; }
.input-suffix input { padding-right: 34px; }
.input-suffix::after { content: attr(data-suffix); position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--quiet); font-size: 12px; }
.error-summary { border: 1px solid var(--danger); background: var(--danger-bg); padding: 10px 12px; border-radius: var(--radius); color: var(--danger); font-weight: 550; }
.field .error { color: var(--danger); font-size: 12px; }

/* ---- Tables ---- */
.table-wrap { overflow-x: auto; }
.table { font-size: 13px; }
.table th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--quiet); font-weight: 600; padding: 0 12px; height: 34px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 6px 12px; height: var(--row); border-bottom: 1px solid var(--line); }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: var(--surface-2); }
.table tr.selected td { background: var(--navy-bg); box-shadow: inset 3px 0 0 var(--red); }
.table th.sort a { color: inherit; display: inline-flex; align-items: center; gap: 4px; }
.table td .btn { vertical-align: middle; }
.table .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table--compact td { height: 34px; padding: 4px 10px; }
.table caption { text-align: left; padding: 8px 12px; font-weight: 600; }
.table input, .table select { height: 30px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); width: 100%; min-width: 60px; background: var(--surface); }
.table input.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---- Notices / empty / toasts ---- */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--radius); background: var(--surface-2); font-size: 13px; }
.notice strong { font-weight: 650; }
.notice .icon { margin-top: 1px; }
.notice--warning { border-color: var(--amber); background: var(--amber-bg); color: #5f3a02; }
.notice--danger { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
.notice--success { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.notice--info { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }
.empty { padding: 18px 14px; color: var(--muted); display: grid; gap: 10px; justify-items: start; }
.empty strong { color: var(--ink); }
.toast-region { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 90; }
.toast { background: var(--nav); color: var(--nav-text); padding: 10px 14px; border-radius: var(--radius-lg); box-shadow: var(--shadow); font-size: 13px; display: flex; align-items: center; gap: 10px; max-width: 420px; animation: toast-in .14s ease-out; }
.toast--success { border-left: 3px solid #7fbf8f; }
.toast--danger { border-left: 3px solid #e07a7a; }
@keyframes toast-in { from { opacity: 0; transform: translateY(4px); } }

/* ---- Dialogs ---- */
.dialog-backdrop { position: fixed; inset: 0; background: rgba(32, 38, 41, .5); display: grid; place-items: center; z-index: 80; padding: 20px; animation: toast-in .14s ease-out; }
.dialog { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.dialog--wide { width: min(880px, 100%); }
.dialog--xl { width: min(1180px, 100%); }
.dialog-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { flex: 1; font-size: 16px; }
.dialog-body { padding: 16px 18px; display: grid; gap: 14px; overflow: auto; }
.dialog-body > * { min-width: 0; }
.report-preview canvas { width: 100%; height: auto; display: block; }
.dialog-foot { display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--surface-2); }
.dialog-foot .left { margin-right: auto; }
.consequence { font-size: 13px; color: var(--danger); font-weight: 550; }
.command-dialog { align-self: start; margin-top: 8vh; }
.command-input { border: 0; border-bottom: 1px solid var(--line); height: 48px; padding: 0 18px; width: 100%; font-size: 15px; }
.command-list { max-height: 400px; overflow: auto; padding: 6px; }
.command-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border: 0; background: transparent; border-radius: var(--radius); text-align: left; }
.command-item .icon { color: var(--quiet); }
.command-item small { margin-left: auto; color: var(--quiet); }
.command-item[aria-selected="true"], .command-item:hover { background: var(--navy-bg); }

/* ---- Metrics ---- */
.metric-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); }
.metric-strip--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.metric { display: grid; gap: 4px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); text-align: left; color: inherit; border-top: 3px solid var(--line-strong); }
.metric:hover { text-decoration: none; background: var(--surface-2); }
.metric .label { font-size: 12px; color: var(--muted); font-weight: 550; display: flex; align-items: center; gap: 6px; }
.metric .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.metric--amber { border-top-color: var(--amber); }
.metric--navy { border-top-color: var(--navy); }
.metric--red { border-top-color: var(--danger); }
.metric--blue { border-top-color: var(--blue); }
.metric--green { border-top-color: var(--green); }
.metric--neutral { border-top-color: var(--line-strong); }

/* ---- Panes / queue layouts ---- */
.pane-layout { display: grid; gap: var(--gap); align-items: start; }
.pane-layout--2 { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.pane-layout--3 { grid-template-columns: 220px minmax(0, 1.3fr) minmax(0, 1fr); }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); min-width: 0; display: flex; flex-direction: column; }
.pane-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 44px; border-bottom: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.pane-head h2 { flex: 1; font-size: 14px; }
.pane-head .meta { font-size: 12px; color: var(--quiet); }
.pane-body { padding: 12px; }
.pane-scroll { max-height: calc(100vh - 260px); overflow: auto; }
.queue-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr) 300px; gap: var(--gap); align-items: start; }
.scope-list { display: grid; gap: 2px; padding: 6px; }
.scope-group { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--quiet); font-weight: 650; padding: 10px 8px 4px; }
.scope-button { display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 8px; border: 0; background: transparent; border-radius: var(--radius); text-align: left; color: var(--ink); border-left: 3px solid transparent; }
.scope-button:hover { background: var(--surface-2); text-decoration: none; }
.scope-button[aria-current="true"] { background: var(--surface-3); border-left-color: var(--red); font-weight: 600; }
.scope-button .icon { color: var(--quiet); }
.scope-button .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row-list { display: grid; }
.row-button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; color: inherit; border-left: 3px solid transparent; }
.row-button:hover { background: var(--surface-2); text-decoration: none; }
.row-button[aria-selected="true"] { background: var(--navy-bg); border-left-color: var(--red); }
.row-button .title { font-weight: 600; font-size: 13px; grid-column: 1; grid-row: 1; }
.row-button .sub { color: var(--muted); font-size: 12px; grid-column: 1; grid-row: 2; }
.row-button .side { grid-column: 2; grid-row: 1 / span 2; align-self: center; display: grid; justify-items: end; gap: 4px; font-size: 12px; color: var(--muted); }
.pane-head select.control { max-width: 190px; margin-left: auto; height: 32px; }
.row-button .ref { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.filter-bar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.filter-bar .field { min-width: 150px; }
.filter-bar .field select, .filter-bar .field input { height: 32px; }
.pagination { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.pagination .btn { height: 28px; }

/* ---- Tabs ---- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 8px; background: var(--surface-2); }
.tab { height: 38px; padding: 0 12px; border: 0; background: transparent; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }
.tab:hover { color: var(--ink); text-decoration: none; }
.tab .count { font-size: 11px; color: var(--quiet); }

/* ---- Stepper ---- */
.workflow-stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.workflow-step { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); display: grid; gap: 2px; border-top: 3px solid var(--line); }
.workflow-step .name { font-weight: 600; font-size: 13px; }
.workflow-step .when { font-size: 11.5px; color: var(--quiet); }
.workflow-step--done { border-top-color: var(--green); }
.workflow-step--done .name::before { content: "✓ "; color: var(--green); }
.workflow-step--current { border-top-color: var(--red); background: var(--surface); }
.workflow-step--held { border-top-color: var(--amber); }
.stepper-wrap { display: flex; gap: 10px; align-items: stretch; }
.stepper-wrap .workflow-stepper { flex: 1; }
.held-badge { display: grid; align-content: center; padding: 8px 12px; border: 1px solid var(--amber); background: var(--amber-bg); color: var(--amber); border-radius: var(--radius); font-weight: 600; }

/* ---- Blockers ---- */
.blocker-list { display: grid; }
.blocker { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 13px; }
.blocker:first-child { border-top: 0; }
.blocker .name { font-weight: 600; }
.blocker .why { color: var(--muted); }

/* ---- Timeline / notes ---- */
.notes-list { display: grid; }
.note-entry { display: grid; grid-template-columns: 78px 50px 90px 1fr; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 13px; align-items: start; }
.note-entry:first-child { border-top: 0; }
.note-entry .when { color: var(--muted); font-variant-numeric: tabular-nums; }
.note-entry .who { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.note-entry .who--system { color: var(--blue); }
.note-entry .text strong { display: block; }

/* ---- Documents / gallery / dropzone ---- */
.document-row { display: grid; grid-template-columns: 24px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); }
.document-row:first-child { border-top: 0; }
.document-row .icon { color: var(--quiet); }
.document-row .name { font-weight: 550; }
.document-row .sub { font-size: 12px; color: var(--muted); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.gallery-item { position: relative; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface-3); padding: 0; aspect-ratio: 4 / 3; cursor: zoom-in; }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; }
.gallery-item .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; background: rgba(32,38,41,.72); color: #fff; font-size: 11px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gallery-item:hover { box-shadow: var(--shadow); }
.gallery-item.selected { outline: 2px solid var(--navy); }
.viewer-stage { background: #111; display: grid; place-items: center; min-height: 420px; max-height: 70vh; overflow: hidden; border-radius: var(--radius); }
.viewer-stage img { max-height: 70vh; max-width: 100%; object-fit: contain; transition: transform .14s; }
.viewer-stage img.rot-90 { transform: rotate(90deg); }
.viewer-stage img.rot-180 { transform: rotate(180deg); }
.viewer-stage img.rot-270 { transform: rotate(270deg); }
.dropzone { border: 2px dashed var(--line-strong); border-radius: var(--radius-lg); padding: 28px; display: grid; gap: 10px; justify-items: center; text-align: center; background: var(--surface); color: var(--muted); }
.dropzone.active { border-color: var(--red); background: var(--red-bg); }
.dropzone strong { color: var(--ink); font-size: 14px; }
.file-row { display: grid; grid-template-columns: 24px 1fr 90px 180px auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); }
.file-row:first-child { border-top: 0; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--navy); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.decision-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 8px; background: var(--surface-2); }
.decision-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.decision-row dt { color: var(--muted); }
.decision-row dd { font-weight: 550; text-align: right; }
.mail-preview { white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
.attachment-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 12px; background: var(--surface); }
.thread-item { padding: 8px 0; border-top: 1px solid var(--line); }

/* ---- Report preview (A4) ---- */
.report-preview { background: #fff; color: #1f1d1b; font-family: Arial, Helvetica, sans-serif; padding: 36px 40px; border: 1px solid var(--line); font-size: 12px; line-height: 1.45; }
.report-preview .rp-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #c80a32; padding-bottom: 10px; margin-bottom: 14px; }
.report-preview .rp-head img { width: 180px; }
.report-preview h2 { color: #c80a32; font-size: 20px; letter-spacing: .04em; margin: 8px 0 4px; }
.report-preview .rp-badge { display: inline-block; background: #2c2a27; color: #fff; padding: 3px 10px; font-size: 11px; letter-spacing: .1em; }
.report-preview .rp-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.report-preview .rp-tile { border: 1px solid #ddd; padding: 8px; }
.report-preview .rp-tile small { display: block; color: #666; text-transform: uppercase; font-size: 9.5px; letter-spacing: .06em; }
.report-preview .rp-tile strong { font-size: 15px; color: #c80a32; }
.report-preview h3 { color: #c80a32; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; border-bottom: 1px solid #e5e5e5; padding-bottom: 3px; }
.report-preview table { font-size: 11.5px; }
.report-preview th { background: #c80a32; color: #fff; padding: 4px 8px; font-weight: 600; text-align: left; }
.report-preview td { padding: 4px 8px; border-bottom: 1px solid #eee; }
.report-preview .rp-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.report-preview .rp-photos figure { margin: 0; }
.report-preview .rp-photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border: 1px solid #ddd; }
.report-preview figcaption { font-size: 10px; color: #666; margin-top: 3px; }
.report-preview .rp-sign { margin-top: 18px; display: grid; gap: 2px; }
.report-preview .rp-sign img { width: 130px; }
.report-preview .rp-diagram { width: 220px; float: right; margin: 0 0 8px 12px; }


/* ---- Record surfaces (Case, Triage, Unidentified, Image, Message) ---- */
.record { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: clip; }
.record-ribbon { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.ribbon-item { padding: 8px 14px; border-right: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.ribbon-item:last-child { border-right: 0; }
.ribbon-item .ribbon-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--quiet); font-weight: 600; }
.ribbon-item .ribbon-value { font-weight: 650; font-size: 14px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ribbon-item .ribbon-value.mono { font-family: var(--mono); font-size: 13.5px; }
.presence-strip { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--blue-bg); color: var(--blue); border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 550; }
.record-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.record-bar .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.record-bar .lease-note { font-size: 12.5px; color: var(--muted); }
.edit-bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--amber-bg); border-bottom: 1px solid var(--amber); color: #5f3a02; font-size: 13px; font-weight: 550; }
.edit-bar .end { margin-left: auto; display: flex; gap: 8px; }
.record-body { padding: 14px; display: grid; gap: var(--gap); }

/* Case workspace */
.case-sticky { position: sticky; top: calc(var(--utility-h) + var(--tabs-h)); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.case-workspace { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--gap); padding: 14px; align-items: start; }
.case-workspace--no-context { grid-template-columns: minmax(0, 1fr); }
.case-main { display: grid; gap: 10px; min-width: 0; }
.case-main .panel-head { min-height: 40px; padding: 6px 14px; }
.case-context { position: sticky; top: calc(var(--utility-h) + var(--tabs-h) + var(--sticky-h, 190px) + 14px); display: grid; gap: var(--gap); }
.case-context .panel-body { padding: 10px 12px; }
.case-context .definition { grid-template-columns: 110px 1fr; font-size: 12.5px; }
.figures { display: grid; gap: 6px; }
.figure { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; }
.figure dt { color: var(--muted); }
.figure dd { font-weight: 650; font-variant-numeric: tabular-nums; }
.figure--big dd { font-size: 17px; }

.section-nav { display: flex; gap: 2px; padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
.section-nav::-webkit-scrollbar { display: none; }
.section-link { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 11px; border: 0; background: transparent; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 550; font-size: 13px; white-space: nowrap; }
.section-link:hover { color: var(--ink); text-decoration: none; }
.section-link[aria-current="true"] { color: var(--ink); border-bottom-color: var(--red); }
.section-link[aria-disabled="true"] { color: var(--quiet); cursor: not-allowed; }
.section-link .condition { font-size: 10.5px; color: var(--quiet); font-weight: 500; }
.section-link .count { font-size: 11px; color: var(--quiet); }
.section-nav .layout-switch { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; align-self: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 2px; }
.layout-switch button { height: 24px; padding: 0 8px; border: 0; background: transparent; border-radius: 2px; font-size: 11.5px; color: var(--muted); }
.layout-switch button[aria-pressed="true"] { background: var(--nav-2); color: var(--nav-text); }

.case-section { scroll-margin-top: calc(var(--utility-h) + var(--tabs-h) + var(--sticky-h, 190px) + 8px); content-visibility: auto; contain-intrinsic-size: auto 520px; }
.case-section > .panel-head h2 { font-size: 15px; }
.case-section .anchor { position: relative; top: -200px; }
.section-placeholder { min-height: 360px; border: 1px dashed var(--line); border-radius: var(--radius-lg); background: repeating-linear-gradient(45deg, transparent 0 12px, var(--surface-2) 12px 24px); }

.case-overview-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.accident-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--surface-2); display: grid; gap: 6px; }
.accident-card p { font-size: 13.5px; }
.parties { display: grid; gap: 4px; }
.party { display: grid; grid-template-columns: 110px 1fr; gap: 10px; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.party:last-child { border-bottom: 0; }
.party dt { color: var(--muted); }
.party dd { font-weight: 550; display: grid; gap: 1px; }
.party dd small { font-weight: 400; color: var(--muted); }

.checks-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.check-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--surface-2); display: grid; gap: 8px; align-content: start; }
.check-card h4 { font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
.check-card .definition { grid-template-columns: 90px 1fr; font-size: 12.5px; }
.suggestion-table td { height: 34px; }
.suggestion-table .diff { color: var(--amber); font-weight: 600; }

@media (max-width: 1180px) { .case-overview-grid { grid-template-columns: 1fr; } .checks-grid { grid-template-columns: repeat(2, 1fr); } .form-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) { .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .pane-layout--3 { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } .pane-layout--3 > :first-child { display: none; } .metric-strip { grid-template-columns: repeat(3, 1fr); } .queue-layout { grid-template-columns: 180px minmax(0, 1fr); } .queue-layout > :last-child { grid-column: 1 / -1; } }
@media (max-width: 900px) { .workflow-stepper { grid-template-columns: 1fr 1fr; } .checks-grid { grid-template-columns: 1fr; } .blocker { grid-template-columns: 1fr; } .note-entry { grid-template-columns: 78px 50px 1fr; } .note-entry .who { display: none; } }
@media (max-width: 760px) { .pane-layout--2, .pane-layout--3, .queue-layout, .case-overview-grid, .form-grid, .form-grid--2, .form-grid--3 { grid-template-columns: 1fr; } .page-actions { width: 100%; } :root { --page-pad: 12px; } .record-ribbon { grid-template-columns: 1fr; } .file-row { grid-template-columns: 24px 1fr; } }


/* ---- Administration ---- */
.admin-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--gap); align-items: start; }
.admin-nav { display: grid; gap: 2px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); position: sticky; top: calc(var(--utility-h) + var(--tabs-h) + 14px); }
.admin-nav a { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 10px; border-radius: var(--radius); color: var(--ink); border-left: 3px solid transparent; font-weight: 500; }
.admin-nav a:hover { background: var(--surface-2); text-decoration: none; }
.admin-nav a[aria-current="page"] { background: var(--surface-3); border-left-color: var(--red); font-weight: 600; }
.admin-nav a .icon { color: var(--quiet); }
.admin-nav a[aria-current="page"] .icon { color: var(--red); }
.admin-content { display: grid; gap: var(--gap); min-width: 0; }
.config-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.rule-row { display: grid; grid-template-columns: 1fr 190px; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.rule-row:first-child { border-top: 0; }
.rule-row .radio-row { justify-content: flex-end; }
.key-field { display: flex; gap: 6px; align-items: center; }
.key-field input { font-family: var(--mono); }
.health-dot-cell { display: inline-flex; align-items: center; gap: 8px; }
.log-filters { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
@media (max-width: 1180px) { .config-grid { grid-template-columns: 1fr; } .log-filters { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 980px) { .admin-layout { grid-template-columns: 1fr; } .admin-nav { position: static; display: flex; overflow-x: auto; } }


/* ---- v26 shell: rail collapse, as on the Case record ---- */
.rail-collapse { margin: 0 10px 6px; min-height: 32px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); color: var(--nav-muted); border-radius: var(--radius); display: flex; align-items: center; gap: 8px; padding: 0 9px; font-size: 11.5px; }
.rail-collapse:hover { background: rgba(255,255,255,.1); color: var(--nav-text); }
.rail-collapse .icon { width: 15px; height: 15px; }
.app-shell.rail-collapsed { --rail: 64px; }
.rail-collapsed .brand { justify-content: center; padding: 10px 6px; }

function btn(label, action, opts = {}) {

// ---- Dialogs (one root, focus trap, inert app) ----
function openDialog(type, data = {}) {
  S.dialog = { type, data };
  S.lastFocus = document.activeElement;
  renderDialog();
}
function closeDialog() {
  S.dialog = null;
  renderDialog();
  if (S.lastFocus && document.contains(S.lastFocus)) S.lastFocus.focus();
}
function renderDialog() {
  const root = document.getElementById('dialog-root');
  const app = document.getElementById('app');
  if (!S.dialog) { root.innerHTML = ''; app.inert = false; return; }
  const spec = DIALOGS[S.dialog.type];
  if (!spec) { console.error('Unknown dialog', S.dialog.type); S.dialog = null; root.innerHTML = ''; app.inert = false; return; }
  const d = spec(S.dialog.data);
  root.innerHTML = `<div class="dialog-backdrop" data-action="dialog-backdrop"><div class="dialog ${d.cls || ''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${d.head === false ? '' : `<header class="dialog-head"><h2 id="dialog-title">${esc(d.title)}</h2>${iconButton('x', 'dialog-close', 'Close')}</header>`}<form class="dialog-form" data-dialog-form="${attr(S.dialog.type)}" novalidate>${d.body ? `<div class="dialog-body">${d.body}</div>` : ''}${d.foot ? `<footer class="dialog-foot">${d.foot}</footer>` : ''}</form></div></div>`;
  app.inert = true;
  const first = root.querySelector('[autofocus], input:not([type=hidden]):not([readonly]), select, textarea, button:not(.icon-button)');
  (first || root.querySelector('.dialog')).focus();
  if (d.mounted) d.mounted(root);
}

  const { cancel = 'Cancel', kind = 'primary', left = '', data = {} } = opts;

    return out;
  }
  const isImage = /\.(jpe?g|png)$/i.test(f.name);
  const reg = (f.name.match(/[A-Z]{2}\d{2}\s?[A-Z]{3}/i) || [])[0];
  if (reg) { const c = DATA.cases.find(x => x.reg.replace(/\s/g, '').toUpperCase() === reg.replace(/\s/g, '').toUpperCase() && x.state !== 'closed'); if (c) return { state: 'stored', outcome: 'associated', caseRef: c.ref, caseId: c.id, detail: `Registration ${reg.toUpperCase()}` }; }

function searchCases(q) {
  const norm = s => String(s || '').replace(/\s/g, '').toLowerCase();
  return DATA.cases.filter(c => {
    if (q.ref && !norm(c.ref).includes(norm(q.ref)) && !norm(c.auditRef).includes(norm(q.ref))) return false;
    if (q.reg && !norm(c.reg).includes(norm(q.reg))) return false;
    if (q.claimant && !c.claimant.name.toLowerCase().includes(q.claimant.toLowerCase())) return false;
    if (q.provider && !norm(c.providerRef).includes(norm(q.provider))) return false;
    if (q.principal && c.principal !== q.principal) return false;
    if (q.state) { if (q.state.startsWith('closed:')) { if (c.state !== 'closed' || c.closedOutcome !== q.state.slice(7)) return false; } else if (c.state !== q.state) return false; }
    if (q.engineer && c.engineer !== q.engineer) return false;
    if (q.from && c.received < q.from) return false;
    if (q.to && c.received > q.to) return false;
    if (q.received && c.received !== q.received) return false;
    if (q.due && c.due !== q.due) return false;
    if (q.origin && c.origin !== q.origin) return false;
    return true;
  }).sort((a, b) => b.received.localeCompare(a.received));

// ---- Router ----
function parseRoute() {
  const raw = (location.hash || '#/').slice(1) || '/';

}
function go(route) { location.hash = route.startsWith('#') ? route : `#${route}`; }

  const { path } = parseRoute();

  const next = `#${path}${q ? `?${q}` : ''}`;
  if (location.hash !== next) history.replaceState(null, '', next);

}
const ROUTES = [
  { re: /^\/signin$/, external: true, page: () => renderSignin(), title: 'Sign in' },
  { re: /^\/connect\/authorize$/, external: true, page: () => renderAuthorize(), title: 'Authorise an automation connector' },
  { re: /^\/intake\/([^/]+)$/, page: (m, p) => renderIntake(m[1], p), title: 'Received file' },
  { re: /^\/cases\/([^/]+)\/suggestions$/, page: m => renderSuggestions(m[1]), title: 'Suggestions' },
  { re: /^\/uploads\/([^/]+)$/, external: true, page: m => renderPublicUpload(m[1]), title: 'Secure file request' },
  { re: /^\/$/, page: () => renderWorkCentre(), title: 'Work Centre' },
  { re: /^\/inbox$/, page: (m, p) => renderInbox(p), title: 'Inbox' },
  { re: /^\/inbox\/([^/]+)$/, page: m => renderMessage(m[1]), title: 'Inbox message' },
  { re: /^\/upload$/, page: () => renderUpload(), title: 'Upload' },
  { re: /^\/cases$/, page: (m, p) => renderCases(p), title: 'Cases' },
  { re: /^\/cases\/new$/, page: (m, p) => renderNewCase(p), title: 'New Case' },
  { re: /^\/cases\/([^/]+)$/, page: (m, p) => renderCase(m[1], p), title: 'Case' },
  { re: /^\/triage\/([^/]+)$/, page: m => renderTriage(m[1]), title: 'Triage' },
  { re: /^\/unidentified\/([^/]+)$/, page: m => renderUnidentified(m[1]), title: 'Unidentified' },

function render() {

  const route = ROUTES.find(r => r.re.test(path)) || { re: /.*/, page: () => notFound(), title: 'Not found' };
  const m = path.match(route.re) || [];

  try { page = route.page(m, params); } catch (e) { console.error(e); page = notFound(); }
  if (page && page.title) { document.title = `${page.title} — Pegasus`; page = page.html; } else document.title = `${route.title} — Pegasus`;

ACTIONS.go = el => { const r = el.dataset.route; closeDialog(); go(r); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');

  if (el.type === 'submit' && el.closest('form')) return; // handled on submit
  const fn = ACTIONS[el.dataset.action];
