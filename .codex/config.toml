# Pegasus delivery-team configuration. The curated 37-package set under
# .codex/skill-packages is exactly the set used by the specialist agents below.
# The main agent is denied every package; each is re-enabled by one specialist.

[mcp_servers."mcp_microsoftdocs"]
url = "https://learn.microsoft.com/api/mcp"
enabled = true

[mcp_servers."azure-mcp"]
command = "npx"
args = ["-y", "@azure/mcp@3.0.0-beta.30", "server", "start"]
enabled = false

