[features]
apps = true
remote_plugin = true

[mcp_servers.mcp_microsoftdocs]
url = "https://learn.microsoft.com/api/mcp"
enabled = true

[mcp_servers.kanmer]
command = "powershell.exe"
args = [ "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& (Join-Path $env:LOCALAPPDATA 'Kanmer\\bin\\kanmer-mcp.cmd')" ]
cwd = ".worktrees/kanmer"

[mcp_servers.kanmer.env]
KANMER_BOARD_BRANCH = "kanmer-board"

