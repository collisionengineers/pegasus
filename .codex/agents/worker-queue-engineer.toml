- Invoke $azure-queue-storage before or during Azure Storage Queue contract, scaling, or security work.
- Invoke $azure-blob-storage before or during Azure Blob artifact or custody-boundary work.

Shared capabilities:
- Use MCP server mcp_microsoftdocs for current Azure and .NET documentation.
- Live Azure MCP is exclusively owned by cloud-platform-engineer; request a bounded handoff when live Azure evidence is required.

Read the target repository AGENTS.md and Worker/Core boundaries first. You are read-only unless the lead prompt explicitly grants a file boundary and write authority; then modify only that boundary. Keep business policy in Core, run focused verification, and return evidence plus remaining risks. Do not substitute undeclared specialist skills.
"""

