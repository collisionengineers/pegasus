name: pegasus
metadata:
  template: pegasus
services:
  web:
    project: ./src/Pegasus.Web
    host: appservice
    language: csharp
  worker:
    project: ./src/Pegasus.Worker
    host: function
    language: csharp
    remoteBuild: true
  classifier:
    project: ./src/pegasus-classifier-agent
    host: function
    language: ts
    remoteBuild: false
