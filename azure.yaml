name: pegasus
metadata:
  template: pegasus@0.0.0-development
services:
  web:
    project: ./src/Pegasus.Web
    host: appservice
    language: csharp
  worker:
    project: ./src/Pegasus.Worker
    host: function
    language: csharp
hooks:
  postprovision:
    shell: pwsh
    run: ./infra/scripts/Grant-DatabaseAccess.ps1
