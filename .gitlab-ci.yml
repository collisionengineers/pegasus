# repository-check
#
# dev is what the hosted test instance runs and what a release deploys, so a
# push to dev runs the full lanes on the merged tree: that pipeline is the
# exact-head evidence the release preflight reads (R683). main receives the
# same SHA once the release's smoke has passed (R682), so a push to main runs
# the history guard alone; its lanes already ran on dev. A merge request into
# main is only the dev -> main promotion: its head is dev, whose push pipeline
# already tests that SHA, and the release lands it by pushing main, never by
# merging the merge request (R682, R691), so it runs nothing.
#
# One live pipeline per merge request: a newer head cancels the superseded
# pipeline. A push to dev or main is never cancelled; the dev pipeline is the
# release-route evidence. Editing a merge request's description starts no
# pipeline: after a change to its "## Migration" section, run a new merge
# request pipeline so the migration class guard reads it (R760).
#
# The lanes run in a child pipeline (.gitlab/ci/lanes.yml) because a job's
# rules cannot read what an earlier job decided: `changes` writes the lanes the
# changed paths need, and the `lanes` trigger passes them down.
#
# Every job runs in the image .gitlab/ci/Dockerfile builds, on a runner tagged
# `pegasus` (docs/runbook.md, "CI runner and image").

workflow:
  name: $PIPELINE_NAME
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        PIPELINE_NAME: dependency-advisories
      auto_cancel:
        on_new_commit: none
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "main"
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main")
      auto_cancel:
        on_new_commit: none

variables:
  PIPELINE_NAME: repository-check

default:
  image: $CI_REGISTRY_IMAGE/ci:1
  tags: [pegasus]
  interruptible: true

stages:
  - changes
  - invariants
  - lanes

changes:
  # Path detection only: no application code runs here. Only the push-to-main
  # history guard needs history, so a push fetches it whole; a merge request
  # checks out its head and fetches the one base commit it diffs against.
  stage: changes
  timeout: 5m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      variables:
        GIT_DEPTH: "0"
    - when: on_success
  script:
    # Require main history to be contained in dev.
    - |
      if [ "$CI_PIPELINE_SOURCE" = push ] && [ "$CI_COMMIT_BRANCH" = main ]; then
        git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev &&
        pwsh ./scripts/Test-MainBranchHistory.ps1 -Before "$CI_COMMIT_BEFORE_SHA" -Head "$CI_COMMIT_SHA" -ReleaseBranch origin/dev
      fi
    # Detect which lanes the changed paths need.
    - pwsh ./.gitlab/ci/Select-Lanes.ps1 -OutputPath lanes.env
  artifacts:
    reports:
      dotenv: lanes.env

invariants:
  # The cheap invariant checks, in one job. They gate every heavy lane
  # (DELIV-043): a broken link used to buy ~85 runner-minutes of tests whose
  # verdict could not change the outcome.
  #
  # Linux, like every lane: the Azure estate is Linux and no check runs on
  # Windows alone, so the documentation link check resolves case-sensitively
  # (R977, reversing R658).
  #
  # It follows `changes` so every lane reads one verdict order, but does not
  # inherit its verdict: `when: always` runs it after a failed path detection,
  # so every change set still gets the one check all of them run.
  stage: invariants
  needs:
    - job: changes
      artifacts: false
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always
  script:
    # Documentation links: the one check every change set runs, including
    # change sets that touch no build-relevant path.
    - pwsh ./scripts/Test-DocumentationLinks.ps1
    # Platform script tests: Test-PegasusPlatform.ps1 dot-sources
    # PegasusPlatform.ps1, the helpers the release and local-run scripts share,
    # including the Linux launcher handover and process-group stop (#2093).
    - pwsh ./scripts/Test-PegasusPlatform.ps1
    # Principal-reference generator tests: the generator and its tests share
    # one scripts-owned component; no application caller or production import
    # is implied.
    - python -m unittest discover -s scripts/reference_data/tests -p 'test_*.py'
    # Skill and helper script tests (PyYAML pinned for the frontmatter parse)
    # and the corpus-holding skill's own test.
    - python -m pip install --disable-pip-version-check PyYAML==6.0.3
    - python -m unittest discover -s scripts/skill_scripts/tests -p 'test_*.py'
    - pwsh ./.agents/skills/pegasus-corpus-holding/scripts/Test-ExportMailboxToCorpusHolding.ps1

lanes:
  # Starts the lanes `changes` selected, once the cheap checks pass. `mirror`
  # gives this job the child pipeline's verdict, so the pipeline is green only
  # when every selected lane is.
  stage: lanes
  needs:
    - job: changes
      artifacts: true
    - job: invariants
      artifacts: false
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  variables:
    LANE_CODE: $LANE_CODE
    LANE_INFRASTRUCTURE: $LANE_INFRASTRUCTURE
    LANE_CLASSIFIER: $LANE_CLASSIFIER
    LANE_MIGRATIONS: $LANE_MIGRATIONS
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
    PARENT_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_IID
  trigger:
    include: .gitlab/ci/lanes.yml
    strategy: mirror

dependency-advisories:
  # The daily schedule (05:17 UTC, on dev). Warnings are errors
  # (Directory.Build.props), so a NuGet audit advisory fails the same locked
  # restore that CI and the runbook use. A failed restore raises one open
  # issue and turns the pipeline red.
  stage: changes
  timeout: 15m
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - pwsh ./.gitlab/ci/Test-DependencyAdvisories.ps1
