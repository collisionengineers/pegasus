services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rag_postgres:/var/lib/postgresql/data

  api:
    build: .
    command: ["sh", "-c", "dotnet CollisionBrain.dll migrate && dotnet CollisionBrain.dll api"]
    environment: &rag_environment
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: Host=postgres;Database=rag;Username=rag;Password=rag
      REPOSITORY_DRIVER: postgres
      OBJECT_STORE_DRIVER: filesystem
      OBJECT_STORE_PATH: /app/.data/objects
      EMBEDDING_DRIVER: local-hash
      EMBEDDING_DIMENSIONS: 384
      AUTH_MODE: none
      MCP_SHARED_SECRET: compose-development-only
      UPLOAD_TOKEN_SECRET: compose-development-only
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "CollisionBrain.dll", "healthcheck", "--url", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - rag_objects:/app/.data/objects

  worker:
    build: .
    command: ["dotnet", "CollisionBrain.dll", "worker"]
    environment: *rag_environment
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - rag_objects:/app/.data/objects

volumes:
  rag_postgres:
  rag_objects:
