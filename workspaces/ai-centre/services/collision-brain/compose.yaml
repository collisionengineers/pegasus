services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rag_postgres:/var/lib/postgresql/data

  api:
    build: .
    command: ["sh", "-c", "node dist/admin/migrate.js && node dist/main.js"]
    environment: &rag_environment
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://rag:rag@postgres:5432/rag
      OBJECT_STORE_DRIVER: filesystem
      OBJECT_STORE_PATH: /app/.data/objects
      EMBEDDING_DRIVER: local-hash
      EMBEDDING_DIMENSIONS: 384
      AUTH_MODE: none
      UPLOAD_TOKEN_SECRET: compose-development-only
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - rag_objects:/app/.data/objects

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment: *rag_environment
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - rag_objects:/app/.data/objects

volumes:
  rag_postgres:
  rag_objects:
